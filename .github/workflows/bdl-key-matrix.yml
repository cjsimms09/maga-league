name: BDL KEY MATRIX — which Ball Don't Lie key authorizes which endpoint?

# Cory, 2026-08-18: "We can get for free from ball don't lie key."
#
# HE MAY WELL BE RIGHT AND THE EXISTING EVIDENCE CANNOT SETTLE IT, because the
# probe that produced our "no" tested ONE of FOUR keys.
#
# free-betting-probe.yml (run 31972024616, 2026-08-16) measured, on
# secrets.BALL_DONT_LIE_API:
#     odds?season&week   401 Unauthorized      <- endpoint EXISTS, key not authorized
#     odds?date=         401 Unauthorized
#     player_props       404 Route not found   <- route does not exist under that name
#     player_odds        404 Route not found
#     teams/players/games          200
#     stats/season_stats/injuries  401
#
# A 401 is not "the data is unavailable" — it is "this key is not entitled." And
# config-check.yml shows FOUR BDL secrets exist in this repo:
#   BALL_DONT_LIE_API · BALLDONTLIE_API_KEY · BALL_DONT_LIE_API_KEY · BALLDONTLIE
# Both the betting probe and key-probe.yml used only the FIRST. If Cory's working
# key is stored under one of the other three, our recorded "no" is about the wrong
# credential — a false limit of exactly the kind that collapsed four times on 08-17
# when someone finally checked.
#
# So this tries EVERY key against EVERY betting surface, plus several route
# spellings, since a 404 may be our guess at the path rather than an absent product.
#
# COSTS NOTHING — BDL free tier, read-only, GET only. Keys are never printed: only
# the secret NAME, a masked length, and the HTTP status.
#
# AND UNLIKE ITS PREDECESSOR IT COMMITS THE RESULT. free-betting-probe.yml ran three
# times, succeeded three times, and left nothing behind — its findings survive only
# in a run log nobody reads, which is the "capture with no product" pattern this
# project keeps finding elsewhere.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Probe every key against every betting surface
        env:
          K1: ${{ secrets.BALL_DONT_LIE_API }}
          K2: ${{ secrets.BALLDONTLIE_API_KEY }}
          K3: ${{ secrets.BALL_DONT_LIE_API_KEY }}
          K4: ${{ secrets.BALLDONTLIE }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          from datetime import datetime, timezone

          BASE = "https://api.balldontlie.io/nfl/v1"
          KEYS = [("BALL_DONT_LIE_API", os.environ.get("K1") or ""),
                  ("BALLDONTLIE_API_KEY", os.environ.get("K2") or ""),
                  ("BALL_DONT_LIE_API_KEY", os.environ.get("K3") or ""),
                  ("BALLDONTLIE", os.environ.get("K4") or "")]

          # Betting surfaces first — they decide whether the free path exists.
          # Several spellings, because a 404 may be OUR guess at the path.
          PATHS = [
              ("odds_season_week", "odds?season=2025&week=1"),
              ("odds_by_date",     "odds?date=2025-09-07"),
              ("player_props",     "player_props?season=2025&week=1"),
              ("player_odds",      "player_odds?season=2025&week=1"),
              ("props",            "props?season=2025&week=1"),
              ("betting_odds",     "betting_odds?season=2025&week=1"),
              ("game_odds",        "game_odds?season=2025&week=1"),
              # supporting data, to tell an ENTITLEMENT problem from a dead key
              ("teams",            "teams"),
              ("stats",            "stats?seasons[]=2025&per_page=2"),
              ("season_stats",     "season_stats?season=2025&per_page=2"),
              ("injuries",         "player_injuries?per_page=2"),
              ("advanced_stats",   "advanced_stats?seasons[]=2025&per_page=2"),
          ]

          def get(url, key):
              req = urllib.request.Request(url, headers={"Authorization": key})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      body = r.read(400).decode("utf-8", "ignore")
                      return r.status, body
              except urllib.error.HTTPError as e:
                  return e.code, e.read(200).decode("utf-8", "ignore")
              except Exception as e:
                  return 0, f"{type(e).__name__}"

          rows, present = [], []
          for name, key in KEYS:
              if not key:
                  rows.append({"key_name": name, "present": False})
                  continue
              present.append(name)
              for label, path in PATHS:
                  code, body = get(f"{BASE}/{path}", key)
                  rows.append({"key_name": name, "key_len": len(key), "endpoint": label,
                               "status": code, "body_head": body[:160]})
                  print(f"  {name:24s} {label:16s} -> {code}")

          def best(label):
              ok = [r for r in rows if r.get("endpoint") == label and r.get("status") == 200]
              return ok[0]["key_name"] if ok else None

          betting = ["odds_season_week", "odds_by_date", "player_props", "player_odds",
                     "props", "betting_odds", "game_odds"]
          winners = {l: best(l) for l in betting}
          any_betting = [l for l, k in winners.items() if k]

          art = {
            "_territory": "TERRITORY: C — written by .github/workflows/bdl-key-matrix.yml",
            "_question": ("Cory 2026-08-18: 'We can get for free from ball don't lie key.' "
                          "The recorded no came from a probe that tested 1 of 4 BDL keys."),
            "captured_at": datetime.now(timezone.utc).isoformat(),
            "keys_present": present,
            "keys_absent": [n for n, k in KEYS if not k],
            "rows": rows,
            "betting_endpoint_authorized_by": winners,
            "verdict": (
                "FREE BETTING PATH EXISTS — " + ", ".join(any_betting)
                if any_betting else
                "NO BDL KEY IN THIS REPO AUTHORIZES ANY BETTING ENDPOINT. 401 means the "
                "endpoint exists and no key is entitled (a paid tier), 404 means the route "
                "does not exist under that spelling. Read `rows` before concluding which."),
          }
          os.makedirs("draft/backtest", exist_ok=True)
          with open("draft/backtest/bdl_key_matrix.json", "w") as f:
              json.dump(art, f, indent=1)
          print("\n" + "=" * 70)
          print(art["verdict"])
          print("=" * 70)
          PY

      - name: Commit the result — the previous probe left nothing behind
        run: |
          set -uo pipefail
          git config user.name lab-bot
          git config user.email lab-bot@users.noreply.github.com
          if [ -n "$(git status --porcelain draft/backtest/bdl_key_matrix.json)" ]; then
            git add draft/backtest/bdl_key_matrix.json
            git commit -m "BDL key matrix: which key authorizes which betting endpoint [skip deploy]"
            pushed=0
            for i in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                pushed=1; break
              fi
              sleep $((2**i))
            done
            # ⛔ AN EXHAUSTED RETRY LOOP MUST FAIL. Register 123: this idiom was
            # `... && break` under `set -uo pipefail` (no -e), so four failed
            # attempts fell through and the job exited 0 having stored NOTHING.
            # Observed live on run 32285390841.
            if [ "$pushed" != "1" ]; then
              echo "::error::all four push attempts failed — the artifact was NOT stored"
              exit 1
            fi
          else
            echo "No change."
          fi
