name: Evidence bundle against a real build

# The eight evidence items that a sandbox cannot produce.
#
# Items 5-7, 9, 13, 15, 25 and 26 were all filed CANNOT PRODUCE for one reason:
# the agent sandbox's egress policy refuses CONNECT to api.sleeper.app and to
# fantasyfootballcalculator.com, so every build there is an offline fixture
# build. GitHub-hosted runners have unrestricted outbound internet — the same
# reason site-check and analyse-drafts work — so CI is the third route, after
# "edit the sandbox policy" and "run it on a desktop", and it is the only one
# that needs nobody to be at a keyboard.
#
# Read the output, do not just note that it is green. The whole point of the
# bundle is numbers a person disagrees with.

on:
  workflow_dispatch:
    inputs:
      league_id:
        description: 'Sleeper league ID (19 digits)'
        required: false
        default: '1374848328470102016'
      slot:
        description: 'My draft slot (1-indexed)'
        required: false
        default: '4'
      commit:
        description: 'Commit EVIDENCE-REAL.md back to the repo'
        type: boolean
        required: false
        default: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install -r draft/requirements.txt

      - name: Prove the runner can actually reach Sleeper
        # Separate, before anything expensive. If this fails the job should say
        # "the network is the problem" rather than dying 6 minutes later inside
        # a pipeline build with a stack trace that blames the build.
        run: |
          code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' \
            https://api.sleeper.app/v1/state/nfl || echo 000)
          echo "api.sleeper.app/v1/state/nfl -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Sleeper unreachable from this runner (HTTP $code). Not a build failure."
            exit 1
          fi

      - name: Regenerate the evidence bundle against a real build
        id: regen
        env:
          LEAGUE_ID: ${{ inputs.league_id || '1374848328470102016' }}
          SLOT: ${{ inputs.slot || '4' }}
        run: |
          set -o pipefail
          mkdir -p draft/evidence
          {
            echo '# Evidence bundle — REAL build'
            echo
            echo '> Generated by `.github/workflows/evidence-real.yml`. Every number below'
            echo '> comes from a live Sleeper pull and a real pipeline build. The sandbox'
            echo '> filed all of these as CANNOT PRODUCE because its egress policy blocks'
            echo '> api.sleeper.app and FFC at CONNECT.'
            echo
            echo "- run: \`${GITHUB_RUN_ID}\`  commit: \`${GITHUB_SHA}\`"
            echo "- league: \`${LEAGUE_ID}\`  slot: \`${SLOT}\`"
            echo "- generated: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`"
            echo
            echo '```'
          } > draft/evidence/EVIDENCE-REAL.md
          # Tee, so the log carries it too — a committed file that failed to
          # commit is otherwise the only copy and it is gone with the runner.
          # GitHub runs steps under `bash -eo pipefail`, so a failing regen.sh
          # would abort this step BEFORE the closing fence is written and before
          # the failure text is flushed — losing the very output that a failed
          # run exists to produce. Disable errexit around the pipeline and read
          # PIPESTATUS[0], so the script's own exit code still decides the job.
          set +e
          bash draft/evidence/regen.sh "$LEAGUE_ID" "$SLOT" 2>&1 \
            | tee -a draft/evidence/EVIDENCE-REAL.md
          status=${PIPESTATUS[0]}
          set -e
          echo '```' >> draft/evidence/EVIDENCE-REAL.md
          echo "regen.sh exit status: $status" >> draft/evidence/EVIDENCE-REAL.md
          exit $status

      - name: Commit the bundle
        # `if: always()` on purpose. A FAILED regen is itself evidence — the
        # CANNOT PRODUCE lines and the reason are exactly what the bundle is
        # for, and losing them because the job went red is how a real finding
        # turns into "the workflow errored".
        if: always() && inputs.commit
        run: |
          # git add FIRST, then check the index: EVIDENCE-REAL.md is untracked
          # on the first run, and `git diff --quiet -- <untracked>` reports no
          # change about a file that is not in the repo at all. That exact bug
          # silently disabled the profile cache once already.
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add -f draft/evidence/EVIDENCE-REAL.md
          if git diff --cached --quiet -- draft/evidence/EVIDENCE-REAL.md; then
            echo "bundle unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "Evidence bundle regenerated against a real build

          Produced by CI, which has the outbound network the agent sandbox does
          not. Covers the items filed CANNOT PRODUCE in EVIDENCE-BUNDLE.md."
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
