name: Weekly grade runner

# THE REPO-SIDE HALF OF THE WEEKLY LEARNING LOOP. The LIVE half is already
# scheduled inside Netlify (netlify.toml): claims-cron (Sun 13:00 UTC) emits
# forecasts and resolves last week's forecasts AND in-season decisions;
# grade-cron (Tue 12:00 UTC) grades everything into the calibration ledger the
# /lineup/accuracy page reads. Neither of those can refresh COMMITTED
# artifacts or prove the shared machinery in CI — that is this job:
#
#   1. regenerate draft/data/component_grades.json (component_write.js —
#      degrades honestly while weekly_realized.json does not exist, every
#      empty row naming the input it awaits, fixture self-check inside);
#   2. run the resolution-pipe self-check: the SAME resolver + grader the
#      live crons use, against real 2023 history with independently
#      hand-summed expected answers. A red run means THE PIPE IS BROKEN —
#      never "the season is quiet"; distinguishing those two states is the
#      entire reason this job exists before week 1.
#
# TUESDAY 13:30 UTC — 90 minutes after grade-cron, so a broken grading week
# and a broken pipe surface the same morning, in the same log column.
#
# Deliberately does NOT curl the live crons: grade-cron's manual key RUNS a
# grading pass (another calibration snapshot), so a "verification" hit would
# double-write the append-only ledger every Tuesday. The live loop's health is
# read from its own schedule logs; this job proves the code both loops share.
on:
  schedule:
    # 12:30 UTC Tuesday — after Netlify's grade-cron (12:00Z) and BEFORE the
    # 13:00Z Tuesday witness routine that verifies the grade (was 13:30Z, which
    # the witness could not see; relay 09-04)
    - cron: '30 12 * * 2'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Run the weekly grade runner (self-checks inside; exit 1 = pipe broken)
        # SITE_URL (repo variable) + GRADE_CRON_KEY (secret) arm step 3, the
        # read-only evidence-weights mirror. Unset = the step SKIPS BY NAME in
        # the log; it never reds a run. The runner also machine-checks REC-2's
        # unlock (graded 2026 weeks) and regenerates the recommendation
        # artifact via learning_loop.py — the loop-closure read side.
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GRADE_CRON_KEY: ${{ secrets.GRADE_CRON_KEY }}
        run: node draft/tools/weekly_grade_runner.js
      # ⭐ DECISION-NULL GRADING, WIRED. Cory, 2026-08-21: "See how we have
      # implemented this grading scale into our model, did we make good change
      # or was this dumb?" It was half-right and it was NOT WIRED -- the
      # adaptation policy named `skill_luck_r.py` as the skill instrument and
      # NOTHING CALLED IT: no grader, no CI, no workflow. A rule with no
      # mechanism decays, which is this project's own standard.
      #
      # This is the mechanism. It grades a DECISION against a constructed null
      # of random legal alternatives (Getty et al.'s Test 3) rather than an
      # outcome against nine other owners (their Test 4, which at our skill
      # spread has 12% power and will not resolve in the lifetime of the
      # league). Its own controls run on every invocation -- a random-lineup
      # owner must land at ~0.5 and an oracle at ~1.0 -- and it exits non-zero
      # if they fail, so a broken instrument reds the run instead of printing a
      # confident number.
      - name: Grade DECISIONS against their nulls (start/sit, waivers, draft picks, drops, keepers)
        # All five run every week and all five gate on their own controls, so
        # a broken instrument reds the run instead of publishing a confident
        # number. The known-negative band is DERIVED from each grader's own
        # sample size -- a hardcoded one was 3.3-3.9x looser than the null it
        # guards (register 194, caught by E).
        run: |
          python3 draft/backtest/start_sit_vs_random.py
          python3 draft/backtest/waiver_vs_random.py
          python3 draft/backtest/draft_pick_vs_random.py
          # THE DROP — the other half of every waiver transaction. 1,026 of
          # them were captured and none were graded until 2026-08-24, which is
          # how the wire came to recommend dropping Ja'Marr Chase (register
          # 277) with nothing measuring the advice.
          python3 draft/backtest/drop_vs_random.py
          # THE KEEPER — the highest-stakes single decision Cory makes (his
          # three 2026 keepers are his three best players). TWO panels, FOUR
          # controls, all gating: panel 1 is keeper-vs-random-name (0.9082,
          # and near-vacuous — real picks score 0.8554 on that same null and
          # are flat at ~0.85 from round 1 to round 15); panel 2 is
          # keeper-vs-a-REAL-PICK-at-that-round, which is the decision, and
          # says NOT RESOLVED. Register 289.
          python3 draft/backtest/keeper_vs_random.py

      - name: Commit the refreshed loop artifacts
        run: |
          git config user.name lab-bot
          git config user.email lab-bot@users.noreply.github.com
          git add draft/data/component_grades.json
          git add draft/backtest/start_sit_vs_random.json
          git add draft/backtest/waiver_vs_random.json
          git add draft/backtest/draft_pick_vs_random.json
          git add draft/backtest/drop_vs_random.json
          git add draft/backtest/keeper_vs_random.json
          git add draft/data/model_update_recommendations.json
          # the mirror only exists once SITE_URL is configured and grade-cron
          # has produced a snapshot — absent is a named preseason state
          git add draft/data/evidence_weights_latest.json 2>/dev/null || true
          # Nothing staged is a no-op (no input moved this week), not a
          # failure — same reasoning as the projection snapshot's commit step.
          git diff --cached --quiet && echo "no change — artifacts already fresh" && exit 0
          git commit -m "weekly loop artifacts: component grades + recommendation refresh [skip deploy]"
          # PUSH WITH A REBASE-RETRY (relay, 09-02): a plain `git push` loses the race
          # whenever another job or a session lands on main first — weekly-grade lost
          # its 09-01 artifacts that way ("! [rejected] main -> main (fetch first)"),
          # the props census lost run 3 the same way. The artifacts are already
          # committed locally, so rebase onto main and try again; a real conflict
          # still fails loudly.
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; echo "::error::rebase failed"; exit 1; }
            if git push -q origin HEAD:main; then echo "pushed on try $i"; exit 0; fi
            sleep $((2**i))
          done
          echo "::error::could not push after 5 tries"; exit 1
