name: Config check (read-only)

# VERIFY A HUMAN CONFIG STEP WITHOUT REVEALING A VALUE.
#
# Built 2026-08-15 when Cory added SITE_URL (repo variable) + GRADE_CRON_KEY
# (repo secret) for the weekly weights mirror and asked "can you check that it
# was done right" — and there was no way to: secrets are unreadable by design,
# and the workflow that consumes them (weekly-grade.yml) only becomes
# dispatchable once it reaches the default branch. This is the gap filler for
# that class of question, kept because the next config step will raise it
# again.
#
# READ-ONLY BY CONSTRUCTION: prints PASS/FAIL per item and string LENGTHS
# only — never a value. Secrets echoed into logs get masked by Actions anyway,
# but this never puts one in a position to be masked.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: SITE_URL repository variable
        env:
          V: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$V" ]; then echo "FAIL  SITE_URL variable is NOT set (Variables tab, not Secrets)"; exit 1; fi
          echo "PASS  SITE_URL is set (${#V} chars)"
          case "$V" in
            https://*) echo "PASS  it starts with https://";;
            *) echo "FAIL  it does not start with https:// — value looks wrong"; exit 1;;
          esac

      - name: GRADE_CRON_KEY repository secret
        env:
          K: ${{ secrets.GRADE_CRON_KEY }}
        run: |
          if [ -z "$K" ]; then echo "FAIL  GRADE_CRON_KEY secret is NOT set (Secrets tab)"; exit 1; fi
          echo "PASS  GRADE_CRON_KEY is set (${#K} chars)"

      - name: The site answers at SITE_URL
        env:
          V: ${{ vars.SITE_URL }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$V/build-stamp.json" || echo 000)
          if [ "$code" = "200" ]; then echo "PASS  $V/build-stamp.json answers 200"; else
            echo "FAIL  $V/build-stamp.json returned $code — check the URL value"; exit 1; fi

      - name: weights-read endpoint (THE endpoint the weekly job actually calls)
        env:
          V: ${{ vars.SITE_URL }}
          K: ${{ secrets.GRADE_CRON_KEY }}
        run: |
          # CORRECTED 2026-08-15, after this check burned three runs testing
          # the WRONG DOOR: the weekly runner calls the read-only weights-read
          # function, NEVER grade-cron's manual key (that would RUN a grading
          # pass as a side effect — the runner's own header forbids it), and
          # grade-cron is a SCHEDULED function whose direct-hit semantics are
          # not a reliable oracle anyway. weights-read is a plain GET, safe to
          # probe. It ships with the relay branch, so until that merges the
          # honest verdict on the live site is NOT-DEPLOYED-YET, not failure.
          body=$(curl -s --max-time 30 -w "\n%{http_code}" "$V/.netlify/functions/weights-read?key=$K" || echo "curl-failed
          000")
          code=$(printf '%s' "$body" | tail -1)
          resp=$(printf '%s' "$body" | head -1 | cut -c1-200)
          case "$code" in
            200) echo "PASS  weights-read answered 200 with the stored key: $resp";;
            401|403) echo "FAIL  weights-read REFUSED the stored key ($code: $resp) — the Netlify GRADE_CRON_KEY and the GitHub secret do not match"; exit 1;;
            404) echo "WAIT  weights-read is not on the live site yet (404) — it deploys with the relay-branch merge; both GitHub values above are verified and nothing more is needed from a human";;
            *) echo "WARN  weights-read returned $code ($resp) — inconclusive; GitHub values above are still verified";;
          esac
