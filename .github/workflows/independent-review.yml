name: Independent review (ChatGPT)

# MANUAL ONLY, DELIBERATELY. No workflow in this repository has a
# `pull_request` trigger, so "the change being reviewed" has no existing
# definition here. Adding one would be a new CI behaviour on every branch, and
# PR runs from forks cannot see Environment secrets at all. Dispatch keeps v1
# to exactly what was asked for and touches nothing that already runs.
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base to diff against"
        default: "origin/main"
      head_ref:
        description: "Head to review"
        default: "HEAD"
      claim_path:
        description: "Path to the agent's claim (what ran / what came back / what it proves / what it does NOT prove / uncertainty / next step)"
        default: ""
      run_tests:
        description: "Run the suites and give the reviewer their real output"
        type: boolean
        default: true
      self_test:
        description: "Grade the REVIEWER against a known-null change instead of reviewing a diff"
        type: boolean
        default: false

# READ-ONLY AT THE PERMISSION LAYER, not only by convention. Nothing here can
# commit, push, comment, or approve even if the script tried to.
permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    # ⚠️ THE LINE THAT MAKES THE SECRET VISIBLE. An Environment secret is
    # invisible to a job that does not name its environment — it resolves to an
    # empty string with no error anywhere. This repo has already paid for that
    # once (see annual-key-smoke.yml). If the environment is renamed, this line
    # changes with it.
    environment: Review_ChatGPT
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a shallow clone cannot diff against origin/main, and
          # the failure looks like "no changes" rather than like an error.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Deps
        # openai is NOT a repository dependency and is installed only here, so
        # nothing in the model pipeline gains a network client as a side effect.
        run: |
          # draft/requirements.txt too (2026-08-18, reviewer's own finding on
          # its first real run): pytest collected draft/tests without numpy
          # and the Python evidence failed at collection — the reviewer then
          # correctly refused to credit "tests pass". Same venv-gap class the
          # main CI fixed the same day; the review run's evidence must be as
          # runnable as CI's.
          pip install --quiet openai pytest -r draft/requirements.txt
          npm ci --silent || npm install --silent

      - name: Prove the key resolved WITHOUT printing it
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # ⚠️ EVALUATED BEFORE THE SHELL EXISTS, AND THAT IS THE WHOLE POINT.
          # `${{ secrets.X }}` for a MISSING secret expands to an EMPTY STRING,
          # so "the secret is absent" and "the secret is present but empty" are
          # indistinguishable once they reach bash. This boolean is the only
          # thing that separates them, and its absence is why two rounds of
          # diagnosis could not get past "present: NO".
          SECRET_NONEMPTY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          # ── THE FOUR-WAY BOUNDARY, in the step that demonstrably RUNS ──────
          # A standalone probe workflow was written first and GitHub held it at
          # `action_required` with ZERO jobs — a newly added workflow needs
          # approval before it executes at all. This step is inside a workflow
          # that has already run twice, so it answers the question today instead
          # of waiting on an approval, and leaves no separate diagnostic file
          # behind afterwards.
          echo "── secret boundary ─────────────────────────────────────────"
          echo "  job declares environment : Review_ChatGPT"
          echo "  1. secrets.OPENAI_API_KEY != ''  : ${SECRET_NONEMPTY:-<unset>}"
          if [ -z "${OPENAI_API_KEY+isset}" ]; then
            echo "  2. env mapping                   : ABSENT (variable unset)"
          elif [ -z "$OPENAI_API_KEY" ]; then
            echo "  3. env var present but EMPTY     : yes"
          else
            echo "  4. env var present, NON-EMPTY    : yes (length ${#OPENAI_API_KEY})"
          fi
          # ⚠️ `toJSON(secrets)` WAS HERE AND IT STOPPED THE WORKFLOW RUNNING.
          # Evidence, not a guess: three runs at 82ce373d executed and returned
          # success; the two runs carrying `toJSON(secrets)` (38516dd and
          # d3fe3485) both came back `action_required` with ZERO jobs and no
          # pending deployment — so nothing was awaiting approval, the run was
          # simply never allowed to start. Enumerating the whole secrets context
          # is treated as exfiltration-shaped whatever the values do.
          #
          # No loss: the key-name list was a nice-to-have. `SECRET_NONEMPTY` is
          # the discriminator, because it is the ONLY thing that separates a
          # missing secret from a present-but-empty one.
          echo "────────────────────────────────────────────────────────────"

          # Prints presence and length only. The value never reaches the log,
          # and a length is not a leak — it is what distinguishes "absent" from
          # "present but truncated".
          # ⚠️ A WARNING, NOT AN ERROR, AND THAT IS THE POINT.
          # The reviewer is advisory. If it could red the job, an OpenAI billing
          # stop would halt model work on an unrelated funding event -- a review
          # step able to break the pipeline it reviews is worse than any defect
          # it could catch. The script records UNAVAILABLE and exits 0; this
          # step only makes the cause visible.
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::warning::OPENAI_API_KEY did not reach this job — the review"
            echo "  will be recorded as UNAVAILABLE, which is NOT an approval."
            echo "  1. the job must declare 'environment: Review_ChatGPT'"
            echo "  2. the environment may restrict which branches can use it"
            echo "  3. a value added under Variables is invisible to secrets.*"
          else
            echo "OPENAI_API_KEY present: YES (length ${#OPENAI_API_KEY})"
          fi

      - name: Make the base ref fetchable
        run: git fetch --quiet origin main || true

      - name: Independent review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'gpt-5' }}
          # Set repo variable REVIEW_PROVIDER=disabled to switch the reviewer
          # off entirely. A supported state, not a fault: nothing in the
          # football system waits on it, so this is how the budget gets
          # protected without letting calls fail.
          REVIEW_PROVIDER: ${{ vars.REVIEW_PROVIDER || 'openai' }}
          REVIEW_EFFORT: ${{ vars.REVIEW_EFFORT || 'high' }}
        run: |
          set -o pipefail
          args="--out review.json"
          if [ "${{ inputs.self_test }}" = "true" ]; then
            args="$args --self-test"
          else
            args="$args --base '${{ inputs.base_ref }}' --head '${{ inputs.head_ref }}'"
            [ "${{ inputs.run_tests }}" = "true" ] || args="$args --no-tests"
            [ -n "${{ inputs.claim_path }}" ] && args="$args --claim '${{ inputs.claim_path }}'"
          fi
          # `|| true` ON PURPOSE AND ONLY HERE. v1 does not gate on the verdict,
          # and the self-test exits non-zero by design when the reviewer misses
          # the planted null — that result must be READ, not turn the job red
          # before the artifact uploads. The next step restates the outcome.
          eval python3 tools/independent_review.py $args | tee review_console.txt || true

      - name: Restate the verdict where the log tail can see it
        run: |
          if [ ! -f review.json ]; then
            echo "::warning::no review.json — the reviewer did not complete. Console:"
            cat review_console.txt 2>/dev/null || true
            exit 0
          fi
          python3 - <<'PY'
          import json
          r = json.load(open('review.json'))
          if r.get('status') == 'UNAVAILABLE':
              # NO VERDICT EXISTS. Say that in the words that matter, because a
              # log that just says "review complete" would read as approval.
              print('=' * 66)
              print('INDEPENDENT REVIEW UNAVAILABLE  (%s)' % r.get('unavailable_kind'))
              print('=' * 66)
              print(r.get('detail', ''))
              print()
              print(r.get('what_this_is_not', ''))
              print(r.get('how_to_proceed', ''))
              raise SystemExit(0)
          print('=' * 66)
          print('VERDICT:', r['verdict'], ' (model', r.get('_model'), ')')
          print('=' * 66)
          for k in ('proven', 'supported', 'not_proven', 'contradicted', 'unknown'):
              v = r.get(k) or []
              print(f'\n{k.upper()} ({len(v)})')
              for i in v[:10]:
                  print('  -', i)
          po = r.get('parity_only_claims') or []
          if po:
              print('\nPARITY-ONLY CLAIMS (agreement is not correctness):')
              for i in po: print('  -', i)
          print('\nCRITICAL FINDINGS')
          for f in r.get('critical_findings') or []:
              print(f"  [{f['severity']}/{f['audit']}] {f['finding']}")
              print(f"      why: {f['why_it_matters']}")
              print(f"      check: {f['how_to_check']}")
          print('\nREQUIRED ACTIONS')
          for a in r.get('required_actions') or []:
              print('  -', a)
          print('\n' + (r.get('reasoning_summary') or ''))
          if r.get('_self_test'):
              ok = r['verdict'] == 'BLOCK'
              print('\nSELF-TEST:', 'PASS' if ok else 'FAIL — the reviewer '
                    'accepted a finding whose threshold sits inside its own '
                    'null band; its other verdicts are unvalidated.')
          PY

      - name: Upload the review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-review
          # review.json and the console transcript only. Neither contains the
          # key: it is never bound into the payload, the prompt, or the output.
          path: |
            review.json
            review_console.txt
          if-no-files-found: warn

      # v1 DOES NOT FAIL THE JOB ON A VERDICT, per the instruction to observe
      # behaviour before gating. When that changes, the gate belongs HERE as an
      # explicit step, not hidden inside the script.
