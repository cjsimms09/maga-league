name: Verify deploy matches HEAD

# Why this exists
#
# Netlify auto-deploys main on push, but nothing PROVED the live site actually
# caught up — a failed or queued deploy would leave the league loading stale code
# with no signal. The build sandbox cannot reach netlify.app; CI can. So after a
# push, this polls the deployed /api/version until it reports the commit we just
# pushed, and FAILS LOUDLY if it never does. A silent deploy failure becomes a
# red X instead of a draft-night surprise.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      site:
        description: 'Site URL'
        required: false
        default: ''

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Poll the deployed build stamp
        env:
          # Repo variable SITE_URL wins; falls back to the known production URL.
          SITE: ${{ inputs.site || vars.SITE_URL || 'https://makefbgreatagain.netlify.app' }}
          WANT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error

          site = os.environ['SITE'].rstrip('/')
          want = os.environ['WANT']
          url = site + '/api/health'           # public, no auth, no league data
          print(f'want commit {want[:12]} at {url}')

          deadline = time.time() + 8 * 60      # Netlify prod deploys are ~1-3 min
          last = None
          while time.time() < deadline:
              try:
                  req = urllib.request.Request(url, headers={'accept': 'application/json',
                      'user-agent': 'mfga-deploy-verify'})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = json.loads(r.read().decode('utf-8'))
                  got = (body.get('commit') or '')
                  last = got
                  if got and (got == want or got.startswith(want[:12]) or want.startswith(got[:12])):
                      backend = body.get('storage_backend')
                      print(f'OK — live site is serving {got[:12]} (context {body.get("context")}, '
                            f'storage {backend})')
                      # Persistence guard: production MUST be on durable Blobs. A
                      # 'file' backend on the live site means ephemeral storage and
                      # silent data loss on the next redeploy — fail loudly.
                      if body.get('context') == 'production' and backend != 'blobs':
                          print(f'::error::live storage_backend is {backend!r}, not durable blobs — '
                                f'ledger/archive would not survive a redeploy')
                          sys.exit(1)
                      sys.exit(0)
                  print(f'  live is {got[:12] or "(no commit)"} — waiting for {want[:12]} ...')
              except urllib.error.HTTPError as e:
                  print(f'  HTTP {e.code} from /api/version — waiting (old build may predate the endpoint) ...')
              except Exception as e:                       # noqa: BLE001
                  print(f'  {type(e).__name__}: {e} — waiting ...')
              time.sleep(20)

          print(f'::error::live site never reported commit {want[:12]} within 8 min '
                f'(last seen: {last or "unreachable / no /api/version"}). '
                f'Deploy may have failed, be queued, or predate the version endpoint.')
          sys.exit(1)
PY
