# FREE NFL ODDS PROBE — Cory 08-21: "Explore free Vegas odds we can get".
# Runs the keyless-source census in CI (where the network is open; the sandbox
# gateway 403s arbitrary hosts). Winners graduate to real capture workflows
# via C. The Thursday cron exists for ONE open question — do player props post
# on the per-event Bovada endpoint once the game week arrives? (Pre-game-week
# they returned zero: "untested, not no", rule 3e.) That is the ledger's props
# row; RETIRE THIS CRON when it grades — a probe that runs forever after its
# question is answered is just noise commits.
name: free-odds-probe
on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 12 * * 4'  # Thursday 12:30 UTC, after the lines capture
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the probe
        run: |
          set -uo pipefail
          python3 draft/tools/free_odds_probe.py
      - name: Commit the census
        run: |
          set -euo pipefail
          git config user.name lab-bot
          git config user.email lab-bot@users.noreply.github.com
          git add draft/backtest/free_odds_probe_2026.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Free-odds probe census: keyless NFL odds sources, known-positive controlled [skip deploy]"
          git pull --rebase origin main
          git push origin HEAD:main
