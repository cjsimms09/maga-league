# TERRITORY: C
name: D3 — daily external ADP snapshot (the 2026 curve is perishable)

# WHY THIS RUNS EVERY DAY, measured rather than assumed. The as-of probe (runs
# 31458991195 / 31459812251) established that NEITHER provider serves ADP as of a
# past date — every date-bounding candidate was accepted and ignored, on both —
# and that the year figure ACCUMULATES: 2025 complete reported 844 drafts against
# 2026 in progress at 112. So a finished season's ADP contains drafts later than
# any league that drafted in August and cannot be its pre-draft board under F5.
#
# The 2026 curve is therefore observable ONLY while it is happening. Every day
# not captured is unrecoverable, and no amount of later work gets it back.
#
# Registered as D3 in INGEST-PLAN.md: daily, FULL board, no top-N and no
# retention window, append-only, deduped by date. NOT draft/data/adp_series.json,
# which is A's home staleness instrument capped at 300 players / 60 days.
#
# `schedule:` only fires from the DEFAULT BRANCH, so merging was the enabling
# action and a feature branch cannot start writing to main on its own. That is
# still true and still the reason a change here is inert until it reaches main —
# TOP_N=700 is sitting on a branch right now for exactly this reason.
#
# ── VERIFIED FIRING, 2026-08-13, so nobody has to re-derive it ──────────────
#
# Three scheduled runs, three successes, three snapshots written:
#   2026-08-11 12:01:44Z -> 705 rows / 115 drafts
#   2026-08-12 12:03:33Z -> 708 rows / 119 drafts
#   2026-08-13 12:03:33Z -> 672 rows / 125 drafts
#
# ⚠ THE CRON SAYS 11:20 AND THE RUNS START AT ~12:02. That is GitHub queuing
# scheduled workflows under load, not a fault, and it is consistent to within two
# minutes across all three days. Do not "fix" the cron to 12:00 — the delay is
# not ours to control and moving the declared time just moves the queue.
#
# ONE CONSEQUENCE, RECORDED BECAUSE IT IS NOT OBVIOUS: standing-check.yml runs at
# 12:00 UTC and therefore evaluates this archive ~2 minutes BEFORE the day's
# capture lands, every day. Its liveness bar is 3 days, so a one-day lag is well
# inside tolerance and this is not a defect — but it does mean the check never
# observes a same-day success, and anyone reading `days_since_last == 1` on a
# healthy morning should know that is the expected reading, not a near-miss.

on:
  schedule:
    - cron: "20 11 * * *"        # 11:20 UTC daily, after MFL's overnight recompute
  workflow_dispatch:
    inputs:
      year:
        description: 'Season to capture'
        required: false
        default: '2026'

permissions:
  contents: write

concurrency:
  # Two runs appending the same day would race on the file. The dedupe makes a
  # double-append harmless in CONTENT, but not in git — the second push would
  # reject and the day would be silently lost.
  group: external-adp-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Capture today's board
        id: cap
        run: |
          python3 - <<'PY'
          import sys, datetime
          sys.path.insert(0, 'draft/backtest')
          import external_adp_capture as C
          year = "${{ github.event.inputs.year || '2026' }}"
          # The date is the RUN's date in UTC, passed in rather than taken inside
          # the pure functions, so the archive logic stays clock-free and testable.
          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          C.capture(year, today)
          PY

      # A CAPTURE JOB THAT DIES SILENTLY IS THE FAILURE THIS PROJECT KEEPS HITTING,
      # and the market layer's version of it recorded a 2% capture as a clean
      # success. `capture()` REFUSES to write an empty snapshot, so a zero-row
      # fetch fails the step rather than writing a dated empty board — and this
      # summary reports the coverage either way.
      - name: Report coverage where it cannot be missed
        id: cov
        if: always()
        run: |
          {
            echo "## D3 external ADP capture"
            if [ -f draft/data/external_adp_series.json ]; then
              python3 - <<'PY'
          import sys, json, os, datetime
          sys.path.insert(0, 'draft/backtest')
          import external_adp_capture as C
          # OUR draft, stated in one place. It lives only in prose today —
          # `draft.start_time` is null in the Sleeper config — so it is
          # named here rather than guessed inside the module.
          DRAFT_DATE = "2026-08-22"
          cov = C.coverage(C.load(), "${{ github.event.inputs.year || '2026' }}")
          print("```")
          print(json.dumps(cov, indent=1))
          print("```")
          if cov["empty_snapshots"]:
              print("**%d EMPTY SNAPSHOT(S)** — dated rows with no board behind them."
                    % cov["empty_snapshots"])

          # ── DAYS WITH NO ROW AT ALL ────────────────────────────────────────
          # A different hole from an empty snapshot and, until now, an invisible
          # one: `snapshots`, `first`, `last` and `empty_snapshots` all read
          # healthy across an outage, because the row count simply rises by less
          # than the calendar did and nothing was subtracting.
          if cov["missing"] is None:
              print("**COVERAGE UNCOUNTED** — %s. Treat this archive's span as "
                    "unknown rather than complete." % cov["gap_note"])
          elif cov["missing"]:
              print("**%d DAY(S) NEVER CAPTURED** across %s..%s. MFL serves no "
                    "as-of-date board, so these are gone permanently:"
                    % (cov["missing"], cov["first"], cov["last"]))
              print("`%s`" % "`, `".join(cov["missing_days"]))
              if cov["missing_listed_truncated"]:
                  print("...and more — %d total, first %d listed."
                        % (cov["missing"], len(cov["missing_days"])))

          # DID *THIS* RUN RESUME FROM AN OUTAGE. Escalates on the day the gap
          # becomes detectable and self-clears afterwards, so a permanent
          # historical hole never makes this job red every morning for ever —
          # red-by-design is how a real alarm gets muted.
          # THE CONDITION LIVES IN THE MODULE, NOT HERE. Written inline in this
          # YAML it had two defects no test could reach — the runner's local
          # clock instead of UTC, and asking a list capped at 14 whether
          # yesterday was absent, which turned the cap into a mute. Both are
          # pinned by tests now. UTC is still stated explicitly at the call.
          today = datetime.datetime.now(datetime.timezone.utc).date()
          resumed = C.missed_yesterday(C.load(),
                                       "${{ github.event.inputs.year || '2026' }}", today)
          # `stale_days`, NOT `missing`. A rehearsal against a dead MFL had this
          # alarm print "0 uncaptured day(s)" while firing correctly: `missing`
          # counts INTERIOR gaps, and a capture that has stopped has none yet.
          # The two answer different questions and this one quotes how far behind
          # the archive is, which is what a resume is about.
          stale = C.days_since_last(C.load(), "${{ github.event.inputs.year || '2026' }}", today)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("resumed=%s\n" % ("1" if resumed else "0"))
              fh.write("missing=%s\n" % (cov["missing"] if cov["missing"] is not None else "?"))
              fh.write("stale_days=%s\n" % ("?" if stale is None else stale))
              # THE SENTENCE IS BUILT IN THE MODULE, where both numbers are and
              # where it is tested. Exactly one of them is zero in each case, so
              # a fixed template always printed a stray nought.
              fh.write("alarm=%s\n" % C.resume_alarm(cov["missing"], stale))

          # ── PLAYERS LEAVING THE BOARD ─────────────────────────────────────
          # Measured 2026-08-13: total_drafts ROSE 115 -> 119 -> 125 while
          # row_count FELL 705 -> 708 -> 672. `min_rows`/`max_rows` reported
          # both extremes truthfully and said nothing about 36 players
          # vanishing in a day.
          #
          # It cost nothing — all 37 sat at ADP 169+, 19 of them IDP this
          # league cannot roster — and the mechanism is MFL's CUTOFF=5 behaving
          # as a PERCENTAGE of drafts: ceil(0.05*drafts) stepped 6 -> 6 -> 7,
          # and the board GREW on the day it did not step. A percentage is a
          # threshold on selection RATE, so marginal players wash out and the
          # survivors stay. This is the source converging, not a defect.
          #
          # WHICH IS WHY THE COUNT MUST NOT BE THE ALARM. 36 deep IDP washing
          # out and 3 draftable receivers vanishing nine days before a draft
          # are the same integer, and the benign case is the daily one — an
          # alarm keyed to the count gets muted before it ever matters. The
          # count goes in the summary; only a loss INSIDE the draft escalates.
          if cov.get("row_drop_note"):
              print("**Board shrank:** %s" % cov["row_drop_note"])
          print("`row_deltas` %s" % (cov.get("row_deltas"),))

          # The boundary is DERIVED from the league config, twice, in the
          # module where it is tested — not written here. `settings.draft_rounds`
          # is 3 (it tracks max_keepers) while the draft is 15 rounds, so the
          # obvious field would put the last pick at 30 and call every draftable
          # loss from 31 to 150 clean.
          lp = {"last_pick": None, "note": "no league settings file on disk"}
          # THE PICK LIST LIVES ON THE BOARD, NOT IN THE LEAGUE SETTINGS, so the
          # settings alone cannot be read — only derived from. Fixing a module
          # and leaving its caller is the same defect one layer out.
          #
          # ⚠️ THE NUMBER THIS ONCE CLAIMED TO FIX WAS ITSELF WRONG. This comment
          # used to say the caller "kept reporting 150 for a 147-pick draft". The
          # draft is 150. Keeper forfeits are OCCUPIED, not removed — verified
          # against league_history, where 2023 (0 keepers), 2024 (23) and 2025
          # (20) are all 150 picks with round 4 opening at overall 31. 147 is
          # `pick_order.live_picks`, how many SELECTIONS happen; the boundary this
          # job wants is DEPTH, how many players leave the pool.
          #
          # Passing `pick_order` is still right, and for the reason that survived
          # the premise being wrong: reading the authoritative list beats deriving
          # from config whichever way the keeper question goes. The read returned
          # the correct number while I had the mechanism backwards.
          if os.path.exists("draft/data/sleeper_league_settings.json"):
              _ls = json.load(open("draft/data/sleeper_league_settings.json"))
              if os.path.exists("public/draft_data.json"):
                  _ls = dict(_ls, pick_order=json.load(
                      open("public/draft_data.json")).get("pick_order"))
              lp = C.draft_last_pick(_ls)
          drop = C.dropped_inside(C.load(),
                                  "${{ github.event.inputs.year || '2026' }}",
                                  last_pick=lp["last_pick"])
          print("Draft boundary: **%s** — %s" % (lp["last_pick"], lp["note"]))
          if drop["verdict"] == "draftable_loss":
              print("**%s**" % drop["note"])
          elif drop["verdict"] == "clean":
              print("Board losses: %d, all outside pick %s — nothing draftable lost."
                    % (drop["outside_n"], lp["last_pick"]))
          else:
              # NOT CHECKED IS NOT CLEAN (rule 13f). A missing config or two
              # disagreeing sources silently stop this checking, and silence
              # here looks exactly like a clean day.
              print("**BOARD-LOSS CHECK DID NOT RUN (%s)** — %s. This is not a "
                    "clean result; nothing was compared." % (drop["verdict"], drop["note"]))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("draftable_loss=%s\n"
                       % ("1" if drop["verdict"] == "draftable_loss" else "0"))
              fh.write("lost_ids=%s\n" % ",".join((drop["inside_ids"] or [])[:12]))

          # ── DID THE SPREAD ARRIVE, AND WHOSE FAULT IF NOT ─────────────────
          # 2026-08-14 is the first capture that can carry dispersion. If MFL
          # does not publish `minPick`/`maxPick` on this endpoint, `dispersion_of`
          # omits every player, THE RUN GOES GREEN, and the log says
          # `dispersion_rows: 0` — a dashboard reading nobody diffs. The spread
          # is as perishable as the mean beside it.
          #
          # A ZERO HAS TWO CAUSES POINTING OPPOSITE WAYS: zero on the first
          # attempt is about our parser (the field names have never matched);
          # zero after a fortnight of non-zero is about the feed. The state
          # names the suspect so the morning it breaks is not spent guessing.
          dh = C.dispersion_health(C.load(), "${{ github.event.inputs.year || '2026' }}")
          if dh["state"] == "present":
              print("Spread: **%d/%d** players carry a dispersion row (%.0f%%)."
                    % (dh["rows"], dh["adp_rows"], 100 * dh["coverage"]))
              # DOES IT BEAT THE CLAMP? The question the capture exists to answer,
              # and it is about a DAY rather than a player. Today's board carries
              # 71 distinct `adp_sd` values across 1,759 players with 94.6% on two
              # of them (1,418 at exactly 30.0, 246 at 15.0). DISTINCT VALUES is
              # the number that decides it — a mean is reported perfectly
              # healthily by a fully collapsed distribution, which is how the
              # clamp survived this long. The estimator is unvalidated against
              # real data until this line runs, so this IS the validation.
              latest = [s for s in C.load()
                        if str(s.get("year")) == "${{ github.event.inputs.year || '2026' }}"][-1]
              sp = C.spread_summary(latest.get("dispersion") or {})
              if sp["status"] == "measured":
                  print("  → **%d distinct** spreads over %d measured players "
                        "(median sd %.1f picks; %d unmeasurable, %d no bounds, "
                        "%d truncated lower bounds). Board today: **71 distinct** "
                        "over 1,759, 94.6%% on two values."
                        % (sp["distinct"], sp["measured"], sp["median_sd"],
                           sp["unmeasurable"], sp["absent"], sp["truncated"]))
              else:
                  print("  → spread summary **unmeasured** — dispersion rows exist "
                        "but none yielded an sd. Not a flat result; nothing measured.")
          else:
              print("Spread: **%s** — %s" % (dh["state"], dh["note"]))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              # ESCALATE ONCE, ON THE RUN THAT FIRST LEARNS IT, then self-clear —
              # the same shape as the resume alarm above and for the same reason
              # argued there. A parser that never matches would otherwise make
              # this job red every morning for ever, and red-by-design is how a
              # real alarm gets muted. It stays in the summary every day.
              fh.write("spread_missing=%s\n"
                       % ("1" if (dh["state"] == "never_captured"
                                  and dh["judged_snapshots"] == 1) else "0"))

          # ── WHICH SNAPSHOT OUR OWN DRAFT WILL USE ─────────────────────────
          # INGEST-PLAN.md:2453 records "board() for draft 2026-08-22 -> the
          # 08-12 snapshot, 708 rows". True when written; the archive has since
          # gained 08-13 with 672 rows. A fact copied into prose goes stale in
          # silence, which is rule 9 — a mechanism implemented as a note.
          #
          # AND IT STATES A DEADLINE NOBODY HAD: F5 takes the latest snapshot
          # STRICTLY BEFORE the draft, so a board captured on draft morning is
          # worth nothing to it. THE LAST CAPTURE THAT CAN MATTER IS 2026-08-21,
          # a day earlier than the date everyone has been working to.
          #
          # The date is passed in, not derived — `draft.start_time` is null in
          # our Sleeper config, so there is nothing to derive it from, and the
          # archive must not hardcode one league's calendar.
          try:
              rd = C.f5_readiness(C.load(), "${{ github.event.inputs.year || '2026' }}",
                                  draft_date=DRAFT_DATE, today=today.isoformat())
              if rd["verdict"] == "ready":
                  print("F5 would use **%s** (%s rows), %s day(s) to the last capture "
                        "that can matter (%s)."
                        % (rd["snapshot_date"], rd["rows"],
                           rd["days_until_last_useful"], rd["last_useful_capture"]))
              if rd["note"]:
                  print("**%s**" % rd["note"])
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("f5_stale=%s\n" % ("1" if rd["stale"] else "0"))
          except Exception as e:                      # noqa: BLE001
              print("**F5 READINESS DID NOT RUN** (%s: %s) — not a clean result."
                    % (type(e).__name__, e))

          # ── CAN WE DECODE WHAT WE CAN DRAFT ───────────────────────────────
          # The third question about this archive, after "is it complete" and
          # "did anyone leave the board". It holds MFL's player ids and every
          # consumer reads ours, so an archive we cannot decode is a container.
          #
          # REPORTED, NOT ESCALATED, and the distinction is the point. A decode
          # miss is a static property of the name matcher, not a perishable daily
          # event — failing the run every morning over a known nickname variant
          # is red-by-design, which is how a real alarm gets muted. The board-loss
          # check above escalates because a vanished day cannot be refetched.
          #
          # THE RAW RATE IS THE MISLEADING ONE: 0.609 across 709 picks, because
          # MFL's board carries DE/DT/LB/CB/S this league cannot roster and three
          # of our own keepers. On the population we can actually draft it is
          # 0.964 — and 99.3% inside pick 150. Reporting the raw figure here would
          # reproduce the false alarm the classification was built to end.
          try:
              board = json.load(open("public/draft_data.json"))
              ls = json.load(open("draft/data/sleeper_league_settings.json"))
              # `C.SERIES`, NOT `C.load()`. The decode key lives on the archive
              # DICT and `load()` returns the series LIST, for which `players_of`
              # honestly returns {} — there is no key in a list. I wrote
              # `players_of(load())` first and this step printed "Decode: 0.0%"
              # rather than failing: an empty key decodes nothing, and nothing
              # decoded is arithmetically indistinguishable from a total matcher
              # failure. `ingest_run` already refuses an empty key by name for
              # exactly this reason; this reporter now does too.
              key = C.players_of(C.SERIES)
              if not key:
                  print("**DECODE UNMEASURED** — the archive carries no decode key, "
                        "so 0% would be a statement about the key and not about the "
                        "matcher. Not a clean result.")
              else:
                  xids, xrep = C.crosswalk_map(
                      key, board["players"], kept=board.get("kept_players"),
                      positions=C.rostered_positions(ls))
                  # NO `or 0` ON A RATE. My first version wrote
                  # `(rate_draftable or 0)`, which turns the module's honest None —
                  # "nothing draftable to measure" — into a printed 0.0%, the exact
                  # null-as-absence this project keeps hitting, in the line written
                  # to report honestly.
                  rd = xrep["crosswalk_rate_draftable"]
                  print("Decode: **%s** of the draftable population (%.1f%% raw — the "
                        "raw figure counts IDP this league cannot roster and our own "
                        "keepers)"
                        % ("UNMEASURED" if rd is None else "%.1f%%" % (100 * rd),
                           100 * xrep["crosswalk_rate"]))
                  print("`kept_not_draftable` %d · `position_not_rostered` %d · "
                        "undecoded at a rostered position: **%d**"
                        % (xrep["kept_not_draftable"], xrep["position_not_rostered"],
                           xrep["no_sleeper_match_draftable"]))
          except Exception as e:                      # noqa: BLE001
              # A DECODE REPORT THAT DIES MUST NOT TAKE THE SNAPSHOT WITH IT.
              # This step is `if: always()` and the commit below is gated on the
              # CAPTURE's outcome, but an exception here still aborts the step and
              # the day's board is the thing that cannot be refetched.
              print("**DECODE CHECK DID NOT RUN** (%s: %s) — not a clean result."
                    % (type(e).__name__, e))
          PY
            else
              echo "NO ARCHIVE FILE — nothing has been captured yet. This is a statement"
              echo "about the run, not evidence that ADP is unavailable."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the day's snapshot
        if: steps.cap.outcome == 'success'
        run: |
          # PIN THE BOARD (C). The oracle-capture series gets a TOOL ARM from 2026
          # onward and only if the board the tool used is recoverable. Git already
          # holds every revision of public/draft_data.json; the gap is knowing WHICH
          # COMMIT held it on draft day, a year later. So this records the sha and a
          # digest -- a few bytes -- rather than copying ~2MB a day of something git
          # already has. Pinned DAILY so nobody has to act on one specific date; the
          # 2027 reader takes the last pin STRICTLY BEFORE the draft.
          #
          # ⚠ THE PIN MUST NOT BE ABLE TO KILL THE SNAPSHOT. Rule 17a's sibling,
          # and demonstrated rather than argued: with the pin raising, the day's
          # ADP snapshot did not reach the remote at all, because `run:` executes
          # under `bash -e` and the `git add` below never ran.
          #
          # The two artifacts are NOT equally valuable. The pin is RECOVERABLE —
          # git already holds every revision of the board, and a 2027 reader can
          # reconstruct which commit held it on any date. The ADP snapshot is NOT:
          # MFL serves no as-of-date board, which is the measured finding this
          # whole archive exists because of. So a failure in the recoverable thing
          # was destroying the unrecoverable one.
          #
          # PRESERVE BEFORE YOU ALARM. The pin's failure is caught, the snapshot is
          # committed and pushed, and THEN the run goes red — same shape as moving
          # the gap alarm after the commit, for the same reason.
          # ⚠ A DISPATCH FROM A FEATURE BRANCH MUST NOT REACH main. This step ends
          # `git push origin HEAD:main`, and on a branch checkout HEAD is the
          # BRANCH TIP — so a manual run from a branch would push that whole
          # branch to main, bypassing integration. INERT ON THE SCHEDULED PATH:
          # `schedule:` only fires from the default branch, so ref_name is always
          # main there and this changes nothing about tonight's capture.
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Dispatched from '$GITHUB_REF_NAME', not main — NOT committing."
            exit 0
          fi
          pinfail=0
          python3 - <<'PIN' || pinfail=1
          import json, os, subprocess, sys
          sys.path.insert(0, "draft/backtest")
          import board_pin as BP
          path = "public/draft_data.json"
          if os.path.exists(path):
              raw = open(path, "rb").read()
              sha = subprocess.run(["git", "rev-parse", "HEAD"],
                                   capture_output=True, text=True).stdout.strip()
              day = subprocess.run(["date", "-u", "+%Y-%m-%d"],
                                   capture_output=True, text=True).stdout.strip()
              cur = None
              if os.path.exists(BP.SERIES):
                  cur = json.load(open(BP.SERIES))
              doc = BP.append(BP.pin(raw, sha, day), cur)
              json.dump(doc, open(BP.SERIES, "w"), indent=1)
              print("board pinned: %s @ %s" % (day, sha[:8]))
          else:
              print("no board to pin — reported, not silently skipped")
          PIN
          if [ "$pinfail" = 1 ]; then
            echo "::error::BOARD PIN FAILED — the 2026 tool arm loses today's pin."
            echo "::error::Committing the ADP snapshot FIRST; this run goes red below."
          fi
          git config user.name "lab-bot"; git config user.email "actions@github.com"
          git add draft/data/external_adp_series.json draft/data/board_pins.json || true
          git diff --cached --quiet && { echo "no change — same-day rerun"; exit "$pinfail"; }
          # [skip deploy]: this is a data archive under draft/, which the deploy
          # gate already skips. The marker is belt-and-braces, not a substitute
          # for the gate.
          git commit -m "D3: external ADP snapshot [skip deploy]"
          # RETRY THE RACE. A single `pull --rebase && push` loses the whole day
          # if anything lands in the gap, and the day cannot be refetched — no
          # provider serves a board as of a past date, so a lost push is a
          # permanently lost observation rather than a deferred one.
          #
          # THE COLLISION IS NOT HYPOTHETICAL: draft-data.yml runs `0 11 * * 2`
          # and this runs `20 11 * * *`, twenty minutes behind it every Tuesday.
          # Same shape and same reasoning as backtest.yml, which already retries
          # for a report that IS regenerable.
          for i in 1 2 3 4 5; do
            git fetch origin main
            # SAY WHAT GIT ACTUALLY SAID. This read "REBASE CONFLICT" for ANY
            # rebase failure — a workflow rehearsal hit it with a dirty tree and
            # was sent looking for a conflict that did not exist. A wrong
            # diagnosis at 11:20 UTC, on a day that cannot be refetched, costs
            # more than the extra three lines.
            if ! _out="$(git rebase origin/main 2>&1)"; then
              echo "REBASE FAILED — reporting, not forcing. git said:"
              echo "$_out" | sed 's/^/    /'
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "snapshot pushed"
              # THE SNAPSHOT IS SAFE. Only now may a pin failure fail the run.
              exit "$pinfail"
            fi
            echo "push race, retry $i"; sleep 3
          done
          echo "SNAPSHOT COULD NOT BE PUSHED after retries — TODAY'S BOARD IS LOST"
          echo "and cannot be refetched. Rerun today, not tomorrow."
          exit 1
      # ── EVERY SOURCE'S OWN PRICE, AFTER THE DAY IS SAFE ────────────────────
      #
      # `adp_series.json` stores the MERGED price with no source field, so every
      # day we record what the anchor said and destroy what every other source
      # said. `merge_primary_over_ffc` overwrites 211 of FFC's 215 prices — 144
      # inside the draftable board, including Allen, Lamar, Burrow, Maye, Daniels,
      # Hurts, Herbert and Prescott — and none of it is recoverable, because
      # neither provider serves ADP as of a past date. The anchor question ("does
      # FFC actually price quarterbacks earlier, and by how much") is unanswerable
      # from disk, and would be unanswerable next August too.
      #
      # ⚠ IT RUNS AFTER THE COMMIT AND IT `continue-on-error`s, DELIBERATELY, FOR
      # THE SAME REASON THE ALARM BELOW IS LAST. The MFL snapshot is the
      # perishable, unrefetchable thing. A NEW FETCH MUST NOT BE ABLE TO COST IT A
      # DAY — not by failing, not by timing out, not by turning the job red before
      # the commit. Every failure mode here is a missing day in ITS OWN archive,
      # which is regrettable and recoverable-ish; a missing day in the snapshot is
      # neither.
      #
      # It writes a SEPARATE FILE and commits separately, so a half-written source
      # archive can never appear inside the snapshot commit.
      - name: Record what each source said, separately
        if: always() && steps.cap.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        run: |
          # THE LOGIC IS IN A MODULE, NOT HERE, AND THAT IS THE FIX RATHER THAN A
          # TIDY-UP. This step was fifty lines of Python inline, and it guessed at
          # both providers' APIs: it passed `FP.fetch(year)` — which returns
          # `(text, url, diag)` — straight into `FP.parse` as html, and keyed FFC
          # rows on `entry["player_id"]`, a field FFC does not send. NEITHER GUESS
          # RAISES. Both produce an empty dict, the step goes green, and the
          # archive gains a dated row with no board behind it — which every later
          # coverage report counts as a captured day. Code inside YAML cannot be
          # tested, which is exactly how both defects got written.
          # TEE'D INTO THE STEP SUMMARY, because the number this archive exists
          # to produce — the per-position gap between what FFC and FantasyPros
          # charge for the same player — is the whole point of recording it, and
          # a figure that only ever lands in a job log is a figure nobody reads
          # (rule 14: the consumer exists the day the writer does).
          # ⚠ `|| rc=$?`, NOT a bare pipeline followed by `rc=$?`. `run:` executes
          # under `bash -e`, so a failing pipeline ABORTS THE STEP AT THAT LINE —
          # the closing fence and the failure note below would never be written,
          # and the summary would end mid-code-block on exactly the runs that
          # have something to say. Same shape as the pin failure that once killed
          # the snapshot commit: the reporting path must survive what it reports.
          set -o pipefail
          rc=0
          {
            echo "## Per-source ADP prices"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 draft/backtest/external_source_run.py \
            --year "${{ github.event.inputs.year || '2026' }}" \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" = 0 ] || echo "**NO SOURCE CAPTURED** — see the log above. The day's MFL snapshot is committed and unaffected." >> "$GITHUB_STEP_SUMMARY"
          # COMMIT WHATEVER LANDED FIRST, THEN FAIL. When one source recorded and
          # the other did not, `rc` is 0 and the day is real; when NOTHING
          # recorded, `rc` is 1 and there is nothing staged, so this block is a
          # no-op either way — the ordering is the same rule the pin follows one
          # step up. Preserve before you alarm.
          # ⚠ A DISPATCH FROM A FEATURE BRANCH MUST NOT REACH main. This step ends
          # `git push origin HEAD:main`, and on a branch checkout HEAD is the
          # BRANCH TIP — so a manual run from a branch would push that whole
          # branch to main, bypassing integration. INERT ON THE SCHEDULED PATH:
          # `schedule:` only fires from the default branch, so ref_name is always
          # main there and this changes nothing about tonight's capture.
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Dispatched from '$GITHUB_REF_NAME', not main — NOT committing."
            # ⚠ `exit "$rc"`, NOT `exit 0`. The guard exists to stop a branch
            # dispatch WRITING, not to hide what the run found — and a rehearsal
            # showed it swallowing a total capture failure into a green step. The
            # production path was already correct (on main the guard never fires
            # and `exit "$rc"` runs below), and "the production path is fine" is
            # precisely the reasoning that lets a failure-reads-as-success
            # survive somewhere less visible.
            exit "$rc"
          fi
          git add draft/data/external_source_prices.json || true
          if ! git diff --cached --quiet; then
            git config user.name "lab-bot"; git config user.email "actions@github.com"
            git commit -m "D3: per-source ADP prices [skip deploy]"
            # A PUSH THAT NEVER SUCCEEDED MUST NOT READ AS SUCCESS. The loop
            # used to `break` on success and otherwise simply run out of
            # iterations — nothing told the two apart, `exit "$rc"` carried the
            # runner's 0, and the step went green having lost the day. The CI
            # checkout is discarded when the job ends, so an unpushed commit is
            # gone. Same failure the MFL step's own `SNAPSHOT COULD NOT BE
            # PUSHED` exit exists for, one step up.
            pushed=0
            for i in 1 2 3 4 5; do
              git fetch origin main || true
              git rebase origin/main || { git rebase --abort 2>/dev/null || true; }
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep $((i*5))
            done
            if [ "$pushed" != 1 ]; then
              echo "::warning::PER-SOURCE PRICES COULD NOT BE PUSHED after 5 tries."
              echo "::warning::Neither provider serves ADP as of a past date, so"
              echo "::warning::today's alternatives are lost unless this is rerun TODAY."
              echo "**PER-SOURCE PRICES NOT PUSHED** — rerun today, not tomorrow." \
                >> "$GITHUB_STEP_SUMMARY"
              rc=1
            fi
          fi
          # AND NOW THE STEP CARRIES THE RUNNER'S VERDICT. Without this the step
          # goes GREEN on a total capture failure — `[ ... ] || echo` succeeds, so
          # the last command's status is 0 and "no source reached us at all" reads
          # exactly like a clean morning. `continue-on-error: true` still keeps the
          # JOB green and the MFL snapshot untouched; this only makes the failure
          # visible, which is the entire difference between a day missing and a
          # fortnight missing.
          exit "$rc"

      # ── IS THE BOARD FRESH, AND WAS IT REBUILT OR ONLY EDITED ─────────────
      #
      # Nothing measured this, and on 2026-08-14 I was watching for a late
      # nightly rebuild by hand — which is a mechanism implemented as a person
      # staring at a terminal. The pin has carried `sha256` AND `built_at` since
      # it was written; nothing read them together.
      #
      # Neither answers it alone, measured rather than supposed: three commits
      # that morning carried three different digests and the SAME `built_at`, and
      # 136 of the first 400 player rows differed. `built_at` alone calls that
      # board unchanged; the digest alone calls it rebuilt. A nightly build that
      # quietly stops firing stays invisible to the digest for as long as anyone
      # keeps editing the file in place.
      #
      # Runs AFTER the pin is committed so today's pin is in the series. Reads
      # bytes already on disk — worst case is a missing paragraph.
      - name: Is the board fresh, and was it rebuilt or edited
        if: always() && steps.cap.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 - <<'AGE' >> "$GITHUB_STEP_SUMMARY"
          import datetime, json, sys
          sys.path.insert(0, "draft/backtest")
          print("## Board freshness")
          try:
              import board_pin as BP
              today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
              ser = (json.load(open(BP.SERIES)) or {}).get("series") or []
              r = BP.staleness(ser, today=today)
              if r["state"] == "unmeasured":
                  print("**UNMEASURED** — %s" % r["note"])
              else:
                  print("state **%s** · content last changed `%s` (%s day(s) ago)"
                        % (r["state"].upper(), r["last_content_change"],
                           r["days_since_content_change"]))
                  if r["rebuild_measurable"]:
                      print("last rebuild `%s` (%s day(s) ago)"
                            % (r["last_rebuild"], r["days_since_rebuild"]))
                  else:
                      print("**REBUILD AGE UNMEASURABLE** — %s" % r["note"])
                  if r["state"] == "edited":
                      print("⚠ **EDITED IN PLACE, NOT REBUILT** — the artifact "
                            "changed and the pipeline did not run. `built_at` no "
                            "longer describes this file.")
          except Exception as e:                      # noqa: BLE001
              print("**FRESHNESS CHECK DID NOT RUN** (%s: %s) — not a clean "
                    "result; nothing was measured." % (type(e).__name__, e))
          AGE

      # ── WHERE THE PLATFORM OUR ROOM DRAFTS ON DISAGREES WITH THE PRICE ────
      #
      # `board_vs_market.sleeper_divergence` had no caller. I built it this
      # morning, measured a real effect with it — Sleeper places quarterbacks a
      # median 36 slots earlier than the market price, inside the draftable 150 —
      # and then left the function sitting there, which is rule 14 exactly: the
      # consumer has to exist the day the writer does, or the number is only ever
      # true on the day somebody happens to run it by hand.
      #
      # ⚠ AFTER THE COMMIT, `always()` AND `continue-on-error`, for the reason
      # spelled out twice above: the MFL snapshot is the unrefetchable thing and
      # no report may cost it a day. This one reads bytes already on disk, so its
      # worst case is a missing paragraph in a summary.
      - name: Where Sleeper disagrees with the price
        if: always() && steps.cap.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 - <<'DIV' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          sys.path.insert(0, "draft/backtest")
          print("## Sleeper ordering vs the market price")
          try:
              import board_vs_market as BM
              board = json.load(open("public/draft_data.json"))
              r = BM.sleeper_divergence(board)
              if r["status"] != "measured":
                  # NOT CHECKED IS NOT CLEAN (rule 13f). `collapsed` and
                  # `unmeasured` are real states and each names its own cause.
                  print("**%s** — %s" % (r["status"].upper(), r.get("note")))
              else:
                  print("`%d ranked`, `%d parked at a sentinel` (%s), "
                        "`%d distinct` Sleeper ranks."
                        % (r["ranked"], r["unranked"], r["sentinels"], r["distinct"]))
                  print("")
                  print("| pos | n | median | mean |")
                  print("|---|---|---|---|")
                  for k, v in r["by_position"].items():
                      print("| %s | %d | %+.1f | %+.1f |"
                            % (k, v["n"], v["median"], v["mean"]))
                  print("")
                  print("Negative = Sleeper places the player EARLIER than the "
                        "market. `sleeper_rank` is a SEARCH ordering, not a "
                        "draft-position estimate — this is a mechanism with a "
                        "sign, not evidence anybody drafted off the list.")
          except Exception as e:                      # noqa: BLE001
              print("**DIVERGENCE CHECK DID NOT RUN** (%s: %s) — not a clean "
                    "result; nothing was compared." % (type(e).__name__, e))
          DIV

      # ── IS THE MARKET WE COMPARE AGAINST EVEN PLAYING OUR GAME ─────────
      #
      # A's criterion 1 — "are the two ends of this comparison denominated in the
      # same thing" — turned on the market side of every comparison in this
      # workflow. MFL is not A market: it is EVERY draft on its platform pooled,
      # so superflex, 2QB, dynasty, keeper and room sizes from eight to sixteen
      # all land in one average. That sat in a docstring as a caveat for two days.
      # Measured 2026-08-14 it is the largest effect in the comparison:
      # quarterbacks a median 49.8 rank slots earlier than our board prices them,
      # and among non-quarterbacks the shift tracks AGE at rho +0.425.
      #
      # IT RUNS DAILY BECAUSE THE COMPOSITION MOVES. MFL's pool in mid-August is
      # not its pool the week of the 22nd — best-ball and dynasty startups run
      # early, single-QB redraft rooms fill in late — so a composition measured
      # once and filed is a fact about the day it was taken. The one number that
      # matters on the 22nd is whether it is still this contaminated.
      - name: Whose game is the market playing — format composition
        id: fmt
        if: always() && steps.cap.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 - <<'FMT' >> "$GITHUB_STEP_SUMMARY"
          import json, os, sys
          sys.path.insert(0, "draft/backtest")
          print("## Is the market drafting our format?")
          flags, standing = [], []
          try:
              import board_vs_market as BM
              arc = json.load(open("draft/data/external_adp_series.json"))
              brd = json.load(open("public/draft_data.json"))
              f = BM.format_composition(arc, brd)
              if f["status"] != "measured":
                  # THIN AND UNMEASURED ARE DIFFERENT FACTS AND BOTH ARE STATES.
                  # "Not checked" is not "clean" (rule 13f), and a thin crosswalk
                  # is a crosswalk finding rather than a market one.
                  print("**%s** — %s" % (f["status"].upper(), f.get("note")))
                  if f["status"] == "thin":
                      flags.append("crosswalk thin: %d players" % f["n"])
              else:
                  print("`%d` players crosswalked inside pick %d on %s "
                        "(`%d` carry an age, `%d` do not)."
                        % (f["n"], f["top_n"], f["observed_at"], f["aged"], f["no_age"]))
                  print("")
                  print("| pos | n | median rank delta |")
                  print("|---|---|---|")
                  for k, v in f["by_position"].items():
                      print("| %s | %d | %+.1f |" % (k, v["n"], v["median"]))
                  print("")
                  sfx, dyn = f["superflex"] or {}, f["dynasty"] or {}
                  print("- **superflex/2QB**: QB median `%+.1f` slots against a "
                        "`%.1f` threshold (one round of our fifteen, over the `%d` "
                        "ranked) → **%s**"
                        % (sfx.get("qb_median_slots", 0.0),
                           sfx.get("threshold_slots", 0.0),
                           sfx.get("ranked_over", 0),
                           "DETECTED" if sfx.get("detected") else "not detected"))
                  print("- **dynasty/keeper**: age rho among the `%d` "
                        "non-quarterbacks `%s` against `%.2f` → **%s**"
                        % (dyn.get("n", 0), dyn.get("age_rho_non_qb"),
                           dyn.get("threshold_rho", 0.0),
                           "DETECTED" if dyn.get("detected") else "not detected"))
                  print("")
                  print(f["note"])
                  # ⚠ STANDING, NOT ESCALATED. The market has been contaminated
                  # on every day we hold, so escalating on the CONDITION would
                  # turn this red every morning and therefore unread by the 22nd.
                  # What escalates is a CHANGE in it, or the instrument breaking.
                  if sfx.get("detected"):
                      standing.append("superflex (QB %+.1f slots)" % sfx["qb_median_slots"])
                  if dyn.get("detected"):
                      standing.append("dynasty (age rho %+.3f)" % dyn["age_rho_non_qb"])
                  print("")
                  print("| the market takes these EARLIEST vs our board | pos | age | board | market | delta |")
                  print("|---|---|---|---|---|---|")
                  for r in f["rows"][:8]:
                      print("| %s | %s | %s | %.1f | %.1f | %+.1f |"
                            % (r["name"], r["position"], r["age"],
                               r["board_adp"], r["market_adp"], r["delta"]))

              s = BM.spread_composition(arc, brd)
              print("")
              print("### And is its SPREAD the same quantity as `adp_sd`?")
              if s["status"] != "measured":
                  print("**%s** — %s" % (s["status"].upper(), s.get("note")))
              else:
                  print("Per pick, on `%d` paired players: market `%.3f`, board "
                        "`%.3f` — a ratio of `%.2f`. The part the board's own "
                        "within-format disagreement cannot account for is `%.3f`, "
                        "or `%.0f%%` of the market's variance."
                        % (s["n"], s["market_cv"], s["board_cv"], s["ratio"],
                           s["excess_cv"], 100.0 * (s["excess_share_of_variance"] or 0)))
                  print("")
                  print("| band (board adp) | n | market cv | board cv |")
                  print("|---|---|---|---|")
                  for k, v in s["by_band"].items():
                      print("| %s | %d | %.3f | %.3f |"
                            % (k, v["n"], v["market_cv"], v["board_cv"]))
                  print("")
                  print(s["note"])
                  print("")
                  print("_Two explanations were killed before that one: SKEW in "
                        "the range estimator (real — the mean sits 0.35-0.39 through "
                        "its own range, not 0.50 — but calibrated to it the "
                        "estimator is unbiased, x1.02 at n=125), and SUPERFLEX "
                        "widening quarterbacks (QB has the SMALLEST ratio of any "
                        "position, 2.2 against 4.0 at receiver)._")
              # ── AND IS IT THE SAME POOL IT WAS YESTERDAY ────────────────
              # Contamination is the steady state — the market has been mixed on
              # every day we hold — so a step that reports it each morning is a
              # number nobody diffs (rule 9). What is worth waking up for is a
              # CHANGE, and the archive already carries every day's rows, so the
              # comparison costs nothing but reading them.
              tr = BM.format_trend(arc, brd)
              print("")
              print("### Is it the same pool it was yesterday?")
              if tr["status"] != "measured":
                  print("**%s** — %s" % (tr["status"].upper(), tr.get("note")))
              else:
                  print("| day | n | QB slots | as a fraction | superflex | age rho | dynasty |")
                  print("|---|---|---|---|---|---|---|")
                  for d in tr["days"]:
                      print("| %s | %s | %s | %s | %s | %s | %s |"
                            % (d["observed_at"], d["n"], d["qb_median_slots"],
                               d["qb_median_fraction"], d["superflex"],
                               d["age_rho_non_qb"], d["dynasty"]))
                  print("")
                  print(tr["note"])
                  if tr["moving"] or tr["flipped"]:
                      flags.append("composition drift %+.3f%s"
                                   % (tr["drift"],
                                      (" — %s FLIPPED" % ",".join(tr["flipped"]))
                                      if tr["flipped"] else ""))
          except Exception as e:                      # noqa: BLE001
              print("**FORMAT CHECK DID NOT RUN** (%s: %s) — not a clean result; "
                    "nothing was compared." % (type(e).__name__, e))
              flags.append("format check crashed: %s" % type(e).__name__)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("flags=%s\n" % ("; ".join(flags) or ""))
              fh.write("standing=%s\n" % ("; ".join(standing) or ""))
          FMT

      # ── IS TODAY'S DATA TRUSTWORTHY AT ALL ─────────────────────────────
      #
      # Cory, 2026-08-14: "the daily data capture process needs to be correct...
      # the data itself needs to be accurate and we need understand what it means
      # so we don't misuse it." This is that check, and it runs before anything
      # reads the day.
      #
      # TWO CATEGORIES, because conflating them is how a real alarm gets muted.
      # FATAL is arithmetically impossible — an ADP outside its own min/max means
      # `averagePick` and the range are not describing one population, and the
      # marginal-ADP derivation assumes they are. OBSERVED is MFL disagreeing with
      # itself every day in a way now measured and bounded: 25 players with a
      # per-player count above `totalDrafts`, worst excess 3 on a pool of 127.
      #
      # Reporting the second as a failure would make this red every morning and
      # therefore ignored. Not reporting it would lose the day the excess jumps
      # from 3 to 30 — which is why the magnitude is printed, not just the fact.
      - name: Is today's data trustworthy — the invariants, and MFL against itself
        id: audit
        if: always() && steps.cap.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 - <<'AUD'
          import json, os, sys
          sys.path.insert(0, "draft/backtest")
          _sum = os.environ.get("GITHUB_STEP_SUMMARY")
          fh = open(_sum, "a") if _sum else sys.stdout
          def md(x=""): print(x, file=fh)
          md("## Is today's data trustworthy")
          bad = 0
          try:
              import external_adp_capture as C
              year = "${{ github.event.inputs.year || '2026' }}"
              days = [s for s in C.load() if str(s.get("year")) == year]
              today = days[-1] if days else None
              r = C.snapshot_audit(today or {})
              md("`%s` — %d players, %d invariant(s) checked."
                 % ((today or {}).get("observed_at"), r["players"], len(r["checked"])))
              if r["fatal"]:
                  bad = 1
                  md("")
                  md("| FATAL | detail |")
                  md("|---|---|")
                  for f in r["fatal"]:
                      md("| `%s` | %s |" % (f["kind"], f["note"][:220]))
              else:
                  md("")
                  md("**No fatal finding.** Every invariant that cannot be wrong held.")
              if r["observed"]:
                  md("")
                  md("| known inconsistency | n | worst | bound |")
                  md("|---|---|---|---|")
                  for o in r["observed"]:
                      md("| `%s` | %s | %s | %s |"
                         % (o["kind"], o.get("n"), o.get("worst_excess", o.get("worst")),
                            o.get("bound", "—")))
                  md("")
                  md("These are MFL disagreeing with ITSELF, not our pipeline. "
                     "`total_drafts` is the provider's aggregate and it lags its "
                     "own per-player counts, so it is **not an exact bound and "
                     "decides nothing** — the marginal day is derived from "
                     "per-player `drafts`, which are exact integers.")
          except Exception as e:                      # noqa: BLE001
              bad = 1
              md("**THE AUDIT DID NOT RUN** (%s: %s) — that is a fact about this "
                 "job, not a clean day." % (type(e).__name__, e))
          finally:
              if fh is not sys.stdout:
                  fh.close()
          with open(os.environ["GITHUB_OUTPUT"], "a") as g:
              g.write("untrustworthy=%d\n" % bad)
          AUD

      # WHAT TODAY'S DRAFTERS DID, as opposed to what the season averages.
      #
      # Measured 2026-08-14 and it is the reason this step exists: the published
      # ADP moves a median 0.17-0.21 picks a day inside the top 150, which reads
      # as a market that has settled. It has not. `total_drafts` went 115 -> 119
      # -> 125, so one day's drafts carry 3-5% of the weight and the cumulative
      # mean CANNOT move much even if every new drafter behaved differently. The
      # calm is arithmetic, not evidence — and six days from our draft, the 3-5%
      # is the only part anybody would act on.
      #
      # `marginal_adp` recovers it exactly, because a mean times its count is a
      # sum and `dispersion` has carried `draftsSelectedIn` per player since
      # 2026-08-14. Nothing is smoothed, estimated or windowed.
      #
      # ⚠ IT WILL SAY UNMEASURED TONIGHT AND THAT IS CORRECT. Tonight's run is
      # the FIRST contact between `dispersion_of` and MFL's real response, so
      # there is exactly one spread day and a difference needs two. The first
      # derivable marginal day is 2026-08-15. The step says which case it is in,
      # because "nothing printed" and "nobody moved" must not look alike.
      - name: What today's drafters did, as opposed to the season average
        if: always() && steps.cap.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 - <<'MARG'
          import os, sys
          sys.path.insert(0, "draft/backtest")

          # ⚠ THE SUMMARY IS OPENED, NOT REDIRECTED, AND THE SIBLING STEPS ARE NOT
          # WRONG TO REDIRECT — this one is different because it emits an
          # ANNOTATION as well as prose. `::error::` is a workflow command parsed
          # from the step's STDOUT; written into $GITHUB_STEP_SUMMARY it is just
          # eight literal characters in a markdown blob. I wrote it that way
          # first. That is rule 9 exactly — a mechanism degraded into a note —
          # inside the step whose whole job is to stop a damped number being read
          # as a real one.
          _sum = os.environ.get("GITHUB_STEP_SUMMARY")
          fh = open(_sum, "a") if _sum else sys.stdout

          def md(line=""):
              print(line, file=fh)

          def alarm(line):
              print("::error::" + line)          # STDOUT, deliberately

          md("## The marginal day — the new drafts only")
          try:
              import external_adp_capture as C
              r = C.latest_marginal(C.load(), "${{ github.event.inputs.year || '2026' }}")
              if r["status"] != "measured":
                  # NOT CHECKED IS NOT CLEAN (rule 13f).
                  md("**UNMEASURED** — %s" % r.get("note"))
              else:
                  md("`%s` -> `%s`. %d player(s) derived; %d had no new "
                     "selections, %d had a count that FELL, %d ranked too thin "
                     "(< %d new selections), %d outside the %d-pick draft range "
                     "at BOTH ends."
                     % (r["earlier"], r["later"], len(r["rows"]),
                        r["skipped_no_new_selections"], r["refused_count_fell"],
                        r["ranking_excluded_thin"], r["min_new_selections"],
                        r["ranking_excluded_out_of_range"], r["draft_range"]))
                  if r["outside_observed_range"]:
                      # THE FALSIFICATION ARM FIRED. A mean of real picks cannot
                      # sit outside the day's own observed range, so this is the
                      # premise failing rather than a big move, and it invalidates
                      # the whole table rather than one row of it.
                      alarm("MARGINAL ADP OUTSIDE THE OBSERVED RANGE for %d "
                            "player(s) — the decomposition's premise is wrong "
                            "(averagePick may not be averaged over "
                            "draftsSelectedIn, or the two snapshots are not the "
                            "same accumulation). Infer NOTHING from this table "
                            "until that is settled."
                            % len(r["outside_observed_range"]))
                      md("")
                      md("> ⚠ **%d player(s) derive a mean outside the day's own "
                         "observed range.** See the run annotation — the premise "
                         "is in question, not just these rows."
                         % len(r["outside_observed_range"]))
                  md("")
                  md("| player | board says | today's drafters | gap | n new | published move |")
                  md("|---|---|---|---|---|---|")
                  for x in r["ranked"][:15]:
                      md("| `%s`%s | %.1f | %.1f | %+.1f | %d | %+.2f |"
                         % (x["player_id"],
                            " ⚠" if x["outside_observed_range"] else "",
                            x["adp_later"], x["marginal_adp"], x["gap"],
                            x["new_selections"], x["published_move"]))
                  md("")
                  md("Ranked by distance from the STANDING PRICE, not by how far "
                     "the average drifted — the drift is the damped number this "
                     "exists to see past. Positive gap = today's drafters took "
                     "him LATER than the board is charging.")
          except Exception as e:                      # noqa: BLE001
              md("**THE MARGINAL DAY DID NOT RUN** (%s: %s) — not a clean "
                 "result; nothing was derived." % (type(e).__name__, e))
          finally:
              if fh is not sys.stdout:
                  fh.close()
          MARG

      # WHICH PLAYERS THE SOURCES ARE ARGUING ABOUT — the aggregate Cory asked
      # for ("We need an aggregate!! The more data aggregated the better the info.
      # But needs to be done methodically and accurately"), finally reaching a
      # surface somebody reads.
      #
      # ⚠ IT AGGREGATES WITHIN-POSITION ORDER, NOT PICK NUMBERS, and that is the
      # whole design rather than a detail. Measured on 314 shared players: the
      # median MFL/FantasyPros ADP ratio is 0.494 at QB against 1.388 at RB —
      # one mechanism, not four, because MFL's pool includes superflex leagues.
      # But compared on ORDER WITHIN A POSITION the same two sources agree at
      # rho 0.98/0.97/0.96/0.94. Format moves WHERE a position sits; it barely
      # touches WHO IS BETTER THAN WHOM inside it, and that is the only space in
      # which averaging these sources is defensible.
      #
      # ⚠ AND AN EMPTY DISAGREEMENT TABLE IS AMBIGUOUS ON ITS OWN — it means "the
      # sources agree" or "there was only one of them", which are opposite. The
      # corroborated counts are printed beside it for exactly that reason, and
      # `latest_consensus` refuses to aggregate a lone source at all.
      #
      # `consensus_order` was built, tested thirteen ways, and called by NOTHING
      # until this step existed. Rule 14, found by sweeping this lane for
      # functions with no production caller.
      - name: Which players the two sources are arguing about
        if: always() && steps.cap.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 - <<'CONS' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          sys.path.insert(0, "draft/backtest")
          print("## Multi-source consensus — within-position order")
          try:
              import external_adp_consensus as CN
              import external_source_capture as SC
              positions = json.load(
                  open("draft/data/player_positions.json"))["positions"]
              r = CN.latest_consensus(SC.load(), positions,
                                      "${{ github.event.inputs.year || '2026' }}")
              if r["status"] != "measured":
                  # NOT CHECKED IS NOT CLEAN (rule 13f).
                  print("**UNMEASURED** — %s" % r.get("note"))
              else:
                  print("`%s`, sources `%s`.%s"
                        % (r["day"], "` + `".join(r["sources"]),
                           (" %d earlier day(s) held one source only."
                            % r["single_source_days"])
                           if r["single_source_days"] else ""))
                  print("")
                  print("| pos | ranked | corroborated | single-source | median disagreement |")
                  print("|---|---|---|---|---|")
                  for pos, c in sorted(r["coverage"].items()):
                      print("| %s | %d | %d | %d | %s |"
                            % (pos, c["players"], c["corroborated"],
                               c["single_source"],
                               "—" if c["median_disagreement"] is None
                               else "%.3f" % c["median_disagreement"]))
                  # NAMES, NOT SLEEPER IDS. A table of bare ids is a mechanism
                  # nobody can act on at 8am — the board already holds the decode
                  # key and a missing one says so rather than printing a blank.
                  names, prices, dropped = {}, {}, None
                  try:
                      board = json.load(open("public/draft_data.json"))
                      names = {str(p.get("player_id")): p.get("name")
                               for p in (board.get("players") or [])}
                      prices = {str(p.get("player_id")): p.get("adp")
                                for p in (board.get("players") or [])}
                  except Exception as e:              # noqa: BLE001
                      print("")
                      print("_(board unreadable — %s — showing ids, and NOT scoped "
                            "to the draft range)_" % type(e).__name__)
                  dis = r["disagreements"]
                  # SCOPED TO WHAT WE CAN DRAFT, and counted rather than silent.
                  # Unscoped, this table led with TE39 and TE40 on the real board.
                  # The price gates RELEVANCE only — it never touches the rank.
                  if prices:
                      dis, dropped = CN.in_draft_range(dis, prices, limit=150)
                  print("")
                  if dropped:
                      print("_%d argument(s) hidden: the board prices those players "
                            "outside pick 150, or not at all._" % dropped)
                      print("")
                  if not dis:
                      print("**No disagreement to report.** Read that against the "
                            "corroborated counts above: with players corroborated "
                            "it means the sources agree; with none, nothing was "
                            "compared.")
                  else:
                      print("| player | pos | consensus | ranks by source | apart |")
                      print("|---|---|---|---|---|")
                      for d in dis[:20]:
                          pid = d["player_id"]
                          print("| %s | %s | %d | %s | %.0f |"
                                % (names.get(pid) or ("`%s` (unknown id)" % pid),
                                   d["position"], d["consensus_rank"],
                                   ", ".join("%s %s" % (k, v) for k, v in
                                             sorted(d["ranks"].items())),
                                   d["rank_steps"]))
                      print("")
                      print("`apart` is HOW MANY PLAYERS separate the sources at "
                            "that position — the column the table is sorted on. "
                            "The share-of-the-position figure it replaced is "
                            "comparable across SOURCES and not across POSITIONS: "
                            "the intersection is 25 quarterbacks against 76 "
                            "receivers, so one rank step is 0.040 at QB and 0.013 "
                            "at WR, and sorting on it ordered the table partly by "
                            "how shallow each position is.")
                      print("")
                      print("The consensus rank is the MEDIAN of ranks, never the "
                            "mean: two sources at RB4 and one at RB19 should "
                            "return RB4 and report the argument, not RB9 — a rank "
                            "no source holds and no reader can defend.")

                  # ── WHERE THE AGGREGATE DISAGREES WITH OUR BOARD ───────────
                  #
                  # The question a reader actually has, and the one that cannot be
                  # asked naively. The consensus is mapped onto FFC's pick scale
                  # (the only format-matched anchor: half-ppr, teams=10) while the
                  # board is built primarily on FantasyPros — so a whole position
                  # can shift by the gap between two providers' scales and look
                  # like a finding. Measured 2026-08-14: TE moved +21.5 with a
                  # typical move of 21.5, and WR -9.3 of 9.3. Every tight end, one
                  # way. `block_shift` refuses those positions rather than
                  # printing them.
                  anchor = {}
                  for d in SC.load():
                      if d.get("source") == "ffc" and d.get("observed_at") == r["day"]:
                          anchor = {k: v for k, v in (d.get("rows") or {}).items()
                                    if v is not None}
                  scaled = CN.to_pick_scale(r["order"], anchor, positions) if anchor else {}
                  lines, refused = [], []
                  for pos, blk in sorted(scaled.items()):
                      if blk.get("status") != "anchored":
                          continue
                      pairs = [(x["player_id"], x["adp"], float(prices[x["player_id"]]))
                               for x in blk["rows"]
                               if x.get("adp") is not None
                               and prices.get(x["player_id"]) is not None
                               and float(prices[x["player_id"]]) <= 150]
                      bs = CN.block_shift([c - b for _p, c, b in pairs])
                      if bs["systematic"] is not False:
                          refused.append((pos, bs))
                          continue
                      for pid, c, b in pairs:
                          lines.append((abs(c - b), pid, pos, c, b))
                  print("")
                  print("### Where the aggregate disagrees with our board")
                  for pos, bs in refused:
                      print("- **%s SUPPRESSED** — %s"
                            % (pos, bs.get("note") or "nothing comparable"))
                  if lines:
                      lines.sort(reverse=True)
                      print("")
                      print("| player | pos | consensus pick | board adp | move |")
                      print("|---|---|---|---|---|")
                      for _m, pid, pos, c, b in lines[:12]:
                          print("| %s | %s | %.1f | %.1f | %+.1f |"
                                % (names.get(pid) or ("`%s`" % pid), pos, c, b, c - b))
                  elif not refused:
                      print("- nothing to compare: no position survived both the "
                            "anchor and the draft-range scope.")
          except Exception as e:                      # noqa: BLE001
              print("**THE CONSENSUS DID NOT RUN** (%s: %s) — not a clean result; "
                    "nothing was aggregated." % (type(e).__name__, e))
          CONS

      # A GREEN RUN'S STEP SUMMARY IS READ BY NOBODY, which is the whole reason
      # the standing check escalates by failing. Losing a day of a perishable
      # curve deserves the same channel — but only ONCE, on the run that can
      # first see it.
      #
      # ⚠ THIS STEP MUST STAY LAST. DO NOT MOVE IT ABOVE THE COMMIT.
      #
      # It was written above the commit step first, and that was catastrophic in
      # a way worth spelling out rather than quietly reordering. A failed step
      # aborts the job, and the commit step's `if:` is `steps.cap.outcome ==
      # 'success'` — no `always()` — so it would have been SKIPPED. On the exact
      # run that recovers from an outage, the alarm about lost days would have
      # discarded that day's snapshot too; the next run would then find yesterday
      # missing, fire again, discard again, and the "outage" would sustain itself
      # for ever, one lost day at a time, with a red job every morning saying so.
      #
      # An alarm that destroys what it is watching is worse than no alarm. The
      # day lands FIRST; the run goes red afterwards.
      - name: Escalate if this run resumed from a gap
        if: always() && steps.cov.outputs.resumed == '1'
        run: |
          echo "::error::${{ steps.cov.outputs.alarm }}."
          echo "::error::The 2026 ADP curve is"
          echo "::error::observable only while it is happening: no provider serves a board"
          echo "::error::as of a past date, so these days cannot be refetched by any means."
          echo "::error::Fix the schedule before more days go. See the step summary for dates."
          exit 1

      # ⚠ LAST, AND FOR THE REASON SPELLED OUT ABOVE THE STEP BEFORE IT: an alarm
      # placed above the commit would discard the very snapshot it is alarming
      # about. Both alarms run after the day has landed on main.
      #
      # `always()` because the step above exits 1 on a resumed gap, and a run can
      # be both — resuming from an outage is exactly when a player is most likely
      # to have left the board unnoticed.
      # Fires once, on the run that first learns the spread never arrived, and
      # self-clears — see the reasoning at the check itself. LAST, with the
      # others, so no alarm can precede the commit that saves the day.
      - name: Escalate if the spread never arrived on its FIRST judged run
        if: always() && steps.cov.outputs.spread_missing == '1'
        run: |
          echo "::error::THE SPREAD DID NOT ARRIVE on the first capture that could carry it."
          echo "::error::Suspect the field names in draft/backtest/mfl_adp.parse —"
          echo "::error::minPick, maxPick, draftSelPct — BEFORE suspecting MFL. They are"
          echo "::error::read from the same response dict as averagePick, which works, so"
          echo "::error::the shape is right and only the names are unproven."
          echo "::error::This fires ONCE and then self-clears; the summary carries it daily."
          exit 1

      - name: Escalate if today's data failed an invariant
        if: always() && steps.audit.outputs.untrustworthy == '1'
        run: |
          echo "::error::TODAY'S SNAPSHOT FAILED AN INVARIANT THAT CANNOT BE WRONG."
          echo "::error::See the step summary for which. These are arithmetic"
          echo "::error::impossibilities — an ADP outside its own min/max means"
          echo "::error::averagePick and the pick range are not describing the same"
          echo "::error::population, and the marginal-ADP derivation assumes they are."
          echo "::error::The day IS committed (it cannot be refetched); do not READ"
          echo "::error::it until this is understood."
          exit 1

      - name: Escalate ONLY if a DRAFTABLE player left the board
        if: always() && steps.cov.outputs.draftable_loss == '1'
        run: |
          echo "::error::A player priced INSIDE the draft left the board: ${{ steps.cov.outputs.lost_ids }}"
          echo "::error::F5 reads the latest snapshot strictly before the draft, so these"
          echo "::error::carry NO ADP into it. This is not the daily tail churn — MFL's"
          echo "::error::percentage cutoff washing out marginal players is expected and is"
          echo "::error::reported in the summary without failing. This reached the board."
          echo "::error::Check the player is not simply retired/suspended before treating"
          echo "::error::it as a capture defect. See the step summary."
          exit 1

      # ⚠ WHAT THIS ESCALATES ON, AND WHAT IT DELIBERATELY DOES NOT.
      #
      # NOT the contamination. The market has been superflex- and dynasty-mixed on
      # all four days we hold, and the shift has moved 0.003 of the board across
      # them. Escalating a standing condition makes this red every morning, and the
      # audit step above already carries the note about how a real alarm gets muted
      # by its second. It is printed in the summary and stamped in `standing`.
      #
      # It DOES escalate on the three things that mean the answer changed or the
      # instrument did: the pool's composition drifting or a verdict flipping (the
      # market becoming usable is a decision, and finding it out on the 23rd is
      # finding it out too late), the crosswalk decaying below half the draft range
      # so no verdict can be taken at all, and the check crashing — which is the
      # one state that would otherwise read as "nothing to report".
      - name: Escalate if the market stopped being the market we measured
        if: always() && steps.fmt.outputs.flags != ''
        run: |
          echo "::error::THE MARKET COMPARISON'S GROUND MOVED — ${{ steps.fmt.outputs.flags }}"
          echo "::error::Every comparison in this workflow ranks our board against"
          echo "::error::MFL's pooled board. That pool is superflex- and"
          echo "::error::dynasty-mixed by measurement, which is a STANDING fact and"
          echo "::error::not what this is about. This fires because the pool CHANGED,"
          echo "::error::the crosswalk got too thin to judge it, or the check did not"
          echo "::error::run. Read the composition table in the summary before"
          echo "::error::trusting any board-vs-market number from today."
          exit 1
