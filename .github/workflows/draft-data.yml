name: Build draft board

# The offline pipeline runs here, not on the site: CI has network access,
# takes as long as it needs, and commits a static artifact the browser reads.
# Nothing to pay for and nothing to go down mid-draft.
on:
  schedule:
    - cron: '0 8 * * *'      # 08:00 UTC nightly — well before any evening draft
  workflow_dispatch:
    inputs:
      league_id:
        description: 'Sleeper league ID'
        required: false
        default: '1374848328470102016'
      slot:
        description: 'My draft slot (1-indexed)'
        required: false
        default: '4'
      snapshot:
        description: 'Record real API responses and diff them against the fixtures (no build)'
        type: boolean
        required: false
        default: false
      export_history:
        description: 'Re-export the full league history artifact'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r draft/requirements.txt

      - name: Run acceptance tests
        # A board that fails its own scoring tests must never be published.
        run: python -m pytest draft/tests -q

      # This is the only place with real network access, so it is the only place
      # that can answer what the live APIs actually return. Its log is the
      # deliverable: FFC's field set, the unmatched-player report, and the real
      # nflfastR schema.
      - name: Snapshot real API responses
        if: github.event.inputs.snapshot == 'true'
        working-directory: draft
        continue-on-error: true      # findings are the output, not a failure
        run: python build.py --snapshot --league-id "${{ github.event.inputs.league_id || '1374848328470102016' }}"

      - name: Upload snapshot fixtures
        if: github.event.inputs.snapshot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: real-api-fixtures
          path: draft/tests/fixtures/real/

      # Complete league history: every week's starters and bench, every
      # transaction with its FAAB bid, every draft. Written once; completed
      # seasons never change.
      - name: Export league history
        if: github.event.inputs.export_history == 'true'
        working-directory: draft
        run: python history_export.py "${{ github.event.inputs.league_id || '1374848328470102016' }}"

      - name: Build the draft artifact
        if: github.event.inputs.snapshot != 'true'
        working-directory: draft
        run: |
          python build.py \
            --league-id "${{ github.event.inputs.league_id || '1374848328470102016' }}" \
            --slot "${{ github.event.inputs.slot || '4' }}"

      - name: Commit the artifact if it changed
        if: github.event.inputs.snapshot != 'true'
        run: |
          PATHS="public/draft_data.json draft/config/league_config.json draft/data/league_history.json"
          EXISTING=""
          for p in $PATHS; do [ -e "$p" ] && EXISTING="$EXISTING $p"; done
          if [ -z "$EXISTING" ] || git diff --quiet -- $EXISTING; then
            echo "no change"
            exit 0
          fi
          git config user.name  "draft-bot"
          git config user.email "actions@github.com"
          git add $EXISTING
          git commit -m "Draft board: rebuild $(date -u +%Y-%m-%d)"
          git push
