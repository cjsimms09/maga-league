name: Build draft board

# The offline pipeline runs here, not on the site: CI has network access,
# takes as long as it needs, and commits a static artifact the browser reads.
# Nothing to pay for and nothing to go down mid-draft.
on:
  schedule:
    # GitHub Actions cron is UTC and does not observe DST, so a schedule
    # written as "6am Central" silently slides by an hour for half the year.
    # These are written in UTC deliberately; the local time each is intended to
    # hit is stated, and the pipeline logs the local time it actually ran so a
    # drift is visible rather than assumed.
    - cron: '0 8 * * *'      # 08:00 UTC = 03:00 CDT / 02:00 CST — nightly rebuild
    - cron: '0 11 * * 2'     # 11:00 UTC Tue = 06:00 CDT — before Wednesday waivers
    - cron: '0 13 * * 0'     # 13:00 UTC Sun = 08:00 CDT — inactives and lineups
  workflow_dispatch:
    inputs:
      league_id:
        description: 'Sleeper league ID'
        required: false
        default: '1374848328470102016'
      slot:
        description: 'My draft slot (1-indexed) — leave blank to use the committed config'
        required: false
        default: ''
      snapshot:
        description: 'Record real API responses and diff them against the fixtures (no build)'
        type: boolean
        required: false
        default: false
      export_history:
        description: 'Re-export the full league history artifact'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      # fetch-depth: 2, not the default 1 — found 2026-08-15 when the nightly
      # rebuild refused to publish. test_core_needs_no_reviewer.py diffs
      # `HEAD~1` against `HEAD` to exercise independent_review.py's own
      # unavailable-reviewer path; a depth-1 (shallow) clone has no `HEAD~1` to
      # find, so the test's own subprocess exited via
      # independent_review.py's "REFUSING: ...contains no changes" path (exit
      # 1) instead of the CONFIG-unavailable path it meant to test (exit 0) —
      # a false failure with nothing wrong in the reviewed change. Depth 2 is
      # the minimum this specific test needs; independent-review.yml already
      # uses fetch-depth: 0 for its own, different reason (diffing against
      # origin/main, which can be arbitrarily far back).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r draft/requirements.txt

      - name: Run acceptance tests (against the CURRENT board, pre-build)
        # ⚠ THIS DOES NOT GATE WHAT GETS PUBLISHED, and its old comment claimed it
        # did: "A board that fails its own scoring tests must never be published."
        # It runs BEFORE `Build the draft artifact`, so it tests the board already
        # committed and then a NEW, UNTESTED one is built and pushed below.
        #
        # That is how 2026-08-14's rebuild reached main red: the new board carried
        # a field (`adp_sd_source`) with no declared purpose, nine suites failed on
        # it, and nothing stopped the push — an unattended bot darkened the gate
        # for every lane and no owner was watching.
        #
        # Kept because failing fast on a board that is ALREADY broken is still
        # worth the two minutes. The gate that actually protects publication is
        # "Acceptance gate on the FRESH board" below.
        #
        # ⚠️ ADVISORY, AND IT HAD TO BECOME ADVISORY (2026-08-14). Failing the JOB
        # here is backwards: it stops the rebuild BECAUSE the current board is
        # broken, and a rebuild is exactly what repairs a broken board. So one red
        # test on the committed artifact froze the pipeline that would replace it.
        #
        # That is not hypothetical. The 09:16Z rebuild published a board carrying
        # `adp_sd_source` with no declared purpose; from that moment this step
        # failed, and the next scheduled run — 08:00Z on the 15th, six days before
        # keeper lock — would have died here without ever attempting a build.
        # Stale ADP into a draft, caused by the guard rather than by the defect.
        #
        # Publication is still protected, and by the step that can actually do it:
        # "Acceptance gate on the FRESH board" runs AFTER the build and DOES fail
        # the job. Nothing untested gets published; a broken board simply no
        # longer blocks its own repair.
        continue-on-error: true
        run: python -m pytest draft/tests -q

      # The JS suites are not optional extras: keepers.test.js is the only thing
      # that catches the Python and browser keeper implementations diverging,
      # and a divergence there corrupts every pick number invisibly.
      - name: Run engine and parity tests
        run: |
          node draft/tests/engine.test.js
          node draft/tests/update.test.js
          node draft/tests/keepers.test.js
          node draft/tests/reconcile.test.js
          node draft/tests/betlogic.test.js
          node draft/tests/ledger.test.js
          node draft/tests/sync.test.js

      # This is the only place with real network access, so it is the only place
      # that can answer what the live APIs actually return. Its log is the
      # deliverable: FFC's field set, the unmatched-player report, and the real
      # nflfastR schema.
      - name: Snapshot real API responses
        if: github.event.inputs.snapshot == 'true'
        working-directory: draft
        continue-on-error: true      # findings are the output, not a failure
        run: python build.py --snapshot --league-id "${{ github.event.inputs.league_id || '1374848328470102016' }}"

      - name: Upload snapshot fixtures
        if: github.event.inputs.snapshot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: real-api-fixtures
          path: draft/tests/fixtures/real/

      # Complete league history: every week's starters and bench, every
      # transaction with its FAAB bid, every draft. Written once; completed
      # seasons never change.
      - name: Refresh keepers.json from real designations
        # keepers.json was fixtures ("RB Player 1"); the pick order was fiction.
        # Regenerate from live Sleeper designations so the forfeited rounds, the
        # pick numbers AND the draftable pool are real — keepers.json feeds all
        # three. Teams whose draft slot is not yet assigned are placed
        # PROVISIONALLY rather than dropped: the count is what moves my schedule
        # and the pool, and the count is known as soon as a team designates.
        #
        # `|| echo "gen_keepers skipped"` REMOVED. It swallowed the exit code, so
        # a generator that failed left the PREVIOUS keepers.json in place and the
        # board rebuilt on a stale slate with a green run — indistinguishable
        # from success. The generator falls back to history by itself when
        # Sleeper is unreachable, so the only way it exits non-zero now is its
        # own accounting assertion: designations went missing. That must stop the
        # build. A board that fails to rebuild is VISIBLE (built_at goes stale and
        # the staleness alarm fires); a board that rebuilds wrong is not.
        working-directory: .
        run: python draft/gen_keepers_json.py
      - name: Export league history
        if: github.event.inputs.export_history == 'true'
        working-directory: draft
        run: python history_export.py "${{ github.event.inputs.league_id || '1374848328470102016' }}"
      - name: Money-weighted history archaeology
        # Weekly-high thresholds, concentration, $/season standings under the
        # payout table. Cheap, projection-free; refreshes whenever history does.
        working-directory: .
        run: python draft/money_history.py || echo "money_history skipped (no weekly data yet)"

      - name: Build the draft artifact
        if: github.event.inputs.snapshot != 'true'
        working-directory: draft
        env:
          SLOT: ${{ github.event.inputs.slot }}
          # The authority for config_confirmed is the live site's Blob, not the
          # committed file. Repo variable SITE_URL wins; falls back to the known
          # production URL so the fetch works out of the box. Unreachable is safe:
          # the build falls back to the file and says so loudly
          # (provenance.config_confirmed.source = 'file-cache').
          DRAFT_CONFIG_STATUS_URL: ${{ vars.SITE_URL || 'https://makefbgreatagain.netlify.app' }}
        run: |
          # --slot is an OVERRIDE, not a default. It used to fall back to a
          # hardcoded 4, which meant every nightly rebuild forced slot 4 no
          # matter what the committed config said — so a slot change would be
          # silently undone by the next cron run and the board would go on being
          # keeper-adjusted for somebody else's turns.
          #
          # Blank now means "use draft/config/league_config.json", which is the
          # file the League Setup screen emits and the only durable record of
          # which seat this board is for.
          if [ -n "$SLOT" ]; then
            echo "building for slot $SLOT (explicit override)"
            python build.py --league-id "${{ github.event.inputs.league_id || '1374848328470102016' }}" --slot "$SLOT"
          else
            echo "building for the slot in league_config.json: $(python -c "import json;print(json.load(open('config/league_config.json')).get('my_draft_slot'))" 2>/dev/null || echo unknown)"
            python build.py --league-id "${{ github.event.inputs.league_id || '1374848328470102016' }}"
          fi

      - name: Regenerate the opening script + predicted slates from the fresh board
        # The regeneration hook made mechanical: every artifact rebuild (which
        # includes slot-assignment and keeper-designation changes flowing into
        # the board) re-derives the predicted slates and the opening script, so
        # their fingerprints always match the board they claim to describe.
        if: github.event.inputs.snapshot != 'true'
        run: |
          python draft/predict_keepers.py || echo "predicted slates unchanged/skipped"
          python draft/backtest/cory_conditional.py || echo "19b race skipped"
          python draft/opening_script.py
          python draft/room_read.py || echo "room read unchanged/skipped"

      - name: Acceptance gate on the FRESH board — nothing untested is published
        # THE STEP THE OLD COMMENT DESCRIBED, in the only place it can be true:
        # after the artifact is built and before it is committed. A board is the
        # single input every draft-day surface reads, so publishing one that fails
        # its own suite is the most expensive silent failure available here — and
        # on 22 August it would ship to the room Cory is drafting in.
        #
        # FAILS THE JOB rather than skipping the commit quietly. A rebuild that
        # stops publishing is a visible red run; a rebuild that publishes a broken
        # board is invisible until somebody else's merge goes red, which is exactly
        # what happened. Freezing on the last good board is the safe direction.
        # UNCHANGED FROM THE ORIGINAL: this step still `exit 1`s directly on
        # failure, so every unconditioned step after it (Commit the artifact,
        # below) is skipped automatically — the safety property this project
        # depends on. The `set -o pipefail` matters: GitHub Actions runs `run:`
        # blocks under `bash -e`, and without it `... | tee file` reports tee's
        # exit code, not pytest's, which would silently defeat this whole gate
        # (the exact class of bug draft-night-sync.yml hit earlier this session).
        if: github.event.inputs.snapshot != 'true'
        run: |
          set -o pipefail
          echo "== the board about to be committed must pass the suite that reads it"
          if ! python -m pytest draft/tests -q 2>&1 | tee /tmp/board_gate_output.txt; then
            echo "*** REFUSING TO PUBLISH: the freshly built board fails the suite."
            echo "    The previously published board is untouched and still live."
            echo "    Fix the board (or whatever the suite is telling you about it)"
            echo "    and re-run — do NOT bypass this to get a rebuild out."
            exit 1
          fi

      - name: Make a refused publish LOUD, not just red — found 2026-08-15
        # A run that fails and sits in the Actions tab is invisible until someone
        # goes looking, which is exactly what happened here: the 08:36 UTC nightly
        # refused to publish, left the board 24h+ stale and missing a whole
        # projection source, and nobody knew until this step's absence was
        # investigated by hand many hours later. The gate's DECISION was correct
        # (don't ship a broken board); its SILENCE was the actual defect.
        #
        # `if: failure()` — runs ONLY when the acceptance gate above just failed,
        # and does not change whether the job ends up red (it still does; see the
        # unconditioned steps below, which stay skipped exactly as before). Opens
        # (or updates, if already open — one tracking issue, not one per night) a
        # labeled GitHub issue with the exact failing test names, so a human is
        # notified same-day instead of by accident.
        if: failure() && github.event.inputs.snapshot != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABEL="board-rebuild-broken"
          gh label create "$LABEL" --color B60205 --description "Nightly board rebuild refused to publish" 2>/dev/null || true
          EXISTING=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          FAILING=$(grep -oE "^FAILED [A-Za-z0-9_./:-]+" /tmp/board_gate_output.txt | sed 's/^FAILED //' | sort -u || true)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY_FILE=$(mktemp)
          {
            printf 'The nightly board rebuild ran at %s and refused to publish — the previously published board is still live, untouched.\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '**Failing tests:**\n\x60\x60\x60\n'
            printf '%s\n' "${FAILING:-see run log, no FAILED lines parsed}"
            printf '\x60\x60\x60\n\nRun: %s\n\n' "$RUN_URL"
            printf 'This issue stays open until a rebuild passes clean; it will auto-close then, not before.\n'
          } > "$BODY_FILE"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            gh issue create --title "🔴 Board rebuild refused to publish" --label "$LABEL" --body-file "$BODY_FILE"
          fi

      - name: Preserve the refused candidate board for offline diagnosis
        # Added 2026-08-15. The two failures still blocking auto-publish
        # (a retired player unflagged by board_activity.dormant, the
        # replacement-sensitivity sign flip) reproduce ONLY against the fresh
        # candidate board built from live fetches — and the runner discarded
        # that board on every refused run, so every diagnosis attempt so far
        # has been done blind, against yesterday's committed board where both
        # tests pass. Preserving the refused candidate (plus the two config
        # inputs it was built from) turns "needs live Sleeper access to
        # debug" into "download one artifact and run the failing test
        # locally". test_pick_log-style test isolation is unaffected: this
        # uploads, commits nothing.
        if: failure() && github.event.inputs.snapshot != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: refused-candidate-board
          path: |
            public/draft_data.json
            draft/config/keepers.json
            draft/data/predicted_keepers.json
          if-no-files-found: warn
          retention-days: 14

      - name: Close the tracking issue if this rebuild is the one that fixed it
        # Reached only when the acceptance gate above SUCCEEDED (no special `if`
        # needed — a step with no condition runs exactly when every prior step
        # in the job has succeeded, GitHub Actions' own default). So "no open
        # board-rebuild-broken issue" becomes a trustworthy signal rather than
        # something to remember to check by hand.
        if: github.event.inputs.snapshot != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABEL="board-rebuild-broken"
          EXISTING=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue comment "$EXISTING" --body "Rebuild at $(date -u +%Y-%m-%dT%H:%M:%SZ) passed clean. Closing — run: $RUN_URL"
            gh issue close "$EXISTING"
          fi

      - name: Commit the artifact if it changed
        # ⚠️ `draft/config/keepers.json` ADDED 2026-08-14 — it was REGENERATED EVERY
        # RUN AND NEVER COMMITTED. The step above rebuilds it from live Sleeper
        # designations, the board is then built from that fresh copy, and the file
        # was thrown away with the runner. The repo kept whatever was last
        # hand-committed.
        #
        # Measured: the committed file carried ONE team at draft_slot 4, while the
        # board built beside it reported FOUR teams designated and slot 8. Neither
        # was wrong — they were different vintages of the same input, and the
        # disagreement is what sent me looking.
        #
        # THE BOARD WAS NEVER AFFECTED; it is built from the fresh copy. What was
        # lost is REPRODUCIBILITY: you could not rebuild a published board from the
        # repo, because the keeper input that produced it no longer existed
        # anywhere. For a project whose premise is auditable evidence, an input
        # that vanishes after use is the wrong kind of missing.
        if: github.event.inputs.snapshot != 'true'
        run: |
          PATHS="public/draft_data.json draft/config/keepers.json draft/config/league_config.json draft/data/league_history.json draft/data/predicted_keepers.json draft/data/opening_script.md draft/data/opening_script.json draft/backtest/cory-conditional.json draft/backtest/CORY-CONDITIONAL.md draft/data/adp_series.json draft/data/proj_series.json draft/data/room_read.md draft/data/room_read.json"
          EXISTING=""
          for p in $PATHS; do [ -e "$p" ] && EXISTING="$EXISTING $p"; done
          if [ -z "$EXISTING" ] || git diff --quiet -- $EXISTING; then
            echo "no change"
            exit 0
          fi
          git config user.name  "draft-bot"
          git config user.email "actions@github.com"
          git add $EXISTING
          git commit -m "Draft board: rebuild $(date -u +%Y-%m-%d)"
          git push
