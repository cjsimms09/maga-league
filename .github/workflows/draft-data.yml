name: Build draft board

# The offline pipeline runs here, not on the site: CI has network access,
# takes as long as it needs, and commits a static artifact the browser reads.
# Nothing to pay for and nothing to go down mid-draft.
on:
  schedule:
    # GitHub Actions cron is UTC and does not observe DST, so a schedule
    # written as "6am Central" silently slides by an hour for half the year.
    # These are written in UTC deliberately; the local time each is intended to
    # hit is stated, and the pipeline logs the local time it actually ran so a
    # drift is visible rather than assumed.
    - cron: '0 8 * * *'      # 08:00 UTC = 03:00 CDT / 02:00 CST — nightly rebuild
    - cron: '0 11 * * 2'     # 11:00 UTC Tue = 06:00 CDT — before Wednesday waivers
    - cron: '0 13 * * 0'     # 13:00 UTC Sun = 08:00 CDT — inactives and lineups
  workflow_dispatch:
    inputs:
      league_id:
        description: 'Sleeper league ID'
        required: false
        default: '1374848328470102016'
      slot:
        description: 'My draft slot (1-indexed) — leave blank to use the committed config'
        required: false
        default: ''
      snapshot:
        description: 'Record real API responses and diff them against the fixtures (no build)'
        type: boolean
        required: false
        default: false
      export_history:
        description: 'Re-export the full league history artifact'
        type: boolean
        required: false
        default: false
      allow_world_state_publish:
        description: 'Publish even if WORLD-STATE tests fail (keeper-lock pins). Dispatch only — the cron can never set this. A real board failure still refuses.'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      # fetch-depth: 2, not the default 1 — found 2026-08-15 when the nightly
      # rebuild refused to publish. test_core_needs_no_reviewer.py diffs
      # `HEAD~1` against `HEAD` to exercise independent_review.py's own
      # unavailable-reviewer path; a depth-1 (shallow) clone has no `HEAD~1` to
      # find, so the test's own subprocess exited via
      # independent_review.py's "REFUSING: ...contains no changes" path (exit
      # 1) instead of the CONFIG-unavailable path it meant to test (exit 0) —
      # a false failure with nothing wrong in the reviewed change. Depth 2 is
      # the minimum this specific test needs; independent-review.yml already
      # uses fetch-depth: 0 for its own, different reason (diffing against
      # origin/main, which can be arbitrarily far back).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r draft/requirements.txt

      - name: Run acceptance tests (against the CURRENT board, pre-build)
        # ⚠ THIS DOES NOT GATE WHAT GETS PUBLISHED, and its old comment claimed it
        # did: "A board that fails its own scoring tests must never be published."
        # It runs BEFORE `Build the draft artifact`, so it tests the board already
        # committed and then a NEW, UNTESTED one is built and pushed below.
        #
        # That is how 2026-08-14's rebuild reached main red: the new board carried
        # a field (`adp_sd_source`) with no declared purpose, nine suites failed on
        # it, and nothing stopped the push — an unattended bot darkened the gate
        # for every lane and no owner was watching.
        #
        # Kept because failing fast on a board that is ALREADY broken is still
        # worth the two minutes. The gate that actually protects publication is
        # "Acceptance gate on the FRESH board" below.
        #
        # ⚠️ ADVISORY, AND IT HAD TO BECOME ADVISORY (2026-08-14). Failing the JOB
        # here is backwards: it stops the rebuild BECAUSE the current board is
        # broken, and a rebuild is exactly what repairs a broken board. So one red
        # test on the committed artifact froze the pipeline that would replace it.
        #
        # That is not hypothetical. The 09:16Z rebuild published a board carrying
        # `adp_sd_source` with no declared purpose; from that moment this step
        # failed, and the next scheduled run — 08:00Z on the 15th, six days before
        # keeper lock — would have died here without ever attempting a build.
        # Stale ADP into a draft, caused by the guard rather than by the defect.
        #
        # Publication is still protected, and by the step that can actually do it:
        # "Acceptance gate on the FRESH board" runs AFTER the build and DOES fail
        # the job. Nothing untested gets published; a broken board simply no
        # longer blocks its own repair.
        # FULL SUITE HERE, DELIBERATELY — including the repo_parity pins the
        # publication gate below deselects. At this point the tree is exactly
        # as committed, so committed-artifact == regeneration is meaningful:
        # this step is the nightly anti-hand-edit check. The gate excludes
        # them only because it runs AFTER the build has rewritten the
        # regeneration's inputs (see the gate step's comment).
        continue-on-error: true
        run: python -m pytest draft/tests -q

      # The JS suites are not optional extras: keepers.test.js is the only thing
      # that catches the Python and browser keeper implementations diverging,
      # and a divergence there corrupts every pick number invisibly.
      - name: ADP drift — does the board still make football sense?
        # ADVISORY, NEVER BLOCKING. Cory, 2026-08-17: "BIG BOARD MAKE FOOTBALL
        # SENSE (SHOULDNT STRAY TOO MUCH FROM ADP OR SOMETHING PROBABLY WRONG,
        # IF WRONG SOMEONE NEEDS TO FIND AND FIX)."
        #
        # It runs on every build so a regression surfaces without anyone
        # remembering to look — the check existed and fired once, by hand, which
        # is how a check becomes a thing nobody runs.
        #
        # It does NOT gate the board. The two failures it reports are opposite:
        # straying too far means we are probably wrong, straying too LITTLE means
        # we are reproducing the consensus and have no edge at all. Neither is a
        # reason to refuse a publish; both are reasons to look. Gating on it would
        # make somebody widen the threshold at 2am on draft night.
        continue-on-error: true
        run: |
          node draft/tests/adp_drift_check.test.js
          node draft/tools/adp_drift_check.js | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run engine and parity tests
        run: |
          node draft/tests/engine.test.js
          node draft/tests/update.test.js
          node draft/tests/keepers.test.js
          node draft/tests/reconcile.test.js
          node draft/tests/betlogic.test.js
          node draft/tests/ledger.test.js
          node draft/tests/sync.test.js

      # This is the only place with real network access, so it is the only place
      # that can answer what the live APIs actually return. Its log is the
      # deliverable: FFC's field set, the unmatched-player report, and the real
      # nflfastR schema.
      - name: Snapshot real API responses
        if: github.event.inputs.snapshot == 'true'
        working-directory: draft
        continue-on-error: true      # findings are the output, not a failure
        run: python build.py --snapshot --league-id "${{ github.event.inputs.league_id || '1374848328470102016' }}"

      - name: Upload snapshot fixtures
        if: github.event.inputs.snapshot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: real-api-fixtures
          path: draft/tests/fixtures/real/

      # Complete league history: every week's starters and bench, every
      # transaction with its FAAB bid, every draft. Written once; completed
      # seasons never change.
      - name: Refresh keepers.json from real designations
        # keepers.json was fixtures ("RB Player 1"); the pick order was fiction.
        # Regenerate from live Sleeper designations so the forfeited rounds, the
        # pick numbers AND the draftable pool are real — keepers.json feeds all
        # three. Teams whose draft slot is not yet assigned are placed
        # PROVISIONALLY rather than dropped: the count is what moves my schedule
        # and the pool, and the count is known as soon as a team designates.
        #
        # `|| echo "gen_keepers skipped"` REMOVED. It swallowed the exit code, so
        # a generator that failed left the PREVIOUS keepers.json in place and the
        # board rebuilt on a stale slate with a green run — indistinguishable
        # from success. The generator falls back to history by itself when
        # Sleeper is unreachable, so the only way it exits non-zero now is its
        # own accounting assertion: designations went missing. That must stop the
        # build. A board that fails to rebuild is VISIBLE (built_at goes stale and
        # the staleness alarm fires); a board that rebuilds wrong is not.
        working-directory: .
        run: python draft/gen_keepers_json.py
      - name: Export league history
        if: github.event.inputs.export_history == 'true'
        working-directory: draft
        run: python history_export.py "${{ github.event.inputs.league_id || '1374848328470102016' }}"
      - name: Money-weighted history archaeology
        # Weekly-high thresholds, concentration, $/season standings under the
        # payout table. Cheap, projection-free; refreshes whenever history does.
        working-directory: .
        run: python draft/money_history.py || echo "money_history skipped (no weekly data yet)"

      - name: Build the draft artifact
        if: github.event.inputs.snapshot != 'true'
        working-directory: draft
        env:
          SLOT: ${{ github.event.inputs.slot }}
          # The authority for config_confirmed is the live site's Blob, not the
          # committed file. Repo variable SITE_URL wins; falls back to the known
          # production URL so the fetch works out of the box. Unreachable is safe:
          # the build falls back to the file and says so loudly
          # (provenance.config_confirmed.source = 'file-cache').
          DRAFT_CONFIG_STATUS_URL: ${{ vars.SITE_URL || 'https://makefbgreatagain.netlify.app' }}
        run: |
          # --slot is an OVERRIDE, not a default. It used to fall back to a
          # hardcoded 4, which meant every nightly rebuild forced slot 4 no
          # matter what the committed config said — so a slot change would be
          # silently undone by the next cron run and the board would go on being
          # keeper-adjusted for somebody else's turns.
          #
          # Blank now means "use draft/config/league_config.json", which is the
          # file the League Setup screen emits and the only durable record of
          # which seat this board is for.
          if [ -n "$SLOT" ]; then
            echo "building for slot $SLOT (explicit override)"
            python build.py --league-id "${{ github.event.inputs.league_id || '1374848328470102016' }}" --slot "$SLOT"
          else
            echo "building for the slot in league_config.json: $(python -c "import json;print(json.load(open('config/league_config.json')).get('my_draft_slot'))" 2>/dev/null || echo unknown)"
            python build.py --league-id "${{ github.event.inputs.league_id || '1374848328470102016' }}"
          fi

      - name: Is today's projection snapshot COMPLETE? (added 2026-08-18)
        # THE SERIES THIS TOUCHES IS NOT AN INPUT TO AN EXPERIMENT — IT IS THE
        # EXPERIMENT. Tracing PREDICTION-LEDGER P39 on 2026-08-18 established
        # that we have never once measured our own model against Sleeper on any
        # season: the promotion bar in model_accuracy_v5/v6 is "beat BOTH NAIVE
        # baselines", api.sleeper.app reads "no route", and v5 states the
        # comparison "first becomes measurable at the January 2027 grade of the
        # frozen 2026 proj_series, which prices Sleeper, FP and own_v5 on the
        # same season". That series is built here.
        #
        # AND IT HAS ALREADY LOST A DAY SILENTLY. 2026-08-10 carries a `sleeper`
        # row and no `fantasypros` row — FP capture rate 9/10 — and nothing
        # reported it. The fetch half-failed and the run committed a partial day
        # exactly as if nothing were wrong. Retroactive fetches leak (exp33), so
        # that day can never be recovered.
        #
        # WARNS, DOES NOT FAIL, AND THAT IS DELIBERATE. Refusing to publish a
        # whole draft board because one projection provider was unreachable
        # would trade a real, immediate cost for a speculative one, and a gate
        # that blocks the board on a third party's uptime gets switched off in a
        # week. What was actually missing here was not enforcement — it was
        # ANYONE KNOWING. So this makes a partial day loud and leaves the ruling
        # on whether it should block to A (register row 41).
        if: github.event.inputs.snapshot != 'true'
        continue-on-error: true
        run: |
          python3 - <<'PYEOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import datetime, json, os, pathlib
          f = pathlib.Path("draft/data/proj_series.json")
          if not f.exists():
              print("::warning::proj_series.json is missing entirely"); raise SystemExit(0)
          rows = json.loads(f.read_text()).get("series", [])
          today = datetime.date.today().isoformat()
          got = {r.get("source") for r in rows if r.get("date") == today}
          want = {"sleeper", "fantasypros"}
          missing = sorted(want - got)
          if not got:
              print(f"::warning::proj_series has NO row for {today} — the daily capture wrote nothing")
          elif missing:
              print(f"::warning::proj_series for {today} is PARTIAL: captured {sorted(got)}, MISSING {missing}. "
                    "This day cannot be backfilled (exp33) and it is an input to the January 2027 source grade.")
          else:
              print(f"proj_series {today}: complete ({sorted(got)})")
          PYEOF

      - name: Regenerate the opening script + predicted slates from the fresh board
        # The regeneration hook made mechanical: every artifact rebuild (which
        # includes slot-assignment and keeper-designation changes flowing into
        # the board) re-derives the predicted slates and the opening script, so
        # their fingerprints always match the board they claim to describe.
        if: github.event.inputs.snapshot != 'true'
        run: |
          python draft/predict_keepers.py || echo "predicted slates unchanged/skipped"
          python draft/backtest/cory_conditional.py || echo "19b race skipped"
          python draft/opening_script.py
          python draft/room_read.py || echo "room read unchanged/skipped"
          # The census is a snapshot OF the board just built — regenerate it
          # here or its committed copy is one nightly behind and the gate's
          # on_board_skill cross-check reds on correct board growth
          # (refused rebuild 32199445523, off-by-one, A 08-19).
          python draft/backtest/projection_coverage_census.py
          # ⚠️ I WIRED alt_source_rankings.py IN HERE AND IT MADE THE GATE
          # WORSE — ONE FAILURE BECAME NINE (runs 32415261725 -> 32416452690).
          # Reverted the same evening rather than iterated, because a 12-minute
          # CI loop two days before the draft is not a debugger.
          #
          # THE ORIGINAL PROBLEM IS REAL AND STILL OPEN: the per-source fields
          # (vorp_ds, tier_ds, ... 48 of them) are DERIVED FROM the board, and
          # nothing generates them here. `alt_source_rankings.py main()` was run
          # BY HAND once and its output shipped — the test's own comment says so.
          # So a freshly built board carries them absent or stale, and
          # `test_runs_clean_on_the_real_board_without_mutating_the_live_file`
          # recomputes them, finds they disagree, and correctly refuses.
          #
          # WHAT THE REVERTED ATTEMPT TAUGHT, so the next attempt starts here:
          # running the regeneration after build.py adds 48 fields to a board
          # whose declaration/stamping steps have already run, and eight further
          # guards fire — test_board_purpose (undeclared field),
          # test_season_stamp (unclassified field) and test_constant_multiple_sweep
          # (a per-source field that is a constant multiple of another). The
          # regeneration is byte-identical on the COMMITTED board, so the
          # difference is entirely about what a FRESH board carries — most
          # likely `proj_ownmodel`, since own_v6 was removed at v29 and a
          # per-source ranking computed from a missing source is degenerate.
          #
          # NEXT ATTEMPT, if someone picks this up: regenerate BEFORE the
          # stamping/declaration steps, and make the tool REFUSE a source whose
          # projection field is absent from the board rather than emitting a
          # degenerate ranking for it. Do not simply re-add the line.

      - name: Acceptance gate on the FRESH board — nothing untested is published
        env:
          # ⚠️ THE FRIDAY FLIP. "" = OFF = today's behaviour, byte-identical.
          # Set to "1" ONLY to publish over a WORLD-STATE alarm (see the long
          # note further down this step). Only the exact string "1" enables it.
          # Unset it again the moment the condition clears.
          # ⚠️ DISPATCH-ONLY, AND THAT IS THE POINT (2026-08-21, Cory's ruling).
          # The 08-20 design said "change this line to \"1\" and re-run", which
          # would have left a hardcoded override in the file where the 03:00 CRON
          # reads it too — a one-time decision quietly becoming every future
          # build's default. `inputs.*` is EMPTY on a scheduled run, so this
          # resolves to "" there and the cron fails closed no matter what a
          # dispatch did earlier. Only the exact string "1" enables it; the
          # boolean input is compared explicitly so a typo cannot open it.
          ALLOW_WORLD_STATE_PUBLISH: ${{ github.event.inputs.allow_world_state_publish == 'true' && '1' || '' }}
        # THE STEP THE OLD COMMENT DESCRIBED, in the only place it can be true:
        # after the artifact is built and before it is committed. A board is the
        # single input every draft-day surface reads, so publishing one that fails
        # its own suite is the most expensive silent failure available here — and
        # on 22 August it would ship to the room Cory is drafting in.
        #
        # FAILS THE JOB rather than skipping the commit quietly. A rebuild that
        # stops publishing is a visible red run; a rebuild that publishes a broken
        # board is invisible until somebody else's merge goes red, which is exactly
        # what happened. Freezing on the last good board is the safe direction.
        # UNCHANGED FROM THE ORIGINAL: this step still `exit 1`s directly on
        # failure, so every unconditioned step after it (Commit the artifact,
        # below) is skipped automatically — the safety property this project
        # depends on. The `set -o pipefail` matters: GitHub Actions runs `run:`
        # blocks under `bash -e`, and without it `... | tee file` reports tee's
        # exit code, not pytest's, which would silently defeat this whole gate
        # (the exact class of bug draft-night-sync.yml hit earlier this session).
        # `-m "not repo_parity"` — ADDED 2026-08-16 after run 31926152660: the
        # gate refused a fresh board with 16 failures, of which 7 were
        # committed-artifact == regeneration pins (model_accuracy, own-model
        # v2-v6, source_weight_prior). Those regenerate from inputs THIS VERY
        # RUN just rewrote (the fresh board's crosswalk rows, proj_series
        # snapshot_dates, player_positions), so on any later day they fail BY
        # CONSTRUCTION — refusing the board for being NEW, never for being
        # BAD, and the gate could never pass on a genuinely fresh rebuild.
        # They stay anti-hand-edit guards everywhere else: the advisory
        # pre-build step above runs the FULL suite against committed state,
        # and so does every local pytest. Only here, where the comparison's
        # inputs were just rebuilt, are they deselected. Board-SOUNDNESS
        # tests (field purpose, season stamps, dormant, sensitivity, the
        # own-model column vs a fresh run from committed stores) are unmarked
        # and still gate. draft/tests/test_gate_selection.py pins the marked
        # set to an explicit 7-node list and proves this expression deselects
        # exactly that set and nothing else; the classification of all 16 is
        # in draft/audit/rebuild_refusal_diagnosis_2026-08-16.md.
        if: github.event.inputs.snapshot != 'true'
        run: |
          set -o pipefail
          echo "== the board about to be committed must pass the suite that reads it"
          echo "   (repo-parity pins deselected here ONLY — their inputs were just rebuilt; see test_gate_selection.py)"
          if ! python -m pytest draft/tests -q -m "not repo_parity and not post_chain" 2>&1 | tee /tmp/board_gate_output.txt; then
            # REGISTER 55, fixed on Cory's call 08-19: a suite failure is not
            # automatically a BOARD failure. On 08-19 this gate refused the
            # board four times and only ONE of six failures was about the
            # board; the rest were repo hygiene. gate_triage decides which
            # kind we have — everything blocks by default, and only tests
            # named ADVISORY (with a stated reason, self-checked against
            # reading the board) may fail without stopping the publish.
            # ── THE FRIDAY FLIP, PREPARED 2026-08-20 AND DELIBERATELY OFF ────
            #
            # Cory, asked directly: "Prepare the fallback now, decide Friday."
            #
            # A THIRD category exists in gate_triage — WORLD-STATE: a test that
            # is about the board but is saying THE WORLD IS NOT SETTLED YET
            # rather than THE BOARD IS WRONG. The live case is
            # test_freeze_staleness_alarm: six of ten teams had keepers PLACED
            # on the Sleeper draft, so the keeper lock read passed a day early,
            # the pre-draft freeze could not seal, and a fact about the LEAGUE
            # refused publication of the BOARD five times while 4640 other
            # tests passed.
            #
            # ⚠️ IT IS OFF. `ALLOW_WORLD_STATE_PUBLISH` is unset below, and with
            # it unset a world-state failure BLOCKS exactly as it does today —
            # asserted, not claimed, by test_EQUIVALENCE_flag_off_classifies_
            # exactly_as_before. Nothing about this run changes.
            #
            # ⚠️ HOW YOU TURN IT ON CHANGED 2026-08-21 — this said "change the
            # line below to `ALLOW_WORLD_STATE_PUBLISH: \"1\"`", and that would
            # have written a one-time decision into the file the 03:00 CRON reads
            # too. It is now a DISPATCH INPUT (`allow_world_state_publish`), so
            # run the workflow manually with the box ticked. `inputs.*` is empty
            # on a scheduled run, so the cron fails closed however the last
            # dispatch went — the override cannot outlive the run that asked for
            # it. Only the exact string "1" reaches the tool; a typo fails closed. Even on, a real board failure still refuses, and the
            # published board carries public/world_state_override.json naming
            # what was waived, so it can never be mistaken for a clean build.
            #
            # UNSET IT AGAIN the moment all ten teams are placed: at that point
            # the slate reports confirmed, a freeze re-take seals CONFIRMED, and
            # the alarm goes quiet on its own. A permanent override is how a real
            # alarm gets muted, which is the failure the alarm exists to prevent.
            echo "== suite failed — triaging: is this the BOARD, or the repo's own tooling?"
            if python3 draft/tools/gate_triage.py /tmp/board_gate_output.txt; then
              echo "::warning::Board published with ADVISORY test failures — repo hygiene, not the board. Fix them, but they did not hold the board."
            else
              echo "*** REFUSING TO PUBLISH: the freshly built board fails the suite."
              echo "    The previously published board is untouched and still live."
              echo "    Fix the board (or whatever the suite is telling you about it)"
              echo "    and re-run — do NOT bypass this to get a rebuild out."
              exit 1
            fi
          fi

      - name: Make a refused publish LOUD, not just red — found 2026-08-15
        # A run that fails and sits in the Actions tab is invisible until someone
        # goes looking, which is exactly what happened here: the 08:36 UTC nightly
        # refused to publish, left the board 24h+ stale and missing a whole
        # projection source, and nobody knew until this step's absence was
        # investigated by hand many hours later. The gate's DECISION was correct
        # (don't ship a broken board); its SILENCE was the actual defect.
        #
        # `if: failure()` — runs ONLY when the acceptance gate above just failed,
        # and does not change whether the job ends up red (it still does; see the
        # unconditioned steps below, which stay skipped exactly as before). Opens
        # (or updates, if already open — one tracking issue, not one per night) a
        # labeled GitHub issue with the exact failing test names, so a human is
        # notified same-day instead of by accident.
        if: failure() && github.event.inputs.snapshot != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABEL="board-rebuild-broken"
          gh label create "$LABEL" --color B60205 --description "Nightly board rebuild refused to publish" 2>/dev/null || true
          EXISTING=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          FAILING=$(grep -oE "^FAILED [A-Za-z0-9_./:-]+" /tmp/board_gate_output.txt | sed 's/^FAILED //' | sort -u || true)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY_FILE=$(mktemp)
          {
            printf 'The nightly board rebuild ran at %s and refused to publish — the previously published board is still live, untouched.\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '**Failing tests:**\n\x60\x60\x60\n'
            printf '%s\n' "${FAILING:-see run log, no FAILED lines parsed}"
            printf '\x60\x60\x60\n\nRun: %s\n\n' "$RUN_URL"
            printf 'This issue stays open until a rebuild passes clean; it will auto-close then, not before.\n'
          } > "$BODY_FILE"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            gh issue create --title "🔴 Board rebuild refused to publish" --label "$LABEL" --body-file "$BODY_FILE"
          fi

      - name: Diagnose the refusal in-run, where the candidate board exists
        # The refused board lives only on this runner, and the artifact
        # download path is unreachable from the relay sandbox (the GitHub
        # redirect lands on Azure blob storage, 403'd at the egress proxy) —
        # so the diagnosis runs HERE and lands in this log, which is
        # retrievable. Measures via board_activity's and vorp's own
        # functions; prints which exemption spares each unflagged retiree
        # and the replacement-sensitivity behaviour on this exact board.
        # [2026-08-16] The sensitivity section now NAMES THE ARM it measured
        # (SMOOTH: allocation held, move = base x pct by construction; or
        # STEP: a flex slot flipped, step derived from the allocation) —
        # its old text asserted the STEP arm's sign as "the pinned
        # expectation" and, on run 31926152660, misdiagnosed a board whose
        # sensitivity test PASSED (+3.78 at +2% was correct smooth scaling;
        # that run's real refusals were artifact-parity/field-purpose
        # tests). See draft/audit/rebuild_refusal_diagnosis_2026-08-16.md.
        if: failure() && github.event.inputs.snapshot != 'true'
        run: python3 draft/tools/diagnose_refused_board.py || true

      - name: Preserve the refused candidate board for offline diagnosis
        # Added 2026-08-15. The failures that then blocked auto-publish
        # (a retired player unflagged by board_activity.dormant, the
        # replacement-sensitivity step — both measured CLEAN as of run
        # 31926152660) reproduce ONLY against the fresh
        # candidate board built from live fetches — and the runner discarded
        # that board on every refused run, so every diagnosis attempt so far
        # has been done blind, against yesterday's committed board where both
        # tests pass. Preserving the refused candidate (plus the two config
        # inputs it was built from) turns "needs live Sleeper access to
        # debug" into "download one artifact and run the failing test
        # locally". test_pick_log-style test isolation is unaffected: this
        # uploads, commits nothing.
        if: failure() && github.event.inputs.snapshot != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: refused-candidate-board
          path: |
            public/draft_data.json
            draft/config/keepers.json
            draft/data/predicted_keepers.json
          if-no-files-found: warn
          retention-days: 14

      - name: Close the tracking issue if this rebuild is the one that fixed it
        # Reached only when the acceptance gate above SUCCEEDED (no special `if`
        # needed — a step with no condition runs exactly when every prior step
        # in the job has succeeded, GitHub Actions' own default). So "no open
        # board-rebuild-broken issue" becomes a trustworthy signal rather than
        # something to remember to check by hand.
        if: github.event.inputs.snapshot != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABEL="board-rebuild-broken"
          EXISTING=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue comment "$EXISTING" --body "Rebuild at $(date -u +%Y-%m-%dT%H:%M:%SZ) passed clean. Closing — run: $RUN_URL"
            gh issue close "$EXISTING"
          fi

      # ⚠️ MOVED HERE 2026-08-20, AFTER THE ACCEPTANCE GATE, AND THE REASON
      # MATTERS. It first ran BEFORE the gate, and the very next build refused
      # to publish: the gate's suite is written against the board THE BUILDER
      # PRODUCES, and it was suddenly being handed a post-processed one. 18
      # blocking failures, led by twelve undeclared fields the chain writes
      # (now declared in season_stamp.py) plus two tests that pin raw-build
      # values to the decimal — proj_ceiling_source's constructions, which the
      # DS attach deliberately re-sources, and an exact-equality check on
      # proj_mean that ANY post-processing breaks.
      #
      # Checked before reordering rather than assumed: the DS attach does NOT
      # undo the 6-point-passing-TD correction (QB deltas -0.2 to +2.6), so
      # those two are test SCOPE, not a scoring regression.
      #
      # Register 142's fix is intact — the chain still runs inside this job, so
      # a rebuild cannot discard post-processing. What changed is only the
      # order: the gate grades the builder's board, and the post-processed
      # board is graded by draft_day_consistency.js at the end of this step.

      - name: Re-apply the blend, the Draft Sharks bands and the source sheet (added 2026-08-20)
        # ⛔ WITHOUT THIS STEP THE NIGHTLY REBUILD SILENTLY UNDOES FOUR SHIPPED
        # FIXES, AND IT WOULD HAVE DONE IT ON DRAFT MORNING.
        #
        # `build.py` writes a clean public/draft_data.json and this workflow
        # COMMITS it. Everything that runs AFTER build.py -- the multi-source
        # blend, the Draft Sharks floor/ceiling bands, the ranking rules -- lived
        # only in scripts someone ran by hand. So each 08:00 UTC rebuild replaced
        # a corrected board with an uncorrected one, and nothing said so.
        #
        # Found 2026-08-20 while answering "have we deployed everything, can I
        # run mocks on the current model". The honest answer was "yes, until
        # 3am". What the nightly rebuild was about to discard:
        #   * Mike Clay in the blend (7 sources; Cory's ask, 08-20)
        #   * register 140 -- 363 players whose floor/ceiling had been collapsed
        #     to flat, restored to their own player-specific band
        #   * register 139 -- the falsy-zero that ranked six replacement-level
        #     players 695-700 (George Kittle at 697)
        #   * register 139 -- Cory's 2026-08-17 K/DEF demotion ruling
        #
        # ORDER IS LOAD-BEARING: blended_projection reads the frozen projection
        # snapshot; attach_draftsharks applies that blend plus the DS bands to
        # the freshly built board and re-derives vorp/tier/ranks; source_boards
        # reads the finished board. Any other order publishes a board built from
        # a stale input.
        #
        # NOT `|| true`. If the board cannot be corrected it must fail loudly
        # here rather than publish a quietly wrong board -- that is the whole
        # lesson of the four rows above.
        run: |
          set -euo pipefail
          node draft/tools/blended_projection.js
          python3 draft/tools/attach_draftsharks.py
          node draft/tools/source_boards.js
          # EXTENDED 2026-08-20, SAME NIGHT, FOR THE SAME REASON ONE LAYER OUT.
          # Wiring the three above exposed that FIVE MORE public/ artifacts are
          # board-derived and regenerated only by hand. `seat_plan.json` is the
          # one that matters: it is the panel Cory reads at EVERY PICK, and the
          # live copy claimed the current board while 46 of its 60 shortlist
          # projections did not match it. Regenerating moved 4 of his 12 planned
          # picks. An artifact that derives from the board must be rebuilt WITH
          # the board or it is a screenshot with a current-looking timestamp.
          node draft/tools/emit_seat_plan.js
          node draft/tools/position_boards.js
          node draft/tools/mlv_snapshot.js
          # The whole-draft MLV plan Cory asked for. It runs AFTER emit_seat_plan
          # because it reads that file's `my_picks` rather than retyping his
          # schedule -- register 98 was an eighteen-pick artifact quoted for hours
          # after his real twelve were known.
          node draft/tools/mlv_seat_plan.js
          # KEEPER VORP PARITY -- are Cory's keepers priced on the SAME
          # replacement table as every other row on his board? They were not:
          # kept_players are copied out of `players` before apply_vorp runs on
          # the keeper-removed pool, so they shipped carrying a vorp from a
          # different pass (RB 170.47 / WR 171.85 against a published RB 168.60
          # / WR 170.10). Register 148's shape, in the one comparison keepers
          # exist for.
          #
          # FIXED AT THE SOURCE in build.py the same day, so on a healthy
          # rebuild this is a NO-OP that prints "nothing to do" -- which is the
          # point. It stays in the chain because the source fix only helps a
          # board that REBUILDS, and it applies the artifact's own published
          # table rather than computing one, so it cannot introduce a level.
          # Refuses outright if the board publishes no replacement table.
          python3 draft/tools/keeper_vorp_parity.py --fix
          # The alternate source boards behind Cory's toggle. Runs AFTER the
          # blend + DS attach, because it re-ranks whatever the board finally
          # says. It calls vorp.apply_vorp / assign_tiers -- the SAME functions
          # build.py uses -- so the toggle cannot drift from the real board.
          python3 draft/tools/rerank_by_source.py
          # ⚠️ I NAMED THE WRONG GENERATOR FOR THIS ONE AND THE EXCEPTION I WROTE
          # WAS FICTION. The line below this step originally read "NOT WIRED:
          # variance_portfolio.js (conditional_value_2026.json) — it exceeded two
          # minutes". variance_portfolio.js writes variance_portfolio.json and
          # has nothing to do with this artifact: I grepped for a MENTION of the
          # filename, took the first hit as the writer, timed THAT program, and
          # reported its runtime as this artifact's.
          #
          # The real generator is draft/backtest/conditional_value.py and it runs
          # in FOUR SECONDS. The file feeding the war-room chips sat outside the
          # nightly rebuild on the strength of a timing measurement taken on an
          # unrelated program. It matters: the drifted rows were handcuff backups
          # for Cory's own running backs. It runs BEFORE the consistency check
          # below, or that check fails on an artifact this step was meant to fix.
          python3 draft/backtest/conditional_value.py
          # AND THEN PROVE IT, rather than trusting that running the steps was
          # enough. This joins every artifact the war room reads BACK to the
          # freshly built board and compares the VALUES -- not the timestamps,
          # because timestamps are exactly what failed in register 143 (the
          # stale seat plan and the fresh board agreed on their provenance
          # stamps and disagreed on their numbers). Exit 1 on draft-critical
          # drift, so a board that would mislead Cory fails the build instead of
          # being published.
          node draft/tools/draft_day_consistency.js
          # AND THEN: is any of it actually ON A SCREEN? Cory, 2026-08-20:
          # "All the things we figure out here have to be implemented on the
          # war room or it was all for nothing!!" He said it after finding that
          # attach_draftsharks.py had been writing proj_ds onto the board for
          # weeks while a grep across every war-room script returned ZERO hits.
          # Report-only ON PURPOSE and not --strict: 25 fields and 2 artifacts
          # are unshown today, and failing the board build on a backlog that
          # predates the check would block Cory's rebuild two days before his
          # draft. It goes strict once the backlog is worked down; the ratchet
          # is the routed list to B, not this exit code.
          node draft/tools/nothing_computed_goes_unshown.js || true
          # ── POST-CHAIN ACCEPTANCE — REQUIRED BY THE INDEPENDENT AUDIT ────
          #
          # The external reviewer (run 32329894396, 2026-08-20) raised this as
          # its one HIGH finding, against the gate reorder in this very file,
          # and it was right:
          #
          #   "The acceptance gate no longer tests the final published board;
          #    it runs before the post-processing chain. A consistency join is
          #    not a substitute for functional/invariant tests."
          #
          # I moved the gate earlier so it would grade the board the BUILDER
          # produces. That fixed one hole and opened another: nothing
          # functional then graded the artifact Cory actually drafts from.
          # draft_day_consistency.js compares VALUES across artifacts; it does
          # not assert invariants.
          #
          # So the invariants that previously broke on this exact chain are now
          # asserted ON THE PUBLISHED BOARD, after post-processing and before
          # the commit: register 139 (the falsy-zero ranking that silently
          # reverted Cory's K/DEF ruling) and register 140 (363 players' bands
          # collapsed to floor=ceiling=mean and shipped). NOT `|| true` — a
          # board that fails these must not be published.
          # ADDED 2026-08-20 (A). A THIRD invariant of the same class, and the
          # only one of Cory's rulings on this chain that had no post-chain
          # assertion at all: "I want to use draft sharks ceilings.. for every
          # source that doesnt offer ceilings, make the ceiling AND floor the
          # same % away from their proj as draft sharks."
          #
          # WHY IT HAS TO BE HERE AND NOT IN THE STEP-16 GATE. The construction
          # stamp is written by attach_draftsharks.py, which runs in THIS step —
          # so at step 16 the board carries projections.py's enum and the
          # question cannot be asked. Measured on the committed artifact: inside
          # the top 150 by ADP, 148 draftsharks_pct + 2 rescaled pre-DS band,
          # and ZERO with no band. Outside it, 90 players have no band, which is
          # fine and is why the assertion is scoped to his draft range rather
          # than to the whole board.
          #
          # Control run before this line was written (Rule 3f): forcing one
          # top-150 player's stamp to the "none" construction makes it fail.
          #
          # ADDED 2026-08-20, SECOND BATCH, AND THESE TWO ARE WHY THE REBUILD
          # HAD FAILED SEVEN NIGHTS RUNNING (run 32425450897, 6 blocking):
          #   · test_source_bands — measured `with_ds_band: 0, no_ds_band: 700`
          #     on the fresh board. The DS band it travels FROM is written by
          #     attach_draftsharks.py, in THIS step.
          #   · test_alt_source_rankings — `assert 157.45 == None` on Jahmyr
          #     Gibbs' vorp_ds, comparing the committed board (which has the
          #     per-source fields) against a fresh one (which does not until
          #     rerank_by_source.py runs, also in THIS step).
          # Neither was reporting a bad board. Both were being asked their
          # question at the one moment it has no answer.
          # THE PER-SOURCE FIELDS, GENERATED RATHER THAN HAND-RUN (2026-08-20).
          # `rerank_by_source.py` above writes public/board_<key>.json — SEPARATE
          # FILES. It never puts vorp_ds/tier_ds/pos_rank_ds onto the main board.
          # `alt_source_rankings.py` is the only producer of those 48 fields and
          # it was run BY HAND once and its output committed, so every rebuild
          # dropped them and test_alt_source_rankings correctly read
          # `assert 147.0 == None` on Jahmyr Gibbs.
          #
          # An earlier attempt wired this BEFORE the acceptance gate and turned
          # one failure into nine — 48 fields arriving after the declaration and
          # stamping steps had already run. Both causes are fixed (the fields are
          # declared in season_stamp.py as of bb55ca5f) and it now runs HERE,
          # after the gate, where it cannot affect it either way.
          # MUST RUN BEFORE alt_source_rankings.py, which can only rank a
          # source whose projection is a FIELD ON THE BOARD. Cory, 2026-08-21:
          # "Where are all the other sources we got?? We got more than that?"
          # The blend uses seven sources; four of them (CBS, ESPN, FFToday,
          # Mike Clay) were ingested, committed and blended into the number he
          # drafts on, yet unrankable and so absent from the Big Board toggle,
          # purely because nothing stamped their per-player numbers onto the
          # board. This stamps them from two stores already committed and
          # already read elsewhere in this pipeline. Additive only — new field
          # names nothing else reads — and it EXITS 1 without writing if its
          # own controls fail, so a broken join cannot reach the board.
          python3 draft/tools/attach_multisource.py
          python3 draft/tools/alt_source_rankings.py
          # position_boards.js already ran ~140 lines above, BEFORE the attach
          # step wrote proj_cbs/espn/fftoday/clay onto the board — so its
          # covered_by_source was 0 for all four at every position and the war
          # room printed a dash for their VONA (register 253, found on the
          # live 2026-08-22 post-lock board). Re-run it here, against the
          # board as it will actually publish. Re-running is the safe fix:
          # moving the attach step earlier would reorder steps across the
          # publish gate.
          node draft/tools/position_boards.js
          # ⚠️ AND THIS LINE IS WHY conditional_value.py RUNS TWICE.
          #
          # alt_source_rankings.py WRITES public/draft_data.json (it adds the
          # per-source rank/vorp/tier columns). conditional_value.py ran ~90
          # lines above and stamped an `input_fingerprint.board` hash of the
          # board AS IT WAS THEN — so on run 32432432133 the artifact the war
          # room fetches claimed board `dbc700211da0` while the board actually
          # published was `0ba1b5001896`.
          #
          # The NUMBERS were fine: this tool adds columns and never touches
          # proj_mean, which is what the premiums are computed from. What was
          # wrong is the provenance stamp, and that is register 143's failure
          # mode with the sign flipped — there the stale artifact and the fresh
          # board AGREED on their stamps and disagreed on their numbers, which
          # is exactly why a stamp nobody can trust is worth fixing rather than
          # explaining away.
          #
          # It is re-run rather than moved because the ordering above is load-
          # bearing: conditional_value.py must precede draft_day_consistency.js
          # or that check grades a stale artifact. Re-running costs 4 seconds
          # and makes the fingerprint mean what it says.
          python3 draft/backtest/conditional_value.py
          # ── SELF-DIAGNOSIS, so a post-chain refusal explains itself ───────
          # Run 32426770992 refused on "ten inside Cory's draft range have a flat
          # band". The committed board has ZERO, so it is a REBUILD regression,
          # and nothing in the log said which of the three band paths produced it
          # or what the inputs were. Reading it off the committed board is
          # impossible by definition — the committed board is the one that
          # passes. So the candidate board reports on itself, before the gate
          # that judges it. Prints nothing when the board is clean.
          python3 - <<'PY'
          import json, pathlib
          P = json.loads(pathlib.Path("public/draft_data.json").read_text())["players"]
          bad = [p for p in P
                 if p.get("proj_ceiling") is not None and p.get("proj_mean") is not None
                 and abs(p["proj_ceiling"] - p["proj_mean"]) <= 0.01
                 and (p.get("adp") or 999) <= 200]
          if bad:
              print("== FLAT BANDS INSIDE CORY'S DRAFT RANGE: %d ==" % len(bad))
              cols = ("proj_mean", "proj_sd", "proj_ds", "proj_ds_ceiling",
                      "ds_band_from", "proj_mean_pre_ds", "proj_ceiling_pre_ds",
                      "proj_floor_pre_ds", "proj_ceiling_source")
              for p in bad:
                  print("  %-22s adp %-6s" % (p.get("name"), p.get("adp")))
                  for c in cols:
                      print("      %-22s %s" % (c, p.get(c)))
              print("== the branch that produced each is `ds_band_from`: "
                    "draftsharks_pct | pre_ds_pct | None(collapsed). A None means "
                    "attach_draftsharks found no DS band AND no usable prior band "
                    "on the row it snapshotted. ==")
          else:
              print("band check: no flat bands inside ADP<=200")
          PY
          python3 -m pytest -q -m post_chain \
            draft/tests/test_attach_draftsharks_ranking.py \
            draft/tests/test_band_is_player_specific.py \
            draft/tests/test_source_bands.py \
            draft/tests/test_alt_source_rankings.py
          # Not marked post_chain (the file has unmarked tests that must keep
          # running in the pre-chain gate), so it is named explicitly.
          python3 -m pytest -q \
            "draft/tests/test_provenance_census.py::test_every_player_Cory_can_actually_draft_carries_a_real_band"

      - name: Commit the artifact if it changed
        # ⚠️ `draft/config/keepers.json` ADDED 2026-08-14 — it was REGENERATED EVERY
        # RUN AND NEVER COMMITTED. The step above rebuilds it from live Sleeper
        # designations, the board is then built from that fresh copy, and the file
        # was thrown away with the runner. The repo kept whatever was last
        # hand-committed.
        #
        # Measured: the committed file carried ONE team at draft_slot 4, while the
        # board built beside it reported FOUR teams designated and slot 8. Neither
        # was wrong — they were different vintages of the same input, and the
        # disagreement is what sent me looking.
        #
        # THE BOARD WAS NEVER AFFECTED; it is built from the fresh copy. What was
        # lost is REPRODUCIBILITY: you could not rebuild a published board from the
        # repo, because the keeper input that produced it no longer existed
        # anywhere. For a project whose premise is auditable evidence, an input
        # that vanishes after use is the wrong kind of missing.
        if: github.event.inputs.snapshot != 'true'
        id: publish
        run: |
          # player_positions.json ADDED 2026-08-15 (data audit): build.py grows
          # this union-over-builds record on the runner every rebuild, but it
          # was never in this commit list — so the committed record was frozen
          # at its last hand-commit and the union could not actually grow. A
          # union that only grows in a discarded working tree is not a record.
          # ⚠️ roster_state_series.json ADDED 2026-08-20 — REGISTER 155, AND IT IS
          # THE SAME DEFECT A THIRD TIME IN THIS ONE LIST. `build.py:2415` calls
          # `roster_state_mod.capture()` on every nightly run, writes real
          # depth-chart and injury state to draft/data/roster_state_series.json,
          # and this list did not name the file — so the runner discarded it and
          # the store has NEVER reached main. Every night since 2026-08-17 is a
          # permanent hole in next year's absence model, which is exactly the
          # data the bench-option work has just shown to be load-bearing.
          #
          # Verified before adding, because a path added for a file nothing
          # writes is a fix that reports success and does nothing: build.py does
          # call it (line 2415, via the `roster_state_mod` alias — which is why a
          # grep for the STORE name in build.py finds nothing and nearly had me
          # report the manifest's row as wrong), the module's STORE constant
          # points at that path, and `git ls-tree origin/main` returns zero hits
          # for it today.
          #
          # A capture that runs and is thrown away is worse than one that does
          # not run: the logs say it worked.
          #
          # projection_coverage_census.json ADDED 2026-08-19, the SAME defect one
          # line below its own warning: A wired the census REGENERATION into this
          # workflow (so the gate stopped failing on a stale census) but not into
          # this list — so CI graded a fresh census and committed the old one, and
          # the repo's copy stayed one rebuild behind for every consumer but the gate.
          PATHS="public/draft_data.json public/mlv_plan.json public/board_ds.json public/board_sleeper.json public/board_own.json public/board_fp.json public/source_boards.json public/seat_plan.json public/position_boards.json public/mlv_recommend.json public/conditional_value_2026.json draft/data/conditional_value_2026.json public/opponent_need_2026.json draft/data/blended_projection.json draft/config/keepers.json draft/config/league_config.json draft/data/league_history.json draft/data/predicted_keepers.json draft/data/opening_script.md draft/data/opening_script.json draft/backtest/cory-conditional.json draft/backtest/CORY-CONDITIONAL.md draft/data/adp_series.json draft/data/proj_series.json draft/data/room_read.md draft/data/room_read.json draft/data/player_positions.json draft/backtest/projection_coverage_census.json draft/data/roster_state_series.json public/world_state_override.json"
          EXISTING=""
          for p in $PATHS; do [ -e "$p" ] && EXISTING="$EXISTING $p"; done
          if [ -z "$EXISTING" ] || git diff --quiet -- $EXISTING; then
            echo "no change"
            exit 0
          fi
          git config user.name  "draft-bot"
          git config user.email "actions@github.com"
          git add $EXISTING
          git commit -m "Draft board: rebuild $(date -u +%Y-%m-%d)"
          # PUSH-RACE RETRY (added 2026-08-17): run 32080224084 passed the whole
          # gate, committed the board on the runner, and DIED here — a lane
          # session pushed main between checkout and push, and the fresh board
          # was lost with the workspace. The board commit touches only the
          # rebuild's own data files, so a rebase over doc/lane commits is
          # safe; three attempts, then fail loudly as before.
          for attempt in 1 2 3; do
            git push && break
            [ "$attempt" = 3 ] && { echo "push still racing after 3 rebases"; exit 1; }
            if ! git pull --rebase --autostash origin main; then
              # A concurrent push edited one of the REBUILD'S OWN generated
              # files (attempt 4 hit this on opening_script.json). For files
              # this workflow regenerates, the fresh rebuild IS the truth —
              # during a rebase the incoming rebuild commit is "theirs".
              git checkout --theirs -- $EXISTING || true
              git add $EXISTING
              GIT_EDITOR=true git rebase --continue
            fi
          done
          # Tell the verify step below whether a SERVED file actually moved —
          # a push that only refreshed draft/ data (Lab lane) triggers no
          # Netlify build by the gate's own rules, so polling for one would
          # time out against correct behavior.
          if git diff --name-only HEAD~1 HEAD | grep -q '^public/'; then
            echo "served=true" >> "$GITHUB_OUTPUT"
          else
            echo "served=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the deploy actually shipped this board
        # THE ONE DEPLOY NOBODY VERIFIED, found by the 2026-08-15 macro audit.
        # deploy-verify.yml triggers on push — but this workflow pushes with
        # GITHUB_TOKEN, and GitHub's recursion guard means a bot push triggers
        # NO workflows. So the daily board deploy — draft morning's included —
        # shipped on faith. This polls the live build-stamp from INSIDE the
        # same run (no trigger needed) until it names the commit just pushed.
        # A silent Netlify failure becomes a red nightly run instead of Cory
        # drafting on yesterday's board. Runs ONLY when a served file moved,
        # because a data-only push correctly builds nothing.
        if: github.event.inputs.snapshot != 'true' && steps.publish.outputs.served == 'true'
        env:
          SITE: ${{ vars.SITE_URL || 'https://makefbgreatagain.netlify.app' }}
        run: |
          WANT="$(git rev-parse HEAD)"
          echo "polling $SITE/build-stamp.json for ${WANT:0:12} (Netlify builds usually land in 1-3 min)"
          deadline=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            GOT="$(curl -fsS --max-time 20 "$SITE/build-stamp.json" 2>/dev/null \
                   | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || echo '')"
            if [ "$GOT" = "$WANT" ]; then
              echo "deploy verified: live build-stamp reports ${GOT:0:12}"
              exit 0
            fi
            echo "  live stamp: ${GOT:0:12} — waiting"
            sleep 30
          done
          echo "::error::the board was pushed 10 minutes ago and the live site still reports '${GOT:-nothing}' — the deploy did not land. Check Netlify build minutes/status BEFORE trusting the live board."
          exit 1
