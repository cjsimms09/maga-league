# THE LOOP AUDITS ITSELF EVERY MONDAY, SO NOBODY HAS TO ASK HOW IT IS DOING.
#
# Cory, 2026-08-18: "They should be structured, organized, self feeding. And you
# should design in a way where I don't have to ask for more predictions,
# projections, improvements, we should constantly be trying to improve."
#
# ── WHY A WORKFLOW AND NOT JUST THE CI STEPS ───────────────────────────────
#
# CI already runs `prediction_ledger_check.js` and `projection_breadth.js`, and
# both fail the build when something is overdue. That is enough to stop the loop
# ROTTING. It is not enough to make it GROW, for one reason:
#
#   **CI only runs when somebody pushes.** A programme that has genuinely gone
#   quiet produces no pushes, so the checks that would notice the quiet never
#   run. The failure mode Cory named — nobody filing anything new — is exactly
#   the failure mode a push-triggered check cannot see. The cadence rule in
#   prediction_ledger_check.js has the same blind spot for the same reason.
#
# So this runs on a clock instead, and its whole job is to be the thing that
# still fires when nothing else is happening.
#
# ── WHAT IT DOES ───────────────────────────────────────────────────────────
#
#   1. Surveys projection BREADTH — which signal axes have a live arm.
#   2. Runs the ledger check, whose CADENCE rule (MAX_QUIET_DAYS = 14) is the
#      one most in need of a clock: it fires when nothing new has been FILED,
#      and "nothing has been filed" and "nobody has pushed" are the same state
#      in a push-triggered run, so CI can only ever see it late.
#   3. Emits ledger-ready prediction rows for every uncovered axis.
#   4. Commits the dated report to draft/audit/learning-loop/, so the trend is
#      readable — one number, every Monday, for the whole season.
#   5. Opens an issue ONLY when something is actually wrong.
#
# ⚠️ STEP 5 IS DELIBERATELY NARROW, AND THE REASON IS THIS PROJECT'S OWN
# EPITAPH: "a guard that cries wolf every morning is a guard that gets switched
# off" — written about the intervention-rate check, which nagged daily until
# everyone stopped reading it. A weekly report that is green opens nothing and
# says nothing. The commit is the record; the issue is the alarm.
name: Learning loop — weekly self-audit

on:
  schedule:
    # Mondays 12:20 UTC. Off the hour so it never queues behind the :00 crowd,
    # and after Tuesday's grader has had a full week to land its results.
    - cron: '20 12 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the audit and print it, commit nothing and open no issue'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Survey breadth, cadence and the open backlog
        id: audit
        run: |
          set -uo pipefail
          TODAY="$(date -u +%F)"
          OUT="$RUNNER_TEMP/loop-audit.md"
          RED=0

          {
            echo "# Learning-loop audit — $TODAY"
            echo
            echo "Generated by \`.github/workflows/learning-loop-audit.yml\`. Nobody asked for this."
            echo
            echo '## Breadth — how many signal axes actually run every week'
            echo
            echo '```'
          } > "$OUT"

          # ⚠️ `set -e` is NOT on, on purpose: both tools exit non-zero to REPORT
          # a problem, and this job's job is to collect the report rather than to
          # die on it. That distinction cost draft-night-sync.yml a whole dry run
          # before anyone noticed (`bash -e` killed the retry loop mid-assignment).
          node draft/tools/projection_breadth.js --today "$TODAY" >> "$OUT" 2>&1
          BREADTH=$?
          echo '```' >> "$OUT"
          [ "$BREADTH" -ne 0 ] && RED=1

          {
            echo
            echo '## The ledger — graded on time, and every grade naming a successor'
            echo
            echo '```'
          } >> "$OUT"
          node draft/tools/prediction_ledger_check.js --today "$TODAY" >> "$OUT" 2>&1
          LEDGER=$?
          echo '```' >> "$OUT"
          [ "$LEDGER" -ne 0 ] && RED=1

          {
            echo
            echo '## Questions nobody has asked yet'
            echo
            echo 'One row per uncovered axis, ready to paste into `PREDICTION-LEDGER.md`.'
            echo 'If this section is empty, every axis we know of is live — which has'
            echo 'never yet been true, and would mean the registry needs a new row'
            echo 'rather than that the search is finished.'
            echo
          } >> "$OUT"
          node draft/tools/projection_breadth.js --today "$TODAY" --emit 2>&1 \
            | sed -n '/^| Pnn/p' >> "$OUT"

          echo "red=$RED" >> "$GITHUB_OUTPUT"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          cat "$OUT"

      - name: Commit the dated report
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -uo pipefail
          D="draft/audit/learning-loop"
          mkdir -p "$D"
          cp "${{ steps.audit.outputs.out }}" "$D/${{ steps.audit.outputs.today }}.md"
          git config user.name lab-bot
          git config user.email lab-bot@users.noreply.github.com
          git add "$D"
          if git diff --cached --quiet; then
            echo "no change — nothing to commit"
            exit 0
          fi
          git commit -q -m "Learning-loop audit ${{ steps.audit.outputs.today }} [skip deploy]" \
            -m "Weekly breadth + cadence survey. The trend is the point: one number a week."
          # Same durable-push discipline as own-weekly-grade.yml — a report that
          # only exists on a runner is not a record.
          n=0; pushed=0
          until [ $n -ge 5 ]; do
            if git push -q; then pushed=1; break; fi
            n=$((n+1)); echo "push rejected (attempt $n) — rebasing and retrying"
            git pull --rebase -q || { git rebase --abort 2>/dev/null || true; }
            sleep $((n * 2))
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::PUSH FAILED — report NOT durable; orphan commit $(git rev-parse HEAD)"
            exit 1
          fi

      - name: Open an issue ONLY if something is red
        if: ${{ steps.audit.outputs.red == '1' && github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue create \
            --title "Learning loop: an axis deadline or a prediction has slipped (${{ steps.audit.outputs.today }})" \
            --body-file "${{ steps.audit.outputs.out }}" \
            --repo "$GITHUB_REPOSITORY"
