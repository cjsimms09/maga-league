# TERRITORY: C
name: THE INGEST RUN — a real pool through the pre-registered filters

# The spine, end to end, against leagues nobody has looked at: crawl (D1 v2 terms)
# -> sample (D6) -> fetch three exports per league -> canonical record -> crosswalk
# -> ADP as-of -> F3 weekly outcomes (D5) -> attrition report by reason.
#
# WHY IT MUST NOT DEFAULT TO 2026. Measured 2026-08-11: fetch_weekly(2026) returns
# HTTP 404 from BOTH nflverse loaders, so every league would come back
# F4.no_weekly_data and the run would report ZERO MATCHED — the identical output to
# a broken fetch and to wrong filters. A control season is fetched alongside the
# target for exactly that reason (D5h), and the readiness state leads the verdict.
#
# WHY THE SAMPLE IS A RULE AND NOT A NUMBER. The 2025 crawl returned 21,323 unique
# leagues; three exports each is ~64,000 requests. D6 fixes the sample as
# sha256(salt|league_id) order — reproducible, blind to leagueSearch's ordering,
# and NESTED so a larger n is a superset of a smaller one rather than a fresh draw.
#
# Nothing is committed. The report is an artifact and a job summary.

on:
  # ── THE CENSUS ARCHIVE HAD NO TRIGGER (2026-08-12) ──────────────────────────
  # `census_archive.py` exists because MFL's public pool is a MOVING POPULATION and
  # a census of it "cannot be reconstructed next year from any source". That is its
  # own docstring. The append ran only when a human dispatched this workflow, so the
  # archive whose entire justification is unrecoverability was saving nothing on its
  # own — the intention-with-no-trigger failure this lane keeps documenting, in the
  # lane that documents it. Found by checking which of my workflows carry a cron,
  # after wiring two new measurements into this one and realising neither would ever
  # fire unattended.
  #
  # MONTHLY, not daily. The module asks whether the pool's composition is "worth a
  # row a year"; twelve rows a year answers that generously and a full MFL crawl is
  # not a thing to run nightly. `data-inventory.yml` already uses `0 8 1 * *`, so
  # this sits an hour later to avoid contending with it.
  #
  # Reversible in one line: delete the two `schedule` lines and it is dispatch-only
  # again.
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Season to ingest (must be a season that has been PLAYED)'
        required: false
        default: '2025'
      control_year:
        description: 'Control season — its ONLY job is to tell an unplayed season from a broken fetch'
        required: false
        default: '2024'
      sample:
        description: 'How many pooled leagues to fetch (D6 order)'
        required: false
        default: '150'
      deadline_s:
        # A run KILLED by the job timeout produces nothing. A run that stops at a
        # budget reports `never_attempted` and says its denominator is incomplete.
        description: 'Stop fetching after this many seconds and report what was reached'
        required: false
        default: '2100'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    # 150, not 60. The F7 decision rule registered in INGEST-PLAN needs 320+ league
    # formats READ to close the interval, and at run 11's measured 12.6 s/league that
    # is ~67 minutes of fetching alone. A run killed by the job clock produces
    # nothing; `deadline_s` is the budget that stops it gracefully, and this only has
    # to be comfortably larger than that.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install loaders
        # Installed here rather than added to draft/requirements.txt — that file is
        # not this lane's to edit.
        run: pip install -q pandas nfl_data_py nflreadpy || pip install -q pandas nfl_data_py
      - name: Run the ingest
        env:
          YEAR: ${{ github.event.inputs.year || '2025' }}
          CONTROL: ${{ github.event.inputs.control_year || '2024' }}
          SAMPLE: ${{ github.event.inputs.sample || '150' }}
          DEADLINE_S: ${{ github.event.inputs.deadline_s || '2100' }}
        run: |
          python3 - <<'PY'
          import datetime as _dt
          import json, os, sys, urllib.parse, urllib.request
          sys.path.insert(0, "draft"); sys.path.insert(0, "draft/backtest")
          import external_discovery as D
          import external_outcomes as X
          import grade as GR
          import ingest_run as R
          import mfl_adapter as A
          import mfl_adp as MADP
          from adp_asof_probe import USER_AGENT

          YEAR = int(os.environ["YEAR"]); CONTROL = int(os.environ["CONTROL"])
          N = int(os.environ["SAMPLE"])

          # 1. THE POOL, from the registered terms. A failed term is a hole, never a zero.
          crawled = D.crawl(D.mfl_fetch, YEAR)
          pool_rep = D.pool_report(crawled)
          print("POOL:", pool_rep["verdict"])

          # 2. THE SAMPLE, by rule (D6).
          ids = D.sample_pool(crawled["leagues"], N)
          samp = D.sample_report(crawled["leagues"], ids)
          print("SAMPLE:", samp["verdict"])

          # 3. WEEKLY OUTCOMES, target AND control. The control's only job is D5h.
          tgt = X.fetch_weekly(YEAR)
          ctl = X.fetch_weekly(CONTROL)
          ready = X.season_readiness(YEAR, tgt.get("rows"), tgt.get("error"),
                                     CONTROL, ctl.get("rows"), ctl.get("error"))
          print("READINESS:", ready["state"], "—", ready["why"])
          for t in (tgt.get("tried") or []) + (ctl.get("tried") or []):
              print("   %(loader)s: %(status)s — %(detail)s" % t)

          # 4. THE ID HOP. Weekly is GSIS-keyed; our board is Sleeper-keyed. No map
          #    means nothing joins, and "nothing joined" looks exactly like "none of
          #    these players played" — so it is refused by name, not defaulted.
          try:
              import nfl_data_py as nfl
              gsis = GR.crosswalk_gsis_to_sleeper([], nfl.import_ids())
          except Exception as e:                                   # noqa: BLE001
              print("!! import_ids unavailable: %s: %s" % (type(e).__name__, e))
              gsis = {}
          print("gsis->sleeper pairs: %d" % len(gsis))

          # 5. OUR BOARD, whole — players AND kept_players (a partial index books our
          #    own bug as "their league has players we cannot price").
          board = json.load(open("public/draft_data.json"))
          index = A.board_index(board)

          # 6. MFL's players export for the year, for the crosswalk's first hop.
          def mfl_players(year):
              url = "https://api.myfantasyleague.com/%s/export?%s" % (year, urllib.parse.urlencode(
                  {"TYPE": "players", "DETAILS": "1", "JSON": "1"}))
              req = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
              with urllib.request.urlopen(req, timeout=180) as r:
                  return MADP._players_index(json.loads(r.read().decode("utf-8", "replace")))
          try:
              players = mfl_players(YEAR)
          except Exception as e:                                   # noqa: BLE001
              print("!! MFL players export FAILED: %s: %s — every league will report "
                    "unknown_mfl_id, which is OUR fetch and not their data"
                    % (type(e).__name__, e))
              players = {}
          print("MFL players indexed: %d" % len(players))

          # THE SHIPPED READER, not a hand-rolled json.load. The archive on disk is
          # {"_note":..., "series":[...]}; loading it raw hands the WRAPPER to
          # as_store_snapshots, which iterates a dict's KEYS. Author stepped in
          # exactly this on 2026-08-11.
          import external_adp_capture as CAP
          series = CAP.load()
          cov = CAP.coverage(series, YEAR)
          print("ADP ARCHIVE for %s: %s" % (YEAR, json.dumps(cov)))
          if not cov["snapshots"]:
              print("!! NO ADP SNAPSHOTS FOR %s — every league will report "
                    "F4.no_pre_draft_adp. That is the ARCHIVE, not the leagues." % YEAR)

          rep = R.run(ids, YEAR, out_path="ingest-report.json",
                      players=players, board=index, series=series,
                      weekly_rows=(tgt.get("rows") or []), gsis_to_ours=gsis,
                      readiness=ready,
                      # Well inside the 60-minute job timeout. A run killed by the
                      # clock produces NOTHING; a run that stops early reports
                      # `never_attempted` and says its denominator is incomplete.
                      deadline_s=int(os.environ.get("DEADLINE_S", "2100")))
          rep["pool"] = pool_rep
          rep["sample"] = samp
          json.dump(rep, open("ingest-report.json", "w"), indent=1)
          # CAPTURE, NOT MODELLING (Cory's standing distinction, 2026-08-12). The
          # census was computed on every run, written to an artifact with a 90-day
          # retention, and DISCARDED — this run committed nothing. MFL's public pool
          # is a MOVING POPULATION, so a census taken today is not reconstructable
          # later from any source, which is exactly what Route 1 closed on.
          # F7's negative answer is a verdict about POOLING, not about whether the
          # pool's composition is worth a row a year.
          import census_archive as CA
          import field_population as FP
          # THE KEY IS PASSED, NOT FISHED OUT OF THE REPORT. The first CI run wrote a
          # row with season/observed_at/examined all null, because this module read
          # them off the top level of a report that keeps them elsewhere. The dedup
          # key became ("None","None") and the next run would have REPLACED the row
          # rather than appending — a series capped at one observation, silently.
          # `append()` now refuses a keyless row, so this call is what keeps it green.
          _doc = CA.append(rep, observed_at=_dt.datetime.now(_dt.timezone.utc)
                                             .date().isoformat(),
                           season=YEAR, examined=(pool_rep or {}).get("examined"))
          json.dump(_doc, open(CA.SERIES, "w"), indent=1)
          print("census row appended -> %s" % CA.SERIES)
          # POPULATION, PRINTED AT WRITE TIME (Cory, 2026-08-12). The archive already
          # carries this dict; printing the one line puts a field that has gone empty
          # in front of whoever reads the run, instead of waiting for someone to open
          # the JSON. A record nobody reads is the hole in a different place.
          print("   %s" % FP.line(_doc["population"]))

          # DIAGNOSTICS LAST, AND COMPACT. The full report is ~700 log lines and
          # the evidence that decides the next fix is a dozen of them in the
          # middle. Printing it at the END means a fixed tail always reaches it —
          # the alternative is re-reading the whole log to find twelve strings,
          # which is what the last three iterations of this cost.
          print("\n===== DIAGNOSTICS (read these first) =====")
          c = (rep.get("outcomes") or {}).get("census") or {}
          for why, ex in sorted((c.get("unparsed_samples") or {}).items()):
              print("  %-24s %s" % (why, json.dumps(ex[:8])))
          print("  position_blocks     %s" % json.dumps(
              dict(list((c.get("position_blocks") or {}).items())[:8])))
          print("  by_reason           %s" % json.dumps(c.get("by_reason")))
          cw = rep.get("crosswalk") or {}
          if cw:
              print("  crosswalk           pooled=%s clearing_F2=%s/%s conflicts=%s "
                    "unknown_mfl_id=%s no_sleeper_match=%s"
                    % (cw.get("pooled_rate"), cw.get("leagues_clearing_F2_bar"),
                       cw.get("leagues_with_picks"), cw.get("conflicts"),
                       cw.get("unknown_mfl_id"), cw.get("no_sleeper_match")))
              for x in (cw.get("matched_pairs_for_hand_check") or [])[:8]:
                  print("    PAIR  %-24s %-3s | %-24s %-3s | %s"
                        % (x.get("mfl_name"), x.get("mfl_pos"),
                           x.get("board_name"), x.get("board_pos"), x.get("method")))
              # DOES THE SHORTFALL HAVE A SHAPE? Printed beside the rate because the
              # rate cannot show it: 0.94 says how many missed, never WHICH KIND. If
              # the misses concentrate in one position, or in suffixed names, every
              # downstream number is biased in a direction nobody has characterised.
              # Both sides, because the question is a comparison.
              _uc = cw.get("unmatched_composition") or {}
              _mc = cw.get("matched_composition") or {}
              if _uc.get("by_pos") or _mc.get("by_pos"):
                  print("  MISSED by pos       %s   suffixed=%s"
                        % (json.dumps(dict(list((_uc.get("by_pos") or {}).items())[:8])),
                           _uc.get("with_name_suffix")))
                  print("  MATCHED by pos      %s   suffixed=%s"
                        % (json.dumps(dict(list((_mc.get("by_pos") or {}).items())[:8])),
                           _mc.get("with_name_suffix")))
                  if _uc.get("by_why"):
                      print("  missed by reason    %s" % json.dumps(_uc["by_why"]))
              # A single conflicts= total conflates the wrong player with a player
              # who changed team between two snapshots. Split, with the values.
              cb = cw.get("conflict_breakdown") or {}
              print("  conflicts           position=%s team_only=%s (of %s rows); "
                    "%s pairs agreed once BOTH sides were spelled the matcher's way"
                    % (cb.get("position_disagreements"), cb.get("team_only_disagreements"),
                       cb.get("rows_seen"), cw.get("vocabulary_only_agreements")))
              print("  position_pairs      %s" % json.dumps(cb.get("position_value_pairs")))
              print("  team_pairs          %s" % json.dumps(cb.get("team_value_pairs")))
              for x in (cb.get("position_conflict_sample") or []):
                  print("    CONFLICT  %-22s %-3s %-3s | %-22s %-3s %-3s | %s"
                        % (x.get("mfl_name"), x.get("mfl_pos"), x.get("mfl_team"),
                           x.get("board_name"), x.get("board_pos"), x.get("board_team"),
                           x.get("method")))
          d7 = rep.get("within_pool_adp") or {}
          if d7:
              fm = d7.get("format_matched") or {}
              wp = d7.get("whole_pool_INADMISSIBLE_under_D7") or {}
              print("  D7 population       %s F1-passing leagues, %s of %s picks"
                    % (d7.get("f1_passing_leagues"), d7.get("picks_in_format_matched_pool"),
                       d7.get("picks_in_whole_pool")))
              print("  D7 format-matched   %s" % fm.get("verdict"))
              print("  D7 board sizes      %s ; distribution %s"
                    % (json.dumps(fm.get("leagues_by_board_size")),
                       json.dumps(fm.get("board_size_distribution"))))
              print("  D7 whole-pool(N/A)  %s" % wp.get("verdict"))
              # The whole-pool figure is an UPPER BOUND on the format-matched one:
              # format-matching is a filter on picks, so boards can only shrink.
              # A violation is a defect in this code, not news about the pool.
              sb = d7.get("subset_bound") or {}
              print("  D7 subset bound     %s" % sb.get("verdict"))
              for v in (sb.get("violation_sample") or []):
                  print("    VIOLATION  %s fmt=%s > whole=%s"
                        % (v.get("league_id"), v.get("format_matched"), v.get("whole_pool")))
              cv = (fm.get("calendar_covariates") or {})
              print("  D7 M4 covariates    %s" % cv.get("verdict"))
              for k, v in sorted((cv.get("by_key") or {}).items()):
                  print("      %-12s early=%s late=%s" % (k, json.dumps(v.get("early")),
                                                          json.dumps(v.get("late"))))
          fc = rep.get("format_census") or {}
          if fc:
              print("  FORMAT CENSUS       over %s READABLE leagues (F1 unchanged; this is "
                    "what the pool IS)" % fc.get("readable_leagues"))
              print("    teams             %s" % json.dumps(fc.get("teams")))
              print("    reception pts     %s" % json.dumps(fc.get("reception_points")))
              print("    superflex         %s" % json.dumps(fc.get("superflex")))
              print("    draft_type        %s" % json.dumps(fc.get("draft_type")))
              print("    keeper_type       %s" % json.dumps(fc.get("keeper_type")))
              # CARRIED, NEVER SCREENED, and printed with that on the line. F1 reads
              # six things and passing-TD value is not one of them, so no league here
              # was admitted or refused on it. `format_census` has computed this on
              # every run since it was built and no run has printed it — 385 readable
              # leagues in 2025, 266 in 2026, measured twice and shown zero times,
              # which is how a number nobody reads becomes a measurement nobody has.
              print("    passing TD pts    %s   [CARRIED, NOT SCREENED]"
                    % json.dumps(fc.get("pass_td_points")))
              print("      note            %s" % fc.get("pass_td_note"))
          ar = rep.get("adp_readiness") or {}
          print("  ADP READINESS       %s — %s" % (ar.get("state"), ar.get("why")))
          print("  OUTCOME-READY       %s leagues clear every check that can be judged "
                "before the season runs (matched=%s)"
                % (rep.get("outcome_ready"), rep.get("matched")))
          print("  attrition           %s" % json.dumps(rep.get("rejected_by_reason")))
          print("  VERDICT             %s" % rep.get("verdict"))
          PY
      - name: Report where it cannot be missed
        if: always()
        run: |
          {
            echo "## The ingest run"
            if [ -f ingest-report.json ]; then
              python3 - <<'PY'
          import json
          d = json.load(open("ingest-report.json"))
          print("**Verdict:** ", d.get("verdict"))
          print()
          r = d.get("season_readiness") or {}
          print("- readiness: **%s** — %s" % (r.get("state"), r.get("why")))
          print("- pool: %s" % ((d.get("pool") or {}).get("verdict")))
          print("- sample: %s" % ((d.get("sample") or {}).get("verdict")))
          print()
          print("| bucket | n |"); print("|---|---|")
          for k in ("examined", "matched", "rejected", "rejected_filtered",
                    "rejected_unreadable", "rejected_unclassified"):
              if k in d:
                  print("| %s | %s |" % (k, d[k]))
          print()
          print("| reason | n |"); print("|---|---|")
          for k, v in sorted((d.get("rejected_by_reason") or {}).items(),
                             key=lambda kv: -kv[1]):
              print("| `%s` | %s |" % (k, v))
          cw = d.get("crosswalk") or {}
          if cw:
              print()
              print("### The crosswalk at scale")
              print("- %s" % cw.get("verdict"))
              print("- pooled rate **%s** over %s picks; per-league %s"
                    % (cw.get("pooled_rate"), cw.get("picks_total"),
                       json.dumps(cw.get("rate_distribution"))))
              print("- methods: %s" % json.dumps(cw.get("methods")))
              pairs = cw.get("matched_pairs_for_hand_check") or []
              if pairs:
                  print()
                  print("| MFL name | MFL pos | board name | board pos | method |")
                  print("|---|---|---|---|---|")
                  for x in pairs[:20]:
                      print("| %s | %s | %s | %s | %s |"
                            % (x.get("mfl_name"), x.get("mfl_pos"),
                               x.get("board_name"), x.get("board_pos"), x.get("method")))
          o = d.get("outcomes") or {}
          if o:
              print()
              print("### F3 / D5")
              print("- scored %s of %s leagues; %s carry no coverage figure"
                    % (o.get("leagues_scored"), o.get("leagues_examined"),
                       o.get("leagues_with_no_coverage_figure")))
              print("- mean F3 coverage over SCORED leagues: %s"
                    % o.get("mean_f3_coverage_over_SCORED_leagues"))
              c = o.get("census") or {}
              print("- %s" % c.get("verdict"))
              if c.get("by_event_code"):
                  print()
                  print("| event code | leagues lost |"); print("|---|---|")
                  for k, v in (c["by_event_code"] or {}).items():
                      print("| `%s` | %s |" % (k, v))
          PY
            else
              echo "NO REPORT FILE — the run did not complete. That is a statement"
              echo "about this run, not a finding about the pool."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the census row (CAPTURE — the pool is not reconstructable later)
        run: |
          git config user.name "lab-bot"; git config user.email "actions@github.com"
          git add draft/data/format_census_series.json || true
          git diff --cached --quiet && { echo "no change"; exit 0; }
          # [skip deploy]: a data archive under draft/, which the deploy gate skips.
          git commit -m "C: format census row [skip deploy]"
          # RETRY THE RACE, for the reason this step's own name gives. MFL's
          # public pool is a moving population — leagues change scoring, change
          # size, are deleted and created — so a census row lost to a push race
          # is a lost observation, not a deferred one. This runs monthly, so a
          # dropped row is a twelfth of the series.
          for i in 1 2 3 4 5; do
            git fetch origin main
            # SAY WHAT GIT ACTUALLY SAID. This read "REBASE CONFLICT" for ANY
            # rebase failure — a workflow rehearsal hit it with a dirty tree and
            # was sent looking for a conflict that did not exist. A wrong
            # diagnosis at 11:20 UTC, on a day that cannot be refetched, costs
            # more than the extra three lines.
            if ! _out="$(git rebase origin/main 2>&1)"; then
              echo "REBASE FAILED — reporting, not forcing. git said:"
              echo "$_out" | sed 's/^/    /'
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
            if git push origin HEAD:main; then echo "census row pushed"; exit 0; fi
            echo "push race, retry $i"; sleep 3
          done
          echo "CENSUS ROW COULD NOT BE PUSHED after retries — this month's"
          echo "observation of the pool is lost and cannot be reconstructed."
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingest-report
          path: ingest-report.json
