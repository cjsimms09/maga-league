name: Own weekly projection (Thursday, before kickoff)

# OUR OWN weekly per-player number, committed BEFORE the week's first game.
#
# THE COMMITTED TIMESTAMP IS THE FORWARD GUARANTEE: a projection in git before
# Thursday kickoff carries no researcher degree of freedom — the same rule
# src/forecast_grade.js enforces on every other forecast in this repo. That is
# why this job COMMITS the snapshot rather than uploading an artifact, and why
# weekly_own_projection.py refuses to overwrite a snapshot once its week has
# kicked off.
#
# Thursday 14:00 UTC — two hours AFTER the odds capture (odds-capture.yml,
# Thu 12:00 UTC), so the freshest committed lines are on disk when this prices
# the tilt. Zero network in the pricing itself: every input is a committed
# file (board, odds snapshot, vegas store), so this can also be dry-run from
# anywhere.
#
# DRY RUN FIRST (the draft-night-sync.yml lesson: a workflow that has never
# fired is a workflow that does not work): dry_run=true writes the snapshot to
# $RUNNER_TEMP and commits nothing, so the mechanics get verified end-to-end.
# The same env-override path is unit-tested in
# draft/tests/test_weekly_own_projection.py, so the relay session can dispatch
# the real dry run after merge with the mechanics already proven.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Price for real but write to $RUNNER_TEMP and commit nothing'
        required: false
        default: false
        type: boolean
      week:
        description: 'NFL week override (blank = computed from the date; preseason is a clean skip)'
        required: false
  schedule:
    # ⚠️⚠️ TWO WEDNESDAY FIRINGS, AND THE EARLY ONE IS THE LOAD-BEARING ONE.
    #
    # MEASURED 2026-09-08 (A) from this workflow's own four scheduled runs:
    # GitHub fires it LATE, every time, and not by minutes.
    #
    #     scheduled            actually fired        delay
    #     2026-08-20 14:00Z    14:27:22Z             0h27
    #     2026-09-02 20:00Z    22:28:40Z             2h29
    #     2026-09-03 14:00Z    17:24:38Z             3h25
    #     2026-08-27 14:00Z    23:24:37Z             9h25
    #
    # Week 1's first game kicks off 2026-09-10T00:20Z, so a 20:00Z Wednesday
    # cron carries 4h20 of margin — and ONE OF THE FOUR OBSERVED DELAYS IS
    # 9h25, which would have fired at 05:24Z, FIVE HOURS AFTER KICKOFF.
    #
    # THAT FAILURE IS UNRECOVERABLE AND THIS SCRIPT ALREADY NAMES IT: past
    # kickoff with no snapshot on disk, weekly_own_projection.py prints
    # "MISSED: ... writing one now would be a hindsight number" and exits 1.
    # The forward guarantee IS the pre-kickoff timestamp; there is no second
    # chance at it, and the first grade is 09-15.
    #
    # 10:00Z absorbs the worst observed delay with five hours to spare. It
    # costs NOTHING in line freshness: odds-capture.yml runs Thu 12:00Z and
    # Sun 13:00Z, so there is no Wednesday capture and both Wednesday firings
    # price off the same Sunday lines. If the 20:00Z run also lands before
    # kickoff it simply overwrites with a fresher board, which is strictly
    # better; a re-run before kickoff is allowed by design and only becomes a
    # clean FROZEN no-op once the week has started.
    - cron: '0 10 * * 3'   # Wednesdays 10:00 UTC — the one that must not miss
    - cron: '0 20 * * 3'   # Wednesdays 20:00 UTC — refresh if it lands in time
    - cron: '0 14 * * 4'   # Thursdays 14:00 UTC, after the 12:00 odds capture; FROZEN (exit 0) once the week's first game has kicked off

permissions:
  contents: write

jobs:
  price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Price the week (champion + challenger arms)
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          WEEK: ${{ github.event.inputs.week }}
        run: |
          set -uo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            export OWN_WEEKLY_OUT_DIR="$RUNNER_TEMP/weekly-own-dry"
            echo "DRY RUN: writing to $OWN_WEEKLY_OUT_DIR, committing nothing."
          fi
          # Assignments live in the if-tests on purpose — bash -e kills a bare
          # failing assignment before its diagnostics print (the bug
          # draft-night-sync.yml's first live firing found).
          if [ -n "$WEEK" ]; then
            if OUT="$(python3 draft/weekly_own_projection.py --week "$WEEK" 2>&1)"; then
              echo "$OUT"
            else
              echo "$OUT"; exit 1
            fi
          else
            if OUT="$(python3 draft/weekly_own_projection.py 2>&1)"; then
              echo "$OUT"
            else
              echo "$OUT"; exit 1
            fi
          fi
      - name: Props second opinion on Cory's roster (report-only, register 476's tool)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          # Non-fatal by design: the snapshot above is the forward guarantee and
          # must commit even if THIS-WEEK.md is stale or the props file is absent.
          if OUT="$(python3 draft/tools/props_second_opinion.py 2>&1)"; then
            echo "$OUT"
          else
            echo "$OUT"; echo "::warning::second opinion did not run — the snapshot still commits"
          fi
      - name: Commit the snapshot (the forward guarantee)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          git config user.name lab-bot
          git config user.email lab-bot@users.noreply.github.com
          git add draft/data/weekly_own/
          if git diff --cached --quiet; then
            echo "no change (preseason skip or identical snapshot) — nothing to commit"
            exit 0
          fi
          # Two -m flags, never a multi-line block scalar: an unindented
          # continuation line inside a block scalar ends the block and
          # invalidates the ENTIRE workflow YAML (odds-capture.yml found this
          # the hard way this week).
          git commit -m "Own weekly projection $(date -u +%F) [skip deploy]" \
            -m "Committed BEFORE kickoff via own-weekly-proj.yml — the timestamp is the forward guarantee. Graded Tuesdays by own-weekly-grade.yml."
          # DURABLE PUSH (audit round 4: this workflow shipped with the exact
          # bare-push race draft-night-sync had just fixed — the anti-hindsight
          # guarantee IS the remote artifact, so an undurable snapshot is no
          # snapshot). Rebase-retry x5, then verify the pushed SHA is the
          # remote tip; anything less fails loudly with the orphan SHA.
          n=0; pushed=0
          until [ $n -ge 5 ]; do
            if git push -q; then pushed=1; break; fi
            n=$((n+1)); echo "push rejected (attempt $n) — rebasing and retrying"
            git pull --rebase -q || { git rebase --abort 2>/dev/null || true; }
            sleep $((n * 2))
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::PUSH FAILED — artifact NOT durable on the remote; orphan commit $(git rev-parse HEAD)"
            exit 1
          fi
          REMOTE=$(git ls-remote -q origin "$GITHUB_REF_NAME" | cut -f1)
          if [ "$(git rev-parse HEAD)" = "$REMOTE" ]; then
            echo "remote artifact verified: $(git rev-parse HEAD) is the remote tip"
          else
            echo "::error::remote verify failed — local $(git rev-parse HEAD) vs remote $REMOTE"
            exit 1
          fi
