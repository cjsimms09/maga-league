name: Weekly projection snapshot

# THE ONE INPUT WITH A REAL DEADLINE.
#
# A shadow strategy's choice is f(roster, projections). Sleeper returns the
# roster retroactively; providers OVERWRITE weekly projections in place, so the
# numbers a strategy would have read are gone the moment the week turns. That
# makes this snapshot the only thing that must run live — the shadow layer
# itself is recomputable in January and is deliberately not being built (17
# weeks cannot separate two strategies: paired MDE is 7.8 pts/wk at best).
#
# SUNDAY MORNING, BEFORE KICKOFF. The decision-time projection is the one a
# lineup would have been set from, not Tuesday's revision. 13:00 UTC is ~9am ET,
# ahead of the 1pm ET slate.
#
# Egress: Sleeper is denied at the gateway from the dev sandbox, so this runs in
# CI for the same reason every other probe does.
on:
  schedule:
    - cron: '0 13 * * 0'      # Sundays 13:00 UTC — before the 1pm ET slate
  workflow_dispatch:
    inputs:
      week:
        description: 'NFL week (blank = ask Sleeper /state/nfl)'
        required: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      # ⚙️ ADDED 2026-08-21 (A). This job COMMITS DATA and nothing verified it —
      # one of twelve such jobs, against a ratchet of eleven
      # (`test_every_gate_can_fail.py::test_scheduled_jobs_that_commit_data_do_not
      # _grow_more_unverified`, whose own note says "lower this in the commit that
      # earns it"). The ratchet went red, and the honest fix is to EARN the number
      # down rather than raise it.
      #
      # `test_weekly_proj_snapshot.py` already existed, already passed (11 checks),
      # and was simply never wired into the job whose output it describes — a guard
      # that exists and does not run, which is the most-repeated failure in this
      # project. It runs BEFORE the snapshot, so a broken snapshotter fails the job
      # instead of committing a bad artifact and being caught next week.
      - name: Verify the snapshotter before it writes anything
        run: |
          pip install --quiet -r draft/requirements.txt
          python -m pytest draft/tests/test_weekly_proj_snapshot.py -q
      - name: Snapshot this week's projections
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            python draft/weekly_proj_snapshot.py --week "${{ github.event.inputs.week }}"
          else
            python draft/weekly_proj_snapshot.py
          fi
      - name: Commit the snapshot
        run: |
          git config user.name lab-bot
          git config user.email lab-bot@users.noreply.github.com
          git add draft/data/proj_series.json
          # Nothing staged is a no-op (the week was already snapshotted), not a
          # failure — a red run here would train us to ignore the one job whose
          # whole value is that it ran.
          git diff --cached --quiet && echo "no change — already snapshotted" && exit 0
          git commit -m "weekly projection snapshot [skip deploy]"
          # PUSH WITH A REBASE-RETRY (relay, 09-02): a plain `git push` loses the race
          # whenever another job or a session lands on main first — weekly-grade lost
          # its 09-01 artifacts that way ("! [rejected] main -> main (fetch first)"),
          # the props census lost run 3 the same way. The artifacts are already
          # committed locally, so rebase onto main and try again; a real conflict
          # still fails loudly.
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; echo "::error::rebase failed"; exit 1; }
            if git push -q origin HEAD:main; then echo "pushed on try $i"; exit 0; fi
            sleep $((2**i))
          done
          echo "::error::could not push after 5 tries"; exit 1
