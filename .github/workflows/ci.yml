name: CI — tests and robot mock
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Lint workflow YAML (a broken workflow fails SILENTLY)
        # deploy-verify.yml sat unparseable for an unknown span — GitHub could
        # not read its triggers, so it created-and-instantly-failed every run
        # with zero jobs and nobody noticed. An unrunnable verifier is worse than
        # none: it looks present. This parses every workflow so the next such
        # break is a red build, not a silent hole in the deploy pipeline.
        run: |
          # setup-python's interpreter ships without PyYAML, so `import yaml`
          # below was raising ModuleNotFoundError and red-failing this step —
          # which SKIPPED every test job beneath it. The lint meant to catch a
          # silent hole in CI had quietly become one. Install the dep first.
          pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  d = yaml.safe_load(open(f))
                  # YAML parses the bare key `on:` as boolean True — accept either.
                  if not (isinstance(d, dict) and ('on' in d or True in d) and 'jobs' in d):
                      bad.append(f'{f}: missing on:/jobs:')
              except Exception as e:
                  bad.append(f'{f}: {type(e).__name__}: {str(e).splitlines()[0]}')
          if bad:
              print('UNPARSEABLE OR MALFORMED WORKFLOWS:')
              for b in bad: print('  ' + b)
              sys.exit(1)
          print('all workflow YAML parses')
          PY
      - name: Python deps
        run: pip install pytest
      - name: JS suites
        id: js
        # RUN ALL of them, then fail if any failed — do NOT `set -e` abort on the
        # first. The abort-on-first hid a truth: app-wiring failing here aborted the
        # step before Python suites / robot / shell guards ever ran, so the whole
        # suite read red-but-uninspected for days (the "reads as success" family). A
        # collected failure names every broken suite in one run instead of one-per-push.
        run: |
          failed=""
          for t in alerts app-wiring attribution authority backtest betlogic bundling_guard champs claimfix dashboard doctrine draft_banner draftorder engine grabby grade_cron h2h keeperlock keepers ledger marks matchup_spectator matchup_starters mcts mock_calib movement_line no_season_literals playoffs predledger prefs rawarchive reconcile rivalries season_form settlement shadows sidebets sidebets_lifecycle pool_draft stack_routes strategies sync update venmo voteenact watch_clickable week_hero matchup_placed_bet draft_sheet c3_lineup_disagree analyzer_surface inseason_design email_theme accuracy_wiring whatwatch; do
            echo "== $t =="
            if ! node draft/tests/$t.test.js; then failed="$failed $t"; fi
          done
          if [ -n "$failed" ]; then echo "FAILED SUITES:$failed"; exit 1; fi
          echo "all JS suites passed"
      - name: Server integration — prediction ledger over real HTTP
        # Needs express etc.; the pure suites above do not. Guards the JSON-body
        # parser: without it every fetch()-posted prediction 400s and draft
        # night's data is lost. Boots the real app, logs in, posts, reads back.
        run: |
          npm install --no-audit --no-fund
          node draft/tests/server-ledger.test.js
      - name: History smoke — the pages render logged-in, WITH content
        # "Renders locally, breaks in prod" is a known failure family here: the
        # History engine 500'd in the deployed function (data not bundled) and the
        # money board came back empty. Boots the app, logs in, asserts every
        # History page is 200 AND populated (money board shows real dollar totals).
        # Complements bundling_guard: the guard proves the files SHIP, this proves
        # the render POPULATES.
        run: node draft/tests/history_smoke.test.js
      - name: Chiefs-homer counter — the Bates reputation, audited (league-visible)
        # Locks the finding that refutes the running joke: Bates is the 3rd-biggest
        # Chiefs drafter in his own league, out-Chiefed by the two Germans. The
        # loyalty half is measured from real draft picks; the "overpay" half stays
        # explicitly UNMEASURED (no archived ADP) rather than fabricated.
        run: node draft/tests/chiefs_homer.test.js
      - name: Standings rank-movement — week-over-week arrows, dormant until week 2
        # Arrows are computed by subtracting the latest completed week from the
        # cumulative standings — no snapshot to drift. Asserts dormancy pre-season
        # and correct climbed/fell/held deltas once two weeks exist.
        run: node draft/tests/standings_movement.test.js
      - name: Matchup weekly-high panel — the $100 target renders (no dark slot)
        # The panel used to sit dark waiting on A's live band; it now serves the
        # harvested target on its own. Asserts it renders and that no per-owner
        # efficiency analysis leaks onto this league-visible page.
        run: node draft/tests/matchup_weekly_high.test.js
      - name: Route smoke — every surface renders (no 500 / template ReferenceError)
        # A view referencing a local the route forgot to pass renders fine in a
        # page-specific test but 500s in prod. This GETs the whole surface as the
        # commissioner (and commissioner-only routes as a member) and fails on any
        # 500 or template error. Caught /admin?tab=votes throwing `threshold`.
        run: node draft/tests/route_smoke.test.js
      - name: Bye guard — the per-player bye source zeroes a bye player before the solver
        # The 540-week sweep found the projection-driven solver would seat a bye player
        # (season-average hands him a full projection). Proves A's bye source activates B's
        # guard: inactive in the bye week, active otherwise, injury half intact, null-bye safe.
        run: node draft/tests/bye_guard.test.js
      - name: The Vault — trash + dispatch archives are actually read (de-orphaned)
        # Both archives stored permanently but no surface called archiveForSeason/
        # getArchive ("an archive nothing reads is the same as a deletion").
        # Asserts /history/vault/:year renders both, groups trash by week, and the
        # empty state is honest.
        run: node draft/tests/vault.test.js
      - name: Pick'em all-time freeze — completed seasons survive the rollover
        # The "never resets" all-time board silently dropped every completed season
        # (a new league id can't refetch a past season's points). Asserts frozen
        # points keep a prior season scored, and the old current-season-only
        # resolver zeroed it.
        run: node draft/tests/pickem_alltime_freeze.test.js
      - name: Vote → ledger sync — enacting a buy-in vote re-charges the tabs
        # Annual-audit money hole: enacting a passed buy-in vote raised the pot in
        # config but left every owner's tab (and the settlement) at the old buy-in.
        # Asserts the enact path now re-charges unpaid tabs to the new amount and
        # leaves already-settled tabs alone.
        run: node draft/tests/vote_ledger_sync.test.js
      - name: Model accuracy — the display half of the learning loop (reads A's grades)
        # Pure engine (buildAccuracyView never grades — it shapes A's calibration/
        # attribution output and degrades honestly before there's data) + the
        # commissioner-only HTTP surface: 403s a non-commissioner, shows the honest
        # empty state before grading, and populates from a written calibration doc.
        run: node draft/tests/accuracy.test.js
      - name: War-room mobile furniture — nothing fixed/sticky floats over content
        # After the pick bar floated mid-screen and the arm button covered the nav
        # (3rd report), the rule is: on a phone the war-room pinned strips drop to
        # normal document flow and the arm button is in-flow. Source guard so a
        # regression back to fixed/sticky-on-mobile fails here, not on a phone.
        run: node draft/tests/warroom_mobile.test.js
      - name: PWA entry point — "/" renders (never redirects) so the home-screen app launches
        # iOS standalone sits on the navy background_color splash forever if the
        # launch URL redirects. Asserts cold (unauthenticated) "/" returns a 200
        # login render, not a 302; the self-contained /standalone diagnostic
        # renders with no external deps; and authed "/" is the dashboard.
        run: node draft/tests/pwa_entry.test.js
      - name: Matchup spectator — opening someone else's game shows THAT pairing
        # The scoreboard deep link used to be viewer-relative (?opp=), so tapping
        # a game you weren't in reframed it as "you vs one of them." Asserts a
        # non-viewer pair (?a=&b=) renders a read-only spectator view (neutral
        # H2H, no bet, no trash post), the viewer's own game keeps the full
        # participant matchup, and a malformed pair doesn't crash.
        run: node draft/tests/matchup_spectator.test.js
      - name: Season form — payout structure is variable-length (not a fixed 2+4)
        # The admin season form was the only thing pinning payouts to 2 reg + 4
        # playoff; the data model always handled any length. Asserts a new season
        # can set 3+3, shrink to top-2, that legacy numbered fields still parse,
        # and that an empty-payout edit keeps the prior shape rather than wiping
        # it. Boots the real app and POSTs as the commissioner.
        run: node draft/tests/season_form.test.js
      - name: Access guard — analysis is commissioner-only, never league-visible
        # STANDING RULE (results = league property, analysis = commissioner's):
        # asserts /lineup + /lineup/log 403 a non-commissioner, and NO league-
        # visible page renders per-owner efficiency, all-play, luck-gap, robbery-
        # record, or season-bench-aggregate text. The three-season lineup
        # archaeology is the commissioner's edge; this keeps it from leaking back
        # in by a stray column, an open tab, or a chapter rewrite.
        run: node draft/tests/access_guard.test.js
      - name: Pick'em — pick every game, lock at kickoff, split + accuracy boards
        # Pure grading/aggregation (gameId stability, weekGames pairing, isLocked
        # by kickoff-or-score, scoreWeek, split, the eligibility-floored leaderboard
        # and its single worst seat) plus the HTTP surface over the real app:
        # picks save while unlocked, are REFUSED after kickoff, the split is hidden
        # pre-lock and public after, and a finished week grades into the boards.
        run: node draft/tests/pickem.test.js
      - name: The Dispatch — transient popups (awards / power poll / this-week-in-history)
        # Pure generation (mean voice, deterministic so the archive is stable),
        # the immutable archive + per-owner seen store, and the HTTP surface: the
        # popups render on the home page and a dismissal stays gone. Never sits on
        # a page once dismissed; always archived for the chronicle.
        run: node draft/tests/dispatch.test.js
      - name: Trash talk on matchups — posts welded to a game, permanent + archived
        # Pure engine (game-keyed like pick'em, per-post docs so concurrent
        # posters don't clobber, trim/cap/empty-reject, season archive) + the HTTP
        # round trip: a post redirects back to the game, renders attributed, and is
        # league-visible to both parties who then both add to the one thread.
        run: node draft/tests/trashtalk.test.js
      - name: Side-bet lifecycle over HTTP — declare→confirm→dispute + Venmo handoff
        # The two-party settling flow end to end: a result is declared, the OTHER
        # side confirms or disputes, a dispute is recorded not adjudicated, and the
        # loser gets the winner's Venmo link with the amount ready. Nothing settles
        # silently. Complements sidebets_lifecycle (the pure state machine).
        run: node draft/tests/sidebets_lifecycle_ui.test.js
      - name: Pool draft over HTTP — franchise snake draft + order-from-standings
        run: node draft/tests/pool_draft_ui.test.js
      - name: Pool advisor — commissioner-only portfolio advice
        run: node draft/tests/pool_advisor.test.js
      - name: Instrumentation check — in-season decision-time capture (exp 37)
        run: node draft/tests/instrumentation_check.test.js
      - name: Sunday alert — generator + secret-gated cron fire + commissioner send
        run: node draft/tests/sunday_alert.test.js
      - name: Lineup sanity sweep — legal/rosterable/no-bye advice over 2023-25
        # Runs the in-season optimizer over every real team-week and asserts it
        # can never emit an illegal, hallucinated, or on-bye/OUT lineup. The
        # first live Sunday must not be the first Sunday the tool has ever run.
        run: node draft/tests/lineup_sanity.test.js
      - name: Money scoreboard — banked $ + rank, unit + real-ledger sweep
        # The real scoreboard (dollars, not wins). Unit arithmetic plus a sweep
        # over every seeded season asserting pot conservation on real entries.
        run: node draft/tests/money_position.test.js
      - name: In-season display sweep — Sunday alert + what-to-watch over real weeks
        # Runs both weekly-read surfaces over hundreds of real 2023-25 states and
        # asserts nothing malformed reaches the screen (no NaN/undefined, no label
        # out of set, no probability out of [0,1], no hallucinated player).
        run: node draft/tests/in_season_sweep.test.js
      - name: Weekly posture — chase vs protect verdict
        run: node draft/tests/weekly_posture.test.js
      - name: Robot mock draft — the safety net
        # A full snake draft from every seat through the real engine and
        # attribution modules, plus every bug this session as a regression
        # scenario. Red here means the app is unsafe to ship unattended.
        # if: always() so a JS-suite failure can no longer skip the safety net.
        if: always()
        run: node draft/tests/robot-mock.js
      - name: Python suites
        id: py
        # if: always() — independent of the JS suites; a JS failure must not hide a
        # Python regression by skipping this step (the vacuous-CI failure, 2026-08-09).
        if: always()
        run: python -m pytest draft/tests -q

      - name: Shell guards — deploy gate + territory check + merge completeness
        # These enforce infra invariants and are easy to break silently: the deploy
        # gate's exit-code contract, the territory check's merge-awareness, and the
        # merge-completeness guard (a half-landed merge must fail loudly — 2026-08-09).
        # On a real merge commit (HEAD has 2 parents), assert every file the merged-in
        # branch changed is reflected in HEAD; skip cleanly for ordinary commits.
        if: always()
        run: |
          bash netlify-ignore.test.sh
          bash scripts/territory-check.test.sh
          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            mb=$(git merge-base HEAD^1 HEAD^2)
            echo "merge commit detected — checking completeness (base HEAD^1, source HEAD^2)"
            python draft/tools/merge_completeness.py "$mb" HEAD^1 HEAD^2 HEAD
          else
            echo "not a merge commit — merge-completeness check N/A"
          fi

      # A silently-SKIPPED step reads as success. This sentinel runs last, always,
      # and fails if any critical suite step did not actually run (skipped/cancelled)
      # — the guard Cory asked for against a step vanishing rather than failing.
      - name: Guard — every critical step actually ran (no silent skips)
        if: always()
        # Outcomes are success/failure/skipped/cancelled. A real failure is reported by
        # the step itself and reddens the run honestly. This sentinel catches the
        # INVISIBLE case Cory named: a critical step that was skipped/cancelled rather
        # than run at all — which would otherwise leave the run green-looking.
        run: |
          bad=0
          for pair in "JS:${{ steps.js.conclusion }}" "Python:${{ steps.py.conclusion }}"; do
            name="${pair%%:*}"; res="${pair##*:}"
            if [ "$res" = "skipped" ] || [ "$res" = "cancelled" ] || [ -z "$res" ]; then
              echo "SILENT SKIP: the $name suite did not run (conclusion='$res')"; bad=1
            else
              echo "ran: $name suite (conclusion='$res')"
            fi
          done
          [ "$bad" = "0" ] || { echo "a critical suite was skipped rather than run — failing loudly"; exit 1; }
