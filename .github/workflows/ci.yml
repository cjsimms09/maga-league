name: CI — tests and robot mock
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # ⚠️ fetch-depth: 0 IS NOT COSMETIC — TWO GUARDS DEPEND ON IT.
      #
      # actions/checkout@v4 defaults to fetch-depth: 1, so the runner had ONE
      # commit and no parents. That silently did two different kinds of damage,
      # both diagnosed 2026-08-17 from run 32059003700 and run 32055856888:
      #
      #   1. IT MADE main RED. test_core_needs_no_reviewer.py's NORMAL-path arm
      #      shells out to `independent_review.py --base HEAD~1 --head HEAD`.
      #      HEAD~1 does not resolve on a depth-1 clone, the reviewer refuses an
      #      empty diff and exits 1, and the assertion "an unavailable NORMAL
      #      review must stay non-blocking (exit 0)" went red. The test was
      #      RIGHT and the checkout was wrong: reproduced exactly by cloning
      #      this repo --depth 1 and running the same command, where the
      #      reviewer's own refusal text already names the cause ("or the
      #      checkout is shallow").
      #
      #   2. IT MADE A GUARD LIE — the worse half. The merge-completeness step
      #      below is gated on `git rev-parse -q --verify HEAD^2`. On a depth-1
      #      clone HEAD^2 never resolves, so on a REAL merge commit the step
      #      printed "not a merge commit — merge-completeness check N/A" and
      #      passed. Proven, not inferred: ac4b2253 on main has two parents, and
      #      its own run printed exactly that line. A half-landed merge could
      #      not have been caught by the check that exists to catch it — the
      #      "a check that cannot fail, reported as a check that passed" family.
      #
      # Do not remove this. tools/test_ci_checkout_depth.py fails if it goes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Lint workflow YAML (a broken workflow fails SILENTLY)
        # deploy-verify.yml sat unparseable for an unknown span — GitHub could
        # not read its triggers, so it created-and-instantly-failed every run
        # with zero jobs and nobody noticed. An unrunnable verifier is worse than
        # none: it looks present. This parses every workflow so the next such
        # break is a red build, not a silent hole in the deploy pipeline.
        run: |
          # setup-python's interpreter ships without PyYAML, so `import yaml`
          # below was raising ModuleNotFoundError and red-failing this step —
          # which SKIPPED every test job beneath it. The lint meant to catch a
          # silent hole in CI had quietly become one. Install the dep first.
          pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  d = yaml.safe_load(open(f))
                  # YAML parses the bare key `on:` as boolean True — accept either.
                  if not (isinstance(d, dict) and ('on' in d or True in d) and 'jobs' in d):
                      bad.append(f'{f}: missing on:/jobs:')
              except Exception as e:
                  bad.append(f'{f}: {type(e).__name__}: {str(e).splitlines()[0]}')
          if bad:
              print('UNPARSEABLE OR MALFORMED WORKFLOWS:')
              for b in bad: print('  ' + b)
              sys.exit(1)
          print('all workflow YAML parses')
          PY
      - name: Python deps
        # numpy + pandas: test_barbell_middle / test_tiered_outcome_model /
        # test_pbp_two_point import them at collection time, so without them
        # pytest aborts the WHOLE Python step at collection (exit 2, run
        # 32038354284) and every other Python suite silently goes unrun.
        #
        # 2026-08-18: install from draft/requirements.txt instead of a
        # hardcoded trio. The hardcoded list WAS the venv-gap class — the
        # fourth instance (run 32146131568: requests + lxml missing for the
        # census suites) was only reachable because this line and the
        # requirements file could drift apart. One source of truth now;
        # pytest is in the file.
        run: pip install -r draft/requirements.txt
      # ┌─────────────────────────────────────────────────────────────────────┐
      # │ SESSION A: READ BEFORE EDITING THIS BLOCK (B, 2026-08-10)            │
      # │ The npm-install-ordering bug is ALREADY FIXED here — deps install in │
      # │ this step, before the JS suites. Please don't write a second fix;    │
      # │ take this one at integration.                                        │
      # │ The suite loop below was ALSO converted from a hand-written list to  │
      # │ a glob, so editing that loop will conflict. Reason: 23 suites existed│
      # │ and ran in NO workflow (incl. `valuation`, the C1 shared-valuation   │
      # │ guard, plus `waivers`/`coherence`/`accounting`). See PARKED.md.      │
      # └─────────────────────────────────────────────────────────────────────┘
      - name: Node deps (BEFORE the JS suites)
        # The JS-suites step used to run with no node_modules, so any suite that
        # boots the real app (express) could only live in a later step. That
        # ordering trap is why app-booting tests drifted into separate steps and
        # then out of CI entirely. Install first; then every suite can run in the
        # one collected loop below.
        run: npm install --no-audit --no-fund
      - name: JS suites
        id: js
        # RUN ALL of them, then fail if any failed — do NOT `set -e` abort on the
        # first. The abort-on-first hid a truth: app-wiring failing here aborted the
        # step before Python suites / robot / shell guards ever ran, so the whole
        # suite read red-but-uninspected for days (the "reads as success" family). A
        # collected failure names every broken suite in one run instead of one-per-push.
        # AUDIT 2026-08-10 (B): 23 suites existed and were executed by NO workflow —
        # including `valuation` (the C1 one-shared-valuation guard), `waivers` (its
        # other half), `coherence`, and `accounting` (the money reconciler). Guards
        # that never run are the "looks like protection, isn't" class. A full local
        # sweep proved 22 of them green, so they are switched on here. The 23rd,
        # `intervention-rate`, is RED (the rate drifted 73.7% -> 90.8%) and is held
        # out deliberately: it is A's metric to adjudicate, and turning it on would
        # break the build on someone else's open decision rather than surface it.
        run: |
          failed=""
          # GLOB, don't enumerate. A hand-maintained list is how 23 suites ended
          # up existing but never running — the most-repeated failure in this
          # project, at the CI level. The Python side already globs
          # (`pytest draft/tests`), so a new python test is covered the day it
          # lands; JS now works the same way. Anything deliberately excluded must
          # be named in SKIP below, with a reason, so a silent hole is impossible.
          #   (empty) — intervention-rate was held out as RED while A adjudicated
          #   the drift. RESOLVED 2026-08-10: B's diagnosis was right that it was
          #   board-driven not weight-driven, so the fix was to stop measuring the
          #   board — it now runs against a FROZEN 300-player pool under the weights
          #   the tool actually ships (MEASURED, not DEFAULT), re-pinned to 84.2%.
          #   It is green and switched on. A skip list with nothing in it is the
          #   goal state, not an oversight.
          SKIP=""
          for f in draft/tests/*.test.js; do
            t=$(basename "$f" .test.js)
            case " $SKIP " in *" $t "*) echo "== $t (SKIPPED, see ci.yml) =="; continue;; esac
            echo "== $t =="
            if ! node draft/tests/$t.test.js; then failed="$failed $t"; fi
          done
          if [ -n "$failed" ]; then
            echo "FAILED SUITES:$failed"
            # ALSO to the step output, so the LAST step can restate it at job end.
            # See "Restate the JS failure" below for why the echo above is not enough.
            echo "failed=$failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "all JS suites passed"
      # ── 28 PER-SUITE STEPS DELETED HERE (2026-08-10) ──────────────────────────
      # Each was `node draft/tests/<x>.test.js` for a file the GLOB above already
      # runs, so every one of those suites executed TWICE per push. They were
      # left behind when the loop was converted from a hand-maintained list to a
      # glob; the glob made them redundant the moment it landed.
      #
      # They were also the mechanism of the silent-skip failure. None carried
      # `if: always()`, so a red step here aborted the job and SKIPPED every step
      # below it — which is how a run once reported green with 28 steps skipped,
      # and how the "every critical step actually ran" sentinel below could pass
      # while most of the job never executed. Deleting them removes the cascade
      # structurally rather than guarding against it.
      #
      # THE WALL-CLOCK CLAIM WAS MINE AND IT WAS WRONG. I predicted this would
      # halve CI time. Measured: 129s without the duplicates vs 130s on the run
      # immediately before with them, against 164s and 176s on the two runs before
      # that. The spread among runs that ALL carried the duplicates (130-176s) is
      # far wider than the difference the deletion made, so the saving is not
      # established and n=1 could not establish it anyway. The suites are
      # individually fast; the cost was never where I assumed.
      #
      # The deletion still stands on the reason that survives measurement: the
      # cascade is gone and the redundancy is gone. Speed was a guess presented as
      # a benefit, which is the thing this project keeps trying not to do.
      #
      # DO NOT RE-ADD A PER-SUITE STEP. A new `draft/tests/*.test.js` is picked up
      # by the glob the day it lands. Anything that must NOT run belongs in SKIP
      # above, named, with a reason.
      - name: Robot mock draft — the safety net
        # A full snake draft from every seat through the real engine and
        # attribution modules, plus every bug this session as a regression
        # scenario. Red here means the app is unsafe to ship unattended.
        # if: always() so a JS-suite failure can no longer skip the safety net.
        if: always()
        run: node draft/tests/robot-mock.js
      - name: Python suites
        id: py
        # if: always() — independent of the JS suites; a JS failure must not hide a
        # Python regression by skipping this step (the vacuous-CI failure, 2026-08-09).
        if: always()
        # `tools` IS LISTED SEPARATELY, and the reason is a guard firing.
        # tools/test_reviewer_schema_strict.py was written into draft/tests/ and
        # test_core_needs_no_reviewer went red — correctly: draft/** is the
        # product tree and that file imports the reviewer. The guard allows one
        # excluded file per tree, so exempting a second would widen exactly what
        # its CONTROL says cannot widen. The file moved instead; this keeps it
        # running every build rather than only when the reviewer is invoked.
        # `-m "not repo_parity"` ADDED 2026-08-17 (A's ruling on the relay's
        # routed item). The marked nodes are red-by-design against live state
        # — the ADP-sd ratchet awaiting Cory's rate decision, the freeze
        # staleness alarm before a re-take — so with them in THIS step main's
        # CI was permanently red, and a permanently red gate confirms
        # nothing: B's matchup_placed_bet/trashtalk failures sat unnoticed
        # for fifteen hours inside the standing red. The pins still run, in
        # the next step, where their red is VISIBLE but cannot repaint the
        # whole run. The marked set is pinned to an explicit node list by
        # test_gate_selection.py, so this exclusion cannot silently widen.
        run: python -m pytest draft/tests tools -q -m "not repo_parity"

      - name: Standing state alarms — repo_parity pins, allowed red, never silent
        # These fire when repo/market STATE is new or old, never because a
        # commit is bad. continue-on-error keeps them from repainting main
        # red; the log keeps them visible; the silent-skip guard below
        # verifies this step RAN.
        id: parity_pins
        if: always()
        continue-on-error: true
        run: python -m pytest draft/tests -q -m "repo_parity"

      - name: Baseline regression — live engine vs the FROZEN measured core
        # EVERY RUN, NO FILE FILTER, by explicit instruction. This week's
        # corruptions arrived through a display predicate, a merge that dropped
        # edits, a null coercion inside a materiality gate, and a valuation
        # re-implemented in a route file — no reasonable file-based filter would
        # have caught any of them, and the classification step is where the miss
        # happens. Canonical states through a pure function; it costs seconds.
        #
        # A FAILURE MEANS RECOMMENDATION BEHAVIOUR CHANGED. Either a bug caught the
        # moment it landed, or a deliberate improvement — and binding rule 6 says
        # there is no third state where the reference quietly follows the code. A
        # deliberate change freezes a NEW version and says why; the old one stays.
        if: always()
        run: node draft/tests/baseline_regression.test.js

      - name: Graduation gate — loaded policy vs measured verdict
        # THE TWO-PLACES DISEASE, closed for policy values. The ceiling weight sat
        # at 0.65 in the loaded core for weeks after the ledger measured it at
        # -4.8, and nothing failed. This compares what engine.js ACTUALLY LOADS
        # against what the experiments ACTUALLY MEASURED and exits non-zero on any
        # UNDOCUMENTED disagreement.
        #
        # It PROPOSES, it never flips: a row is cleared either by changing the
        # loaded value or by recording the human decision in DECISIONS-NEEDED.md /
        # EDGE-LEDGER.md. "Cory looked and chose otherwise" is a legitimate
        # resolution; silence is not.
        if: always()
        run: python3 draft/backtest/graduation_gate.py

      - name: Shell guards — deploy gate + territory check + merge completeness
        # These enforce infra invariants and are easy to break silently: the deploy
        # gate's exit-code contract, the territory check's merge-awareness, and the
        # merge-completeness guard (a half-landed merge must fail loudly — 2026-08-09).
        # On a real merge commit (HEAD has 2 parents), assert every file the merged-in
        # branch changed is reflected in HEAD; skip cleanly for ordinary commits.
        if: always()
        run: |
          bash netlify-ignore.test.sh
          bash scripts/territory-check.test.sh
          bash scripts/integrate_staleness.test.sh
          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            mb=$(git merge-base HEAD^1 HEAD^2)
            echo "merge commit detected — checking completeness (base HEAD^1, source HEAD^2)"
            python draft/tools/merge_completeness.py "$mb" HEAD^1 HEAD^2 HEAD
          else
            echo "not a merge commit — merge-completeness check N/A"
          fi

      # A silently-SKIPPED step reads as success. This sentinel runs last, always,
      # and fails if any critical suite step did not actually run (skipped/cancelled)
      # — the guard Cory asked for against a step vanishing rather than failing.
      - name: Register rechecks — a finding nobody acted on turns this RED
        # Cory, 2026-08-17: "I feel like we are still make tons of findings but
        # no one is following up or acting on any of them.. that needs to change."
        #
        # He is right, and the relay was the biggest contributor — it filed six
        # register rows and nine queue items in one evening and acted on almost
        # none of them. The register ALREADY carried the right field: every row
        # has an owner and a "recheck MM-DD". Nothing read them. A recheck date
        # that no build enforces is indistinguishable from a row nobody intends
        # to look at again.
        #
        # Same mechanism this repo already trusts for commitments — a date, and
        # a check that fires when it passes — pointed at DEFECT-REGISTER.md. One
        # check covers every finding ever filed, including the ones not written
        # yet. It fails on exactly one thing: a row still OPEN after the date its
        # own author promised to look again. Changing the date and saying why is
        # a legitimate way to clear it. Silence is not.
        if: always()
        run: node draft/tools/register_recheck_check.js

      - name: Board freshness — a board older than its own inputs turns this RED
        # Register 35. The board publishes without its upstream inputs and
        # NOTHING triggers the rebuild. Twice on 2026-08-18: A's keeper-vorp fix
        # landed 073aadfc at 03:20:28Z against a board built 02:03:30Z, resolved
        # only because an unrelated rebuild happened to fire at 03:49; then the
        # calibration table was regenerated f6acbe76 at 03:59:04Z against that
        # 03:49:25Z board — 9m39s stale — by a commit whose own message says it
        # "moves every proj_ceiling/proj_floor/proj_sd on the board."
        #
        # The row asks for exactly one thing: "fail a parity check that NAMES the
        # stale artifact." That check already existed and was already tested —
        # board_input_staleness.test.js, 14 checks including a control proving it
        # discriminates rather than always firing. **Nothing ran it against the
        # LIVE board.** The suite proved the tool works; no step asked the tool
        # anything. That is the same gap register 28 named in a different place:
        # a guard that is written but not wired.
        #
        # It exits 0 on today's board (built 05:33:24Z, every declared input
        # older), so wiring it changes nothing until it is right to change
        # something. When it does fire it prints WHICH input is newer and by how
        # long, which is the "names the stale artifact" half of the ask.
        if: always()
        run: node draft/tools/board_input_staleness.js

      - name: Predictions — graded by their own date, and the grade must CHANGE something
        # Cory, 2026-08-18: "Still don't think we are making predictions, grading
        # and closing the loop. No one is in charge of it.."
        #
        # He was right about the ownership. Preregistrations were being written and
        # some were graded, but nothing connected the two or noticed when a grade
        # never arrived. PREDICTION-LEDGER.md gives every prediction an owner and a
        # grade-by date; this check is what makes those cost something.
        #
        # It fails on TWO things, and the second is the one that matters:
        #   1. a row past its grade-by date still OPEN — nobody came back for it;
        #   2. a row marked GRADED whose "what changed" cell is EMPTY. Cory,
        #      08-17: "a grade that moved nothing." A measurement with no
        #      consequence is a note, not a closed loop. "NOTHING — <reason>" is a
        #      real answer and passes; silence does not.
        #
        # It does NOT judge whether the prediction was good or the consequence
        # right — both are human calls. It enforces only that the loop closed.
        if: always()
        run: |
          node draft/tests/prediction_ledger_check.test.js
          node draft/tools/prediction_ledger_check.js

      - name: Breadth — are we casting a wide enough net, or turning the same two knobs
        # Cory, 2026-08-18: "Making sure we're casting a wide enough net to try
        # as many things as we can."
        #
        # THE STEP ABOVE CANNOT SEE THIS FAILURE. It enforces that predictions
        # get graded and that a grade names a successor — both of which stay
        # green while the search is narrow. P28 graded TRUE: the live arm set is
        # five rows varying exactly two knobs (tilt_scale, divisor), both on the
        # Vegas axis. You can grade those five every Tuesday for eighteen weeks,
        # promote a champion every time, and never test a signal you were not
        # already using. The projector's own docstring says so — "the mechanical
        # loop only selects among the arms it is given" — and nothing enforced it.
        #
        # So this reads DEFAULT_ARMS out of the projector and classifies each
        # signal axis LIVE / GRADED / NONE. A one-off graded study is NOT
        # breadth: pace_arm and advanced_efficiency both carry real verdicts and
        # neither runs again, which is how a programme feels wide while the loop
        # stays narrow. Today: 1 of 8 axes LIVE.
        #
        # It fails on a DEADLINE, not a floor — a floor is satisfied the day it
        # is written and never again. The dates come from BLEND-SEARCH-DESIGN.md's
        # own sequence table; when one passes with no live arm, this goes red and
        # names the axis. Moving a date is fine, in a commit that says why.
        if: always()
        run: |
          node draft/tests/projection_breadth.test.js
          node draft/tools/projection_breadth.js

      - name: Weight drift — prose that quotes a weight the engine does not carry
        # REGISTER 5h, MADE MECHANICAL. One mechanism, EIGHT instances in two
        # days: Cory rules a weight, it ships, and the prose quoting the old
        # number never moves. CLAUDE.md, A-DRAFT-DAY-DECISIONS C2, three
        # DECISIONS entries, league_config.json — inside a CONFIG file, which
        # reads as authority — and twice in DRAFT-WEEK-BRIEF.md, the file
        # CLAUDE.md tells every session to read FIRST.
        #
        # Every one was found by a human tripping over it while looking for
        # something else. Four of the last five surfaced as side-effects of
        # unrelated searches. That is what a class looks like when nothing
        # sweeps for it. The cost is not tidiness: a stale doc contradicting
        # shipped code MANUFACTURES FALSE FINDINGS — the live 0.45 was nearly
        # filed as a defect against the documentation.
        #
        # ⚠️ THE FIRST PROTOTYPE FLAGGED 18 AND HALF WERE CORRECT SENTENCES. A
        # quoted old value is only wrong when the sentence asserts it is
        # CURRENT, and three kinds of quote are legitimate forever: a frozen
        # artifact (baseline/v1.json really does carry ceiling 0 — that is
        # register 5g and it is true), a historical experiment result, and a
        # RECORD of a past state. So this reads only files that assert current
        # state — the register and the ledger are excluded BY DESIGN — and the
        # three known-legitimate quotes are allowlisted WITH REASONS, which is
        # a claim in writing rather than a mute button.
        if: always()
        run: |
          node draft/tests/weight_claim_sweep.test.js
          node draft/tools/weight_claim_sweep.js --control
          node draft/tools/weight_claim_sweep.js

      - name: Commitments — a date, and a check that FIRES if the date passes
        # PART THREE'S CLOSURE CONDITION, made mechanical. Every row in
        # draft/data/commitments.json carries a due date AND a verification that
        # reads repository state — not a status field somebody can edit. A row
        # that is unmet after its date fails this step.
        #
        # WHY IT IS A GATE AND NOT A REPORTER. standing_check.py exits 0 always,
        # by design: it watches accumulating archives and escalates through a
        # marker. This is the opposite case. A commitment that slips silently is
        # indistinguishable from one that was never made, and this repo has now
        # produced that failure four times — the January reconstruction, the
        # enforcement table's empty cells, a grading cron that existed and never
        # ran, and a staleness bar that could not fire inside the window it
        # protected. CANNOT DETERMINE counts as unmet, always.
        # The gate's own test runs first (relay's 08-18 ask, wired by A): the
        # test has SEEN the gate refuse — 6 of its 9 checks are fail arms
        # running the real script as a subprocess. A gate nothing has watched
        # fail is the vacuous shape this whole block exists to end.
        if: always()
        run: |
          node draft/tests/commitments_check.test.js
          node draft/tools/commitments_check.js

      - name: Lane status — work that exists but main cannot see (REPORT ONLY)
        # E built this after b26e1713 sat stranded 16h with a league-facing
        # banner on it, and asked A to wire it (ROUTES 08-17; wired 08-18).
        # REPORTS ONLY, by design: never merges, never deletes, never fails
        # the build — `|| true` keeps even a tool crash from failing CI,
        # because a visibility aid that can redden main becomes a thing
        # people delete. It prints one line per unmerged branch and a ⚠️
        # when one looks stranded (3+ commits, 12h+ old). fetch-depth: 0 is
        # already set for the checkout, so remote branches are visible.
        if: always()
        run: git fetch --all --quiet && node draft/tools/lane_status.js || true

      - name: Guard — every critical step actually ran (no silent skips)
        if: always()
        # Outcomes are success/failure/skipped/cancelled. A real failure is reported by
        # the step itself and reddens the run honestly. This sentinel catches the
        # INVISIBLE case Cory named: a critical step that was skipped/cancelled rather
        # than run at all — which would otherwise leave the run green-looking.
        run: |
          bad=0
          for pair in "JS:${{ steps.js.conclusion }}" "Python:${{ steps.py.conclusion }}" "ParityPins:${{ steps.parity_pins.conclusion }}"; do
            name="${pair%%:*}"; res="${pair##*:}"
            if [ "$res" = "skipped" ] || [ "$res" = "cancelled" ] || [ -z "$res" ]; then
              echo "SILENT SKIP: the $name suite did not run (conclusion='$res')"; bad=1
            else
              echo "ran: $name suite (conclusion='$res')"
            fi
          done
          [ "$bad" = "0" ] || { echo "a critical suite was skipped rather than run — failing loudly"; exit 1; }

      - name: Restate the JS failure where the log tail can actually see it
        # WHY THIS EXISTS, AND IT IS NOT COSMETIC. CI has been red on the JS step for
        # 120+ consecutive runs and NOBODY HAS EVER READ WHY. Every route out of a
        # sandbox returns the last 5,000 characters of the JOB: the REST job-logs
        # endpoint truncates to exactly that, the full-log ZIP 302s to
        # productionresultssa*.blob.core.windows.net which agent proxies 403 on
        # CONNECT, and run artifacts are total_count 0. The JS loop finishes ~2
        # minutes before the job does, so `FAILED SUITES:` is always ABOVE the
        # window. The check-run annotation carries only "Process completed with exit
        # code 1" and an empty raw_details.
        #
        # So the failure is restated HERE, as the final step, inside the tail that is
        # readable — plus a bounded replay of each failing suite's own output.
        # Diagnostic only: it changes no pass/fail semantics, and `if: failure()`
        # means it costs nothing on a green run.
        if: failure() && steps.js.outputs.failed != ''
        run: |
          echo "FAILED SUITES (restated at job end):${{ steps.js.outputs.failed }}"
          for t in ${{ steps.js.outputs.failed }}; do
            echo "───────── $t ─────────"
            node draft/tests/$t.test.js 2>&1 | tail -40 || true
          done
