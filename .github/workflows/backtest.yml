name: Historical backtest
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Comma-separated seasons (blank = all replayable)"
        required: false
        default: ""
      commit:
        description: "Commit the report back"
        required: false
        default: "true"
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the report commit-back needs it; its absence is
                             # why runs 5 and 6 generated the report and could
                             # not push it. The other committing workflows have
                             # had this all along.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install
        run: pip install -r draft/requirements.txt
      # Ship condition 4. Runs here and not in the agent sandbox because it
      # needs FFC's historical `year` endpoint and Sleeper, both of which that
      # sandbox's egress policy refuses at CONNECT.
      - name: Assemble era-appropriate bundles
        run: python draft/backtest/cli.py --seasons "${{ inputs.seasons }}" --out draft/backtest/bundles.json
      - name: Replay and report
        run: |
          node draft/backtest/run.js \
            --in draft/backtest/bundles.json \
            --out draft/backtest/results.json \
            --report draft/backtest/BACKTEST.md
      - name: Strategy table and perturbation gate
        run: |
          node draft/backtest/run-strategies.js \
            --in draft/backtest/bundles.json \
            --out draft/backtest/STRATEGY.md \
            --json draft/backtest/strategy-results.json
      - name: Commit the report
        if: ${{ inputs.commit != 'false' }}
        run: |
          git config user.name Claude
          git config user.email noreply@anthropic.com
          # The bundles carry the whole player universe and are large; the
          # report and the aggregates are the deliverable.
          git add draft/backtest/BACKTEST.md draft/backtest/results.json \
            draft/backtest/STRATEGY.md draft/backtest/strategy-results.json || true
          git diff --cached --quiet && { echo "no report changes to commit"; exit 0; }
          git commit -m "Backtest + strategy table against real prior drafts"
          # Rebase onto whatever landed while CI ran, then push. Do NOT swallow a
          # failed push with '|| true' — a lost report is a fail-silently bug, and
          # this whole project treats those as the disease. Retry the race a few
          # times; surface a real failure loudly.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { echo "REBASE CONFLICT — reporting, not forcing"; exit 1; }
            if git push origin HEAD:main; then echo "report pushed"; exit 0; fi
            echo "push race, retry $i"; sleep 3
          done
          echo "REPORT COULD NOT BE PUSHED after retries"; exit 1
