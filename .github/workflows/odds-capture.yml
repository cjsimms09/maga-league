name: Odds capture (The Odds API, budget-aware)

# CURRENT NFL LINES -> committed snapshots, per Cory's 2026-08-16 direction
# (key supplied and verified as ODDS_API_KEY by config-check; historical data
# stays un-bought per the measured +0.23 ceiling — this captures only what the
# free tier gives us going forward).
#
# BUDGET: each run costs 3 credits of the 500/month free tier (3 markets x 1
# region). The schedule below is ~26 credits/month; every snapshot records the
# API's own remaining-credit header so drift is visible in the artifact.
#
# DRY RUN FIRST, the draft-night-sync.yml lesson: a workflow that has never
# actually fired is a workflow that does not work. dry_run fetches for real
# but writes to a throwaway path and commits nothing, so the mechanics get
# verified end-to-end without touching draft/data/odds/.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch for real but commit nothing (verifies mechanics + shows credit balance)'
        required: false
        default: false
        type: boolean
  schedule:
    # Thursday + Sunday mornings UTC, in and out of season — off-season runs
    # return few/no games and still cost 3 credits, which the budget absorbs;
    # the alternative (a human remembering to re-enable in September) is the
    # kind of manual step this repo converts into mechanisms.
    - cron: '0 12 * * 4'
    - cron: '0 13 * * 0'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and snapshot (either provider succeeding is a success)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORTSGAME_ODDS_API: ${{ secrets.SPORTSGAME_ODDS_API }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -uo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            export ODDS_OUT_DIR="$RUNNER_TEMP/odds-dry"
            echo "DRY RUN: writing to $ODDS_OUT_DIR, committing nothing."
          fi
          ok=0
          # SportsGameOdds first — the key the 2026-08-16 probe proved live
          # (200). The Odds API arm stays wired for the day a real key lands
          # under ODDS_API_KEY (the stored one 401s at every provider).
          # Assignments live in the if-tests on purpose — bash -e kills a
          # bare failing assignment before its diagnostics print (the real
          # bug draft-night-sync.yml's first live firing found).
          if OUT="$(python3 draft/tools/fetch_sgo.py 2>&1)"; then
            echo "$OUT"; ok=1
          else
            echo "$OUT"
            echo "sportsgameodds fetch failed — continuing to the next provider"
          fi
          if OUT="$(python3 draft/tools/fetch_odds.py 2>&1)"; then
            echo "$OUT"; ok=1
          else
            echo "$OUT"
            echo "the-odds-api fetch failed (expected until a valid ODDS_API_KEY exists)"
          fi
          if [ "$ok" = "0" ]; then
            echo "BOTH providers failed — no snapshot written, nothing committed"
            exit 1
          fi
      - name: Commit the snapshot
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          git config user.name lab-bot
          git config user.email lab-bot@users.noreply.github.com
          git add draft/data/odds/
          if git diff --cached --quiet; then
            echo "no change (identical snapshot) — nothing to commit"
            exit 0
          fi
          # Two -m flags, not a multi-line string: an unindented continuation
          # line inside this block scalar ends the block and invalidates the
          # ENTIRE workflow YAML — GitHub registers the file but can't parse
          # it, so workflow_dispatch 422s. The dry-run discipline caught this
          # before the first scheduled firing silently never happened.
          git commit -m "Odds snapshot $(date -u +%F) [skip deploy]" \
            -m "Automated capture via odds-capture.yml (3 credits; balance in the snapshot's provenance)."
          git push
