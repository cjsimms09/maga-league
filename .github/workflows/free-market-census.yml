name: FREE MARKET CENSUS — is there a 2026 in-season market source we can read for nothing?

# Cory, 2026-08-18: "Do deep search for 2026 days for free" and, on the arms he wants
# tried, "Vegas, Kalshi, pace of play, any other metrics we can get should be tried."
#
# THE QUESTION IS NARROW AND IT HAS A DEADLINE. The Odds API credits expire ~08-31 and
# its historical endpoint cannot serve 2026 in-season prices — week 1 opens 09-10, after
# the credits are gone. So every market arm D is being asked to build in-season needs a
# source that is free and LIVE, or it needs to not be proposed.
#
# `prior_art.py --grep kalshi` returns nothing, so this is not a re-run. The two "market"
# hits in the repo are draft-strategy studies, not data sources.
#
# ── WHAT THIS ANSWERS, AND WHAT IT DELIBERATELY DOES NOT ──────────────────────
#
# It answers: which free endpoints RESPOND, and do their payloads contain anything at
# player or team granularity that could become an implied number. It does NOT decide
# whether that signal predicts anything — that is an arm, it goes through
# BLEND-SEARCH-DESIGN, and it gets a preregistered grade. Reachability first; the
# ceiling-source probe on 08-18 spent its whole budget proving six endpoints exist and
# carry no ceiling, which is exactly the right order.
#
# ── THE CONTROL IS THE LOAD-BEARING PART ─────────────────────────────────────
#
# A run where every host is blocked looks identical to a run where no source exists.
# `sleeper_control` is an endpoint this repo has fetched successfully many times, so if
# it fails the verdict is "THIS RUN'S EGRESS IS BROKEN" and not "there is nothing out
# there." Without it a network hiccup would be recorded as a finding.
#
# COSTS NOTHING. Public read-only GETs. No key is sent to any host except the two that
# already hold ours, and no key is ever printed.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Probe every free market surface
        env:
          K_ODDS: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error
          from datetime import datetime, timezone

          UA = {"User-Agent": "maga-league-research/1.0"}

          def get(url, headers=None, cap=8_000_000):
              h = dict(UA); h.update(headers or {})
              req = urllib.request.Request(url, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read(cap).decode("utf-8", "ignore")
              except urllib.error.HTTPError as e:
                  return e.code, e.read(2000).decode("utf-8", "ignore")
              except Exception as e:
                  return 0, f"{type(e).__name__}"

          # (id, url, needs_key) — Kalshi's public read endpoints need no auth.
          KALSHI = "https://api.elections.kalshi.com/trade-api/v2"
          ODDS = "https://api.the-odds-api.com/v4/sports/americanfootball_nfl"

          # ── V2, AFTER V1 PRODUCED A FALSE POSITIVE I ALMOST REPORTED ──────────
          #
          # V1 flagged "player-level content" in two Kalshi endpoints. Both were wrong:
          # the match was the LEGAL BOILERPLATE every Kalshi series carries — "Current
          # and former players, coaches, and staff of the league..." — and the second
          # endpoint had no NFL filter at all, so it returned KXELONMARS. A regex over
          # 200KB of raw JSON cannot tell a market from a prohibitions clause.
          #
          # So v2 stops reading prose and reads the PRODUCT: series tickers and market
          # titles, parsed out of the JSON, which is what actually names what is
          # tradeable. And it fixes the Odds API call, whose 422 said "Markets not
          # supported by this endpoint" — player props live on the per-EVENT odds
          # route, not the league route, so v1 asked the wrong URL and would have
          # recorded a capability we have as an absence.
          TARGETS = [
            ("sleeper_control", "https://api.sleeper.app/v1/state/nfl", False),
            ("kalshi_series_sports", f"{KALSHI}/series?category=Sports", False),
            ("oddsapi_nfl_events",   f"{ODDS}/events?apiKey=KEY", True),
          ]
          key = os.environ.get("K_ODDS") or ""
          rows, payload = [], {}
          for name, url, needs in TARGETS:
              if needs and not key:
                  rows.append({"id": name, "status": None, "note": "no ODDS_API_KEY in secrets"})
                  continue
              code, body = get(url.replace("KEY", key) if needs else url)
              safe = body.replace(key, "<KEY>") if key else body
              payload[name] = safe
              rows.append({"id": name, "status": code, "bytes": len(safe)})
              print(f"  {name:24s} -> {code}  {len(safe)}B")

          # A PARSE FAILURE MUST NEVER READ AS AN ABSENCE, and v2 proved why: the
          # 200KB read cap truncated Kalshi's series payload to 199,744 bytes,
          # json.loads failed, `doc` was None, the NFL loop never ran, and the
          # verdict printed "NO OPEN NFL MARKETS FOUND ON KALSHI" — a confident
          # negative produced by a check that could not have found anything.
          # Now it is recorded and it changes the verdict.
          parse_errors = {}
          def as_json(name):
              raw = payload.get(name)
              if raw is None:
                  return None
              try:
                  return json.loads(raw)
              except Exception as e:
                  parse_errors[name] = f"{type(e).__name__} at {len(raw)}B"
                  return None

          # ── KALSHI: which SERIES exist, by ticker and title, for the NFL? ────────
          nfl_series, nfl_markets, kalshi_note = [], [], ""
          doc = as_json("kalshi_series_sports")
          if doc:
              for s in (doc.get("series") or []):
                  tick, title = s.get("ticker") or "", s.get("title") or ""
                  if re.search(r"nfl|football", (tick + " " + title), re.I):
                      nfl_series.append({"ticker": tick, "title": title})
              # TWO INDEPENDENT PATHS, AND THEY CHECK EACH OTHER — because this probe
              # has now produced FOUR false negatives in a row, each from a different
              # bug of mine, and each one looked like a clean answer.
              #
              #   v1  matched legal boilerplate and reported player markets that were
              #       a prohibitions clause.
              #   v2  hit a 200KB read cap, failed to parse, and printed an absence.
              #   v3  read 12 of 390 series and called a 3% sample a census, while its
              #       own printed samples contradicted the verdict.
              #   v4  replaced v3's WORKING per-series query with pagination filtered on
              #       `series_ticker`, a field the markets list does not carry, so it
              #       matched nothing — an optimisation that broke a correct query.
              #
              # So: path A is v3's per-series query, which demonstrably returned 228
              # markets, now run over ALL series rather than the first twelve. Path B
              # derives the series from the market ticker's own prefix, which depends on
              # no field existing. If the two disagree the artifact SAYS SO instead of
              # quietly preferring one.
              seen = {}
              for s in nfl_series:
                  code, b = get(f"{KALSHI}/markets?status=open&limit=200&series_ticker={s['ticker']}")
                  if code != 200:
                      continue
                  try: d2 = json.loads(b)
                  except Exception: continue
                  for m in (d2.get("markets") or []):
                      seen[m.get("ticker")] = {"series": s["ticker"], "ticker": m.get("ticker"),
                                               "title": m.get("title") or m.get("subtitle") or ""}
              path_a = len(seen)

              # Path B: one paginated sweep, series taken from the ticker prefix.
              nfl_tickers = {s["ticker"] for s in nfl_series}
              cursor, pages, path_b = None, 0, 0
              while pages < 20:
                  u = f"{KALSHI}/markets?status=open&limit=1000" + (f"&cursor={cursor}" if cursor else "")
                  code, b = get(u)
                  if code != 200:
                      break
                  try: d2 = json.loads(b)
                  except Exception as e:
                      parse_errors["kalshi_markets_page"] = f"{type(e).__name__} at {len(b)}B"
                      break
                  batch = d2.get("markets") or []
                  for m in batch:
                      tick = m.get("ticker") or ""
                      if tick.split("-")[0] in nfl_tickers:
                          path_b += 1
                          seen.setdefault(tick, {"series": tick.split("-")[0], "ticker": tick,
                                                 "title": m.get("title") or m.get("subtitle") or ""})
                  cursor = d2.get("cursor") or ""
                  pages += 1
                  if not cursor or not batch:
                      break

              nfl_markets = list(seen.values())
              agree = (path_a > 0 and path_b > 0)
              kalshi_note = (f"{len(nfl_series)} NFL series; per-series path found {path_a}, "
                             f"ticker-prefix path found {path_b} across {pages} pages, "
                             f"{len(nfl_markets)} distinct."
                             + ("" if agree else "  ⚠️ ONE PATH FOUND NOTHING — treat any "
                                "'no markets' below as a probe result, not a market result."))

          # A MARKET IS PLAYER-LEVEL IF IT NAMES A REAL NFL PLAYER, and the way to
          # know that is to ask our own board rather than to guess at phrasings.
          #
          # v3 matched only stat lines — "passing yards", "anytime td" — and therefore
          # reported ZERO player-level markets while its own sample titles read "Will
          # Patrick Mahomes play in a game in every week of the 2026 season." Those are
          # per-player markets, and per-player AVAILABILITY is arguably the more useful
          # kind for us: it is a direct read on games_expected, which own_v6 currently
          # estimates rather than observes.
          names = set()
          try:
              board = json.load(open("public/draft_data.json"))
              for pl in (board.get("players") or []) + (board.get("kept_players") or []):
                  n = (pl.get("name") or "").strip()
                  if len(n) > 6 and " " in n:
                      names.add(n.lower())
          except Exception as e:
              parse_errors["board_names"] = type(e).__name__

          STAT_RE = re.compile(r"passing yards|rushing yards|receiving yards|receptions|"
                               r"anytime touchdown|anytime td|to score a (touchdown|td)", re.I)
          def player_kind(title):
              low = (title or "").lower()
              if any(n in low for n in names):
                  return "stat" if STAT_RE.search(low) else "named_player"
              return "stat" if STAT_RE.search(low) else None

          for m in nfl_markets:
              m["player_kind"] = player_kind(m["title"])
          kalshi_player = [m for m in nfl_markets if m["player_kind"]]

          # PRICES AND LIQUIDITY, BECAUSE A TITLE IS NOT A SIGNAL.
          #
          # The stat markets carry MULTIPLE thresholds per player — 750/1000/1250/1500
          # receiving yards — which is four points on a market-implied distribution of
          # that player's season. That is the per-player upside number P1 concluded no
          # source publishes. But a market with no price, or one nobody trades, is a
          # number with nothing behind it, so the same run has to answer it.
          #
          # Re-reads each stat market individually for last_price / yes_bid / yes_ask /
          # volume / open_interest. Capped, because 417 individual reads is not worth it
          # to establish whether prices exist at all.
          priced, unpriced = [], 0
          for m in [x for x in kalshi_player if x["player_kind"] == "stat"][:60]:
              code, b = get(f"{KALSHI}/markets/{m['ticker']}")
              try: mk = (json.loads(b) or {}).get("market") or {}
              except Exception: mk = {}
              if code != 200 or not mk:
                  unpriced += 1
                  continue
              priced.append({
                "ticker": m["ticker"], "title": m["title"],
                "last_price": mk.get("last_price"), "yes_bid": mk.get("yes_bid"),
                "yes_ask": mk.get("yes_ask"), "volume": mk.get("volume"),
                "open_interest": mk.get("open_interest"),
                "liquidity": mk.get("liquidity"),
              })
          with_price = [r for r in priced if (r["yes_bid"] or 0) > 0 or (r["yes_ask"] or 0) > 0]
          traded = [r for r in priced if (r["volume"] or 0) > 0]
          price_note = (f"{len(priced)} stat markets read, {len(with_price)} carry a two-sided "
                        f"quote, {len(traded)} have traded volume, {unpriced} unreadable")

          # ── ODDS API: do player props exist on the per-EVENT route, free tier? ───
          odds_props = {"checked": False}
          ev = as_json("oddsapi_nfl_events")
          if isinstance(ev, list) and ev and key:
              eid = ev[0].get("id")
              code, b = get(f"{ODDS}/events/{eid}/odds?regions=us"
                            f"&markets=player_pass_yds,player_rush_yds,player_anytime_td&apiKey={key}")
              safe = b.replace(key, "<KEY>")
              odds_props = {"checked": True, "event_id": eid, "status": code,
                            "bytes": len(safe), "head": " ".join(safe[:400].split())}
              rows.append({"id": "oddsapi_event_player_props", "status": code, "bytes": len(safe)})
              print(f"  oddsapi_event_player_props -> {code}  {len(safe)}B")
          elif isinstance(ev, list):
              odds_props = {"checked": False, "note": f"{len(ev)} NFL events listed — none to query"}

          control = next((r["status"] for r in rows if r["id"] == "sleeper_control"), None)
          egress_ok = control == 200
          reachable = [r["id"] for r in rows if r.get("status") == 200 and r["id"] != "sleeper_control"]

          if not egress_ok:
              verdict = ("THIS RUN'S EGRESS IS BROKEN — the Sleeper control returned "
                         f"{control}, not 200. NOTHING here is evidence. Re-run.")
          elif parse_errors:
              verdict = ("A PAYLOAD DID NOT PARSE, so any 'nothing found' below is about THIS "
                         f"PROBE and not about the world: {json.dumps(parse_errors)}. "
                         "Fix and re-run before concluding anything.")
          elif kalshi_player:
              kinds = {}
              for m in kalshi_player:
                  kinds[m["player_kind"]] = kinds.get(m["player_kind"], 0) + 1
              verdict = (f"KALSHI CARRIES PLAYER-LEVEL NFL MARKETS — {len(kalshi_player)} of "
                         f"{len(nfl_markets)} open markets across {len(nfl_series)} NFL series, "
                         f"free and unauthenticated. By kind: {json.dumps(kinds)}. "
                         "`named_player` markets are per-player availability/props matched against "
                         "our own board's names; `stat` are stat-line props.")
          elif nfl_markets:
              verdict = (f"KALSHI IS FREE AND CARRIES NFL MARKETS ({len(nfl_markets)} open across "
                         f"{len(nfl_series)} series) BUT NONE ARE PLAYER-LEVEL by title. "
                         "A market arm built on Kalshi is a TEAM/GAME-CONTEXT prior, not a "
                         "per-player one — which is what P57's opponent term already is.")
          else:
              verdict = (f"NO OPEN NFL MARKETS FOUND ON KALSHI ({kalshi_note}). Control passed, so "
                         "this is a real answer for TODAY — 08-18 is the offseason and listings "
                         "may appear nearer week 1. Re-probe after 09-10 before concluding.")
          art = {
            "_territory": "TERRITORY: relay — written by .github/workflows/free-market-census.yml",
            "_question": ("P53. Cory 08-18: 'Do deep search for 2026 days for free.' The Odds API "
                          "credits expire ~08-31 and its historical endpoint cannot serve 2026 "
                          "in-season prices (week 1 opens 09-10), so every in-season market arm "
                          "needs a free live source or it should not be proposed."),
            "_scope": ("REACHABILITY AND GRANULARITY ONLY. Whether any of this predicts points is "
                       "an arm: it goes through BLEND-SEARCH-DESIGN and gets a preregistered grade."),
            "_control": ("sleeper_control is an endpoint this repo has fetched many times. If it "
                         "fails, a fully-blocked run would otherwise read as 'no source exists'."),
            "captured_at": datetime.now(timezone.utc).isoformat(),
            "egress_ok": egress_ok, "control_status": control,
            "reachable": reachable,
            "kalshi": {"nfl_series": nfl_series, "note": kalshi_note,
                       "open_markets": len(nfl_markets),
                       "player_level_markets": kalshi_player[:1200],
                       "priced_sample": priced, "price_note": price_note,
                       "player_level_count": len(kalshi_player),
                       "sample_titles": [m["title"] for m in nfl_markets[:15]]},
            "oddsapi_event_player_props": odds_props,
            "_v1_false_positive": ("v1 reported player-level content in two Kalshi endpoints. Both "
                                   "were wrong: the match was the legal boilerplate every series "
                                   "carries ('Current and former players, coaches, and staff...') "
                                   "and the second endpoint had no NFL filter, returning KXELONMARS. "
                                   "v2 reads series tickers and market TITLES instead of raw text."),
            "parse_errors": parse_errors,
            "rows": rows, "verdict": verdict,
          }
          os.makedirs("draft/backtest", exist_ok=True)
          with open("draft/backtest/free_market_census.json", "w") as f:
              json.dump(art, f, indent=1)
          print("\n" + "=" * 70)
          print(verdict)
          print("=" * 70)
          PY

      - name: Commit the census
        run: |
          set -uo pipefail
          git config user.name lab-bot
          git config user.email lab-bot@users.noreply.github.com
          if [ -n "$(git status --porcelain draft/backtest/free_market_census.json)" ]; then
            git add draft/backtest/free_market_census.json
            git commit -m "Free market census: which 2026 in-season source costs nothing [skip deploy]"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((2**i))
            done
          else
            echo "No change."
          fi
