# TERRITORY: C
name: Mutation manifest — re-run the recorded kills

# WHY THIS EXISTS ON A SCHEDULE RATHER THAN IN ci.yml.
#
# 127 commits in this repo claim mutation kills and nothing re-checked any of
# them. The manifest fixed the record; three cheap checks in
# draft/tests/test_mutation_manifest.py run on every CI pass and guard NAMES — a
# test deleted, a verdict that was never a kill, a target refactored away.
#
# None of those sees the regression that matters most: a test kept at the same
# name whose assertions were weakened until they no longer fail. Catching THAT
# needs every mutation actually re-applied, and each one spawns pytest. Putting
# it in ci.yml would add that cost to every push from every lane, on a repo where
# a slow gate is a gate people route around.
#
# WEEKLY, and the cadence is set by the failure mode: a hollowed-out test is not
# an emergency on the day it lands, it is a slow loss of coverage. A week is
# short enough that the diff which caused it is still findable.
#
# IT NAMES WHAT REGRESSED. "21 of 22" would send the reader to diff 22 entries by
# hand, and a scheduled check that costs an afternoon to read stops being read —
# the same reason the D3 job restates its failure instead of pointing at a log.

on:
  schedule:
    - cron: "40 5 * * 1"        # Mondays 05:40 UTC, off the hour so it does not
                                # queue behind the other Monday jobs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --quiet pytest pyyaml

      # THE LOGIC IS IN THE MODULE, NOT HERE. external-adp-capture.yml carries
      # that lesson in capitals: a condition written inline in YAML shipped two
      # defects no test could reach. `verify_manifest` is tested — including
      # against a test that is hollowed out while keeping its name, which is the
      # case this whole workflow exists for.
      # ONE RUN, NOT TWO. The first version had two python blocks and each
      # called `verify_manifest()` — so the dispatched run re-applied all 28
      # mutations TWICE, 40 seconds each, and the two runs could in principle
      # disagree with nothing noticing which was reported.
      - name: Re-run every recorded mutation
        # Generous, but bounded. The run re-applies every recorded mutation and
        # each one spawns pytest, so it is minutes rather than seconds and grows
        # with the manifest. A cancelled job is safe: the gate journals the
        # in-flight mutation and restores on SIGTERM, and the checkout is thrown
        # away regardless.
        timeout-minutes: 30
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "draft/backtest")
          import mutation_gate as MG
          r = MG.verify_manifest(root=".")
          print(json.dumps({k: v for k, v in r.items()
                            if k not in ("regressed", "stale", "unverifiable")},
                           indent=1))

          # THREE BUCKETS, THREE DIFFERENT FIXES. They used to share one list and
          # one sentence — "the test no longer fails when its mutation is
          # applied" — which is the wrong instruction for two of them, and sends
          # the reader hunting a weakened assertion that does not exist.
          BUCKETS = [
              ("regressed", "NO LONGER KILL",
               "the test still exists and no longer fails when its mutation is "
               "applied. THIS IS THE FAILURE THIS JOB EXISTS FOR — the assertion "
               "was weakened while keeping its name. Restore the assertion."),
              ("stale", "NO LONGER APPLY",
               "the recorded target no longer names exactly one line of the "
               "current source, or no longer applies cleanly to it. Nothing is "
               "wrong with the test. Re-run the gate and update the manifest."),
              ("unverifiable", "COULD NOT BE MEASURED",
               "the tree was already red, or tests vanished during the run. "
               "EVERY other verdict in this run is suspect. Fix the tree first, "
               "then re-run."),
          ]

          with open("/tmp/summary.md", "w") as fh:
              fh.write("## Mutation manifest\n\n")
              fh.write("- re-ran **%d** recorded kills, **%d** still kill\n"
                       % (r["checked"], r["killed"]))
              wrote = False
              for key, head, why in BUCKETS:
                  if not r.get(key):
                      continue
                  wrote = True
                  fh.write("\n**%d %s** — %s\n\n" % (len(r[key]), head, why))
                  for x in r[key]:
                      fh.write("- `%s` → **%s** — %s (%s)\n"
                               % (", ".join(x["must_fail"]), x["verdict"],
                                  x["detail"], x["module"]))
              if not r["checked"]:
                  fh.write("\n**NOTHING WAS CHECKED** — the manifest was empty or "
                           "unreadable. This is not a pass.\n")
              elif not wrote:
                  fh.write("\nAll recorded kills still kill.\n")

          # EXIT ON `all_killed`, NOT ON A BUCKET BEING EMPTY. Found by reading
          # the first dispatched run's log rather than trusting its green tick:
          # with `checked == 0` — manifest missing, renamed, or unreadable —
          # every bucket is empty and the job would have gone green while
          # verifying nothing. `all_killed` is `checked > 0 and killed ==
          # checked`, so it refuses that case by construction. A weekly job that
          # passes when it cannot find its own input is worse than no weekly job,
          # because the green tick is evidence to whoever reads it.
          for key, head, _ in BUCKETS:
              for x in r.get(key, []):
                  print("%s: %s -> %s" % (head, ", ".join(x["must_fail"]),
                                          x["verdict"]))
          if not r["checked"]:
              print("NOTHING CHECKED — the manifest was empty or unreadable.")
          sys.exit(0 if r["all_killed"] else 1)
          PY

      - name: Put it where it will be read
        if: always()
        run: cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
