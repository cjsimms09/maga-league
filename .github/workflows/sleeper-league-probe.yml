name: Sleeper league settings probe

# WHY A WORKFLOW. Sleeper egress is DENIED AT THE GATEWAY from the dev sandbox
# (connect_rejected, policy denial — not a TLS problem and not something to route
# around). CI has network access, which is how the nightly board builds, so the
# probe runs here.
#
# Dispatch-only and read-only: one GET, no commit of anything but the dump.
on:
  workflow_dispatch:
    inputs:
      league_id:
        description: 'Sleeper league id (blank = the configured league)'
        required: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Dump the FULL league object and report what we ignore
        env:
          SLEEPER_LEAGUE_ID: ${{ github.event.inputs.league_id }}
        run: python draft/sleeper_league_probe.py
      - name: Reconcile seeded career records against Sleeper's own history
        # B found the seeded records do not close: 425-424-2 = 851 slots, odd,
        # when every game contributes two. Sleeper holds every one of those games
        # via the previous_league_id chain, so it is read rather than guessed.
        env:
          SLEEPER_LEAGUE_ID: ${{ github.event.inputs.league_id }}
        run: python draft/sleeper_career_reconcile.py

      - name: Commit the dump
        run: |
          git config user.name lab-bot
          git config user.email actions@github.com
          git add draft/data/sleeper_league_settings.json draft/data/career_reconcile.json
          git diff --cached --quiet || git commit -m "Sleeper league settings + career reconcile [skip deploy]"
          # PUSH WITH A REBASE-RETRY (relay, 09-02): a plain `git push` loses the race
          # whenever another job or a session lands on main first — weekly-grade lost
          # its 09-01 artifacts that way ("! [rejected] main -> main (fetch first)"),
          # the props census lost run 3 the same way. The artifacts are already
          # committed locally, so rebase onto main and try again; a real conflict
          # still fails loudly.
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; echo "::error::rebase failed"; exit 1; }
            if git push -q origin HEAD:main; then echo "pushed on try $i"; exit 0; fi
            sleep $((2**i))
          done
          echo "::error::could not push after 5 tries"; exit 1
