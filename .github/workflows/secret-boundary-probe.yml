name: TEMP — secret boundary probe (Review_ChatGPT)

# TEMPORARY DIAGNOSTIC. Delete once the boundary is proven.
#
# `environment: Review_ChatGPT` is declared, the executed sha IS origin/main,
# and `os.environ["OPENAI_API_KEY"]` is still empty. Inference from "the
# environment exists and shows a secret" has failed twice, so this establishes
# the configuration actually available to the job, execution-first.
#
# IT NEVER PRINTS THE VALUE OR ENOUGH TO RECONSTRUCT IT. It prints a boolean
# evaluated before the shell exists, the sorted KEY NAMES of the secrets context
# (values parsed out in Python and never echoed), whether the shell variable is
# unset vs set-but-empty vs non-empty, and a length. A name plus a length is not
# a reconstruction; there is no path here that touches a value.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # TWO JOBS ON PURPOSE. If WITH-environment sees it and WITHOUT does not, the
  # binding works. If NEITHER sees it, the secret is not in that environment
  # under that name. If BOTH see it, it is a repository secret and the
  # environment is not what supplies it. That three-way split is the question.
  with_environment:
    runs-on: ubuntu-latest
    environment: Review_ChatGPT
    steps:
      - name: Boundary, four ways
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # EVALUATED BEFORE THE SHELL EXISTS. `${{ secrets.X }}` for a missing
          # secret expands to an EMPTY STRING, so "absent" and "present but
          # empty" are identical once they reach bash. This boolean is the only
          # thing that separates case 1 from case 3.
          SECRET_NONEMPTY: ${{ secrets.OPENAI_API_KEY != '' }}
          ALL_SECRET_NAMES: ${{ toJSON(secrets) }}
        run: |
          echo "job declares environment: Review_ChatGPT"
          echo "1. secrets.OPENAI_API_KEY != ''  : $SECRET_NONEMPTY"
          if [ -z "${OPENAI_API_KEY+isset}" ]; then
            echo "2. env mapping                   : ABSENT (variable unset)"
          elif [ -z "$OPENAI_API_KEY" ]; then
            echo "3. env var present but EMPTY     : yes"
          else
            echo "4. env var present and NON-EMPTY : yes (length ${#OPENAI_API_KEY})"
          fi
          python3 <<'PY'
          import json, os
          raw = os.environ.get("ALL_SECRET_NAMES") or "{}"
          try:
              keys = sorted(json.loads(raw).keys())
          except Exception as e:
              print("   secrets context unparseable:", type(e).__name__)
              raise SystemExit(0)
          print("   secret NAMES visible here :", keys)
          print("   OPENAI_API_KEY among them :", "OPENAI_API_KEY" in keys)
          PY

  without_environment:
    runs-on: ubuntu-latest
    steps:
      - name: Control — same read, no environment declared
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SECRET_NONEMPTY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          echo "job declares NO environment (control)"
          echo "1. secrets.OPENAI_API_KEY != ''  : $SECRET_NONEMPTY"
          if [ -z "${OPENAI_API_KEY+isset}" ]; then
            echo "2. env mapping                   : ABSENT (variable unset)"
          elif [ -z "$OPENAI_API_KEY" ]; then
            echo "3. env var present but EMPTY     : yes"
          else
            echo "4. env var present and NON-EMPTY : yes (length ${#OPENAI_API_KEY})"
          fi
