name: Weekly player-props fetch (The Odds API historical, budget-aware)

# THE WEEKLY (not season-total) props arm's fetch — Cory's 2026-08-16 split:
# "one for season projections for draft and another for weekly projections
# specific to that week?" This workflow feeds ONLY the weekly half:
# draft/tools/fetch_weekly_props.py -> draft/data/props/weekly_props_<season>
# _w<week>.json -> draft/weekly_props_arm.py -> weekly_own_grade.py's
# props_weekly_v1 study arm. Full framing: draft/audit/weekly_props_study_2026-08-16.md.
#
# A SIBLING STUDY (a different agent) owns the SEASON-TOTAL props arm for the
# draft board — draft/tools/fetch_historical_props.py and
# .github/workflows/historical-props-fetch.yml, NOT this file. BOTH fetches
# spend the SAME ODDS_API_KEY credit pool (confirmed 2026-08-16, key-probe
# run 31967817943: x-requests-remaining 99988 of what is very likely a
# 100,000-credit/mo plan). COORDINATE BEFORE EITHER FETCH RUNS FOR REAL —
# check the credit balance (this workflow's dry_run prints
# x-requests-remaining for a real events-list call) and the other study's
# spend before dispatching, so the two do not double-spend one pool.
#
# EXACT BUDGET, the-odds-api.com's own documented pricing model: 10 credits
# x (markets requested) x (regions requested) PER EVENT (game) CALL,
# regardless of how many players' lines that call returns.
#
#   ONE WEEK, default 9 markets (pass yds/tds/int, rush yds/tds, receptions,
#   reception yds/tds, anytime TD — the ninth added 2026-09-01, register 467,
#   so the live arm prices the TD lines the backtested arm scored), 1 region (us):
#     9 markets x 1 region x 10 credits = 90 credits PER GAME
#     ~14-16 games/week (fewer on bye-heavy weeks) => ~1,260-1,440 credits/week
#   (⚠️ MOOT ON A TIMER since Cory's 09-01 ruling — no paid props; this
#   workflow is dispatch-only and the live arm runs on the free Bovada writer,
#   which emits the same contract through the same converter.)
#
#   A FULL HISTORICAL BACKTEST, 2023-2025 regular seasons (272 games/season,
#   32 teams x 17 games / 2, x 3 seasons = 816 games total), same market set:
#     816 games x 90 credits/game = 73,440 credits TOTAL
#     (against a ~100,000-credit/mo balance — a full 3-season backtest at the
#     default market set is MOST of one month's budget in a single dispatch;
#     narrowing --markets, or backtesting a subset of weeks first, are the
#     two cheap levers if that number is too big)
#
# Only `player_pass_yds` and `player_anytime_td` are independently CONFIRMED
# present on this plan (the key-probe runs fetch_weekly_props.py cites); the
# other 7 default markets are the-odds-api.com's
# documented market-key convention for the same endpoint, assumed not
# reconfirmed one by one — a real dispatch's own log is the first place that
# gets checked market by market (fetch_weekly_props.py's provenance records
# markets_confirmed_live vs markets_assumed on every write).
#
# DRY RUN FIRST, the draft-night-sync.yml lesson repeated here: dry_run
# fetches for real (spending the cheap events-list call only, when a date is
# given) or runs the fixture-injection path (spending nothing) and writes to
# $RUNNER_TEMP, committing nothing — the mechanics get verified before any
# credit-spending event-odds call fires.
#
# SCHEDULED SINCE 2026-08-18, ON CORY'S PRIORITY-1 ORDER (relayed via the
# loop-breadth finding): Thursdays 12:00 UTC, real fetch, in-season only —
# ~1,260-1,440 credits/week against the ~100k/mo pool, per the budget above.
# The old rule ("a human decides when the real fetch is worth making") applied
# to one-off historical backtests and still does — the weekly in-season fetch
# is now a standing decision, made once, by the owner.

on:
  # Thursday 12:00 UTC — before the 14:00 UTC projector run, so the props arm's
  # input folder is populated when weekly_own_proj prices the week. Cory,
  # 2026-08-18, relayed as Priority 1: without this cron the props arm is
  # silently absent from every grade all season because nobody pressed a button
  # (ledger P92 predicts exactly that; this line is what falsifies it).
  # Scheduled runs derive week/date themselves and SKIP cleanly before week 1 —
  # a job that goes red every preseason Thursday is a job we learn to ignore.
  # SCHEDULE REMOVED 2026-09-01 — CORY'S STANDING RULING: "We don't need odds api
  # remember!! We get free props from bovada, ball don't lie, etc!!" The paid key
  # is never renewed and this must never spend on a timer again. dispatch-only.
  # The weekly props arm reads the FREE Bovada capture (P299). See CLAUDE.md.
    # SUNDAY CLOSING SNAPSHOT: DISARMED 08-21 hours after the relay added it —
    # C verified the write path and a second weekly run would SILENTLY CLOBBER
    # Thursday's snapshot (same season+week filename, no time-of-week tag).
    # The cron returns WITH C's tag patch (fetch_weekly_props.py, A merges).
    # Bovada-lines-capture carries the Sunday closing GAME lines meanwhile.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch for real but write nothing (or run the fixture path if no date/events given) — verifies mechanics + shows credit balance'
        required: false
        default: true
        type: boolean
      season:
        description: 'NFL season'
        required: true
        default: '2026'
        type: string
      week:
        description: 'NFL week number'
        required: true
        default: '1'
        type: string
      date:
        description: 'ISO8601 historical snapshot timestamp (e.g. 2026-09-10T17:00:00Z) — required for a REAL fetch; the vegas store carries no game dates so this cannot be derived for free'
        required: false
        default: ''
        type: string
      markets:
        description: 'Comma-separated market keys (default: the 9 markets fetch_weekly_props.py knows how to price)'
        required: false
        default: 'player_pass_yds,player_pass_tds,player_pass_interceptions,player_rush_yds,player_rush_tds,player_receptions,player_reception_yds,player_reception_tds'
        type: string
      limit:
        description: 'Cap the number of events fetched (bounded-cost smoke test) — leave blank for the full week'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and price one week's player props
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SEASON: ${{ github.event.inputs.season }}
          WEEK: ${{ github.event.inputs.week }}
          DATE: ${{ github.event.inputs.date }}
          MARKETS: ${{ github.event.inputs.markets }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # A cron fire carries no inputs — derive them. Week 1 kickoff week
            # starts 2026-09-08 (Tue); the Thursday fetch that precedes it is
            # 09-10. Before then: skip green, not red (see the trigger comment).
            SEASON="2026"
            KICKOFF=$(date -u -d '2026-09-08' +%s)
            NOW=$(date -u +%s)
            if [ "$NOW" -lt "$KICKOFF" ]; then
              echo "preseason ($(date -u +%F)) — scheduled props fetch starts week 1 (09-10). Skipping."
              exit 0
            fi
            WEEK=$(( (NOW - KICKOFF) / 604800 + 1 ))
            DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            DRY_RUN="false"
            MARKETS="player_pass_yds,player_pass_tds,player_pass_interceptions,player_rush_yds,player_rush_tds,player_receptions,player_reception_yds,player_reception_tds"
            LIMIT=""
            echo "scheduled run: season=$SEASON week=$WEEK date=$DATE"
          fi
          if [ -n "${GITHUB_ENV:-}" ]; then
            echo "SEASON=$SEASON" >> "$GITHUB_ENV"
            echo "WEEK=$WEEK" >> "$GITHUB_ENV"
          fi
          ARGS="--season $SEASON --week $WEEK --markets $MARKETS"
          if [ -n "$DATE" ]; then
            ARGS="$ARGS --date $DATE"
          fi
          if [ -n "$LIMIT" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            export PROPS_WEEKLY_OUT_DIR="$RUNNER_TEMP/props-dry"
            ARGS="$ARGS --dry-run"
            echo "DRY RUN: writing nothing (out dir would have been $PROPS_WEEKLY_OUT_DIR)."
          fi
          if [ -z "$DATE" ]; then
            echo "No --date given: this run will FAIL past the board-existence"
            echo "check unless a real fetch is not being attempted (dry_run with"
            echo "no date is the fixture-free smoke path — it will print the"
            echo "'no PROPS_WEEKLY_EVENTS injected and no ODDS_API_KEY' refusal"
            echo "if ODDS_API_KEY is unset, or attempt a real fetch with no date"
            echo "and refuse by name if one is set. Supply --date to fetch for real."
          fi
          echo "== python3 draft/tools/fetch_weekly_props.py $ARGS =="
          python3 draft/tools/fetch_weekly_props.py $ARGS
      - name: Commit the snapshot
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          git config user.name lab-bot
          git config user.email lab-bot@users.noreply.github.com
          # THE DIRECTORY MAY NOT EXIST and that is a NORMAL outcome, not an
          # error: every preseason run skips before writing anything, and git
          # cannot add a directory that was never created. Without this guard
          # `git add` exits 128 and the whole run reads FAILURE on a
          # bookkeeping step — which is exactly what happened on every run
          # before 2026-08-26 (e.g. run of 08-20: fetch step printed its clean
          # preseason skip, then this step killed the job). A red that fires
          # every quiet Thursday trains its reader to ignore the one red that
          # matters on 09-10.
          if [ ! -d draft/data/props ]; then
            echo "draft/data/props/ does not exist (nothing fetched this run) — nothing to commit"
            exit 0
          fi
          git add draft/data/props/
          if git diff --cached --quiet; then
            echo "no change (identical snapshot, or nothing written) — nothing to commit"
            exit 0
          fi
          git commit -m "Weekly props snapshot: season ${SEASON:-?} week ${WEEK:-?} [skip deploy]" \
            -m "Automated capture via weekly-props-fetch.yml (credit cost logged in the run output and the snapshot's own provenance)."
          # PUSH WITH A REBASE-RETRY (relay, 09-02): a plain `git push` loses the race
          # whenever another job or a session lands on main first — weekly-grade lost
          # its 09-01 artifacts that way ("! [rejected] main -> main (fetch first)"),
          # the props census lost run 3 the same way. The artifacts are already
          # committed locally, so rebase onto main and try again; a real conflict
          # still fails loudly.
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; echo "::error::rebase failed"; exit 1; }
            if git push -q origin HEAD:main; then echo "pushed on try $i"; exit 0; fi
            sleep $((2**i))
          done
          echo "::error::could not push after 5 tries"; exit 1
