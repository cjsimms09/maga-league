name: ADP SOURCES PROBE — is there a second gradeable market read?
# Cory's push (2026-08-09): do not accept "FFC is the only gradeable source" from
# what's wired in the repo — PROBE. Sandbox egress is policy-blocked for these hosts;
# CI has open egress (same as FFC/nflverse/BBM). This job hits each candidate for
# real, reports a source/seasons/format/coverage/gradeable table, and CAPTURES the
# FantasyPros row structure so the parser can be written accurately (the same
# discover-structure-before-parsing discipline the BBM probe used).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Probe every candidate ADP source for real
        continue-on-error: true
        timeout-minutes: 15
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, re
          UA = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 '
                              '(KHTML, like Gecko) Chrome/124 Safari/537.36'}
          def get(url, timeout=25):
              try:
                  req = urllib.request.Request(url, headers=UA)
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read().decode('utf-8', 'ignore')
              except urllib.error.HTTPError as e:
                  return e.code, ''
              except Exception as e:
                  return None, f'{type(e).__name__}: {str(e)[:120]}'

          report = {"sources": {}, "fantasypros_structure": {}}

          # 1. FANTASYPROS historical ADP — free HTML by year + position + format.
          fp = {}
          POS = ["overall", "rb", "wr", "qb", "te"]
          for yr in (2023, 2024, 2025):
              yr_cov = {}
              for pos in POS:
                  url = f"https://www.fantasypros.com/nfl/adp/half-point-ppr-{pos}.php?year={yr}"
                  st, body = get(url)
                  ok = bool(isinstance(body, str) and st == 200 and 'adp' in body.lower())
                  # count table rows that look like player rows (a <tr> with an ADP-ish cell)
                  nrow = len(re.findall(r'<tr[^>]*class="[^"]*mpb-player', body)) if ok else 0
                  if not nrow and ok:
                      nrow = len(re.findall(r'player-row|fp-player-name', body))
                  yr_cov[pos] = {"status": st, "ok": ok, "approx_rows": nrow}
                  # capture ONE overall page's raw structure so the parser is accurate
                  if pos == "overall" and ok and yr == 2024 and not report["fantasypros_structure"]:
                      # a slice around the first table for offline inspection
                      i = body.lower().find('<table')
                      report["fantasypros_structure"] = {
                          "url": url,
                          "has_export_csv": ('csv' in body.lower() and 'export' in body.lower()),
                          "embedded_json": bool(re.search(r'var\s+\w*[Aa]dp\w*\s*=', body)),
                          "table_slice": body[i:i + 2500] if i >= 0 else body[:2500]}
              fp[yr] = yr_cov
          report["sources"]["fantasypros"] = fp

          # 2. MYFANTASYLEAGUE — year-scoped export; docs say current-year only, verify.
          mfl = {}
          for yr in (2023, 2024, 2025):
              url = (f"https://api.myfantasyleague.com/{yr}/export?TYPE=adp&PERIOD=DRAFT"
                     f"&IS_PPR=1&IS_KEEPER=N&IS_MOCK=-1&INJURED=-1&CUTOFF=5&FCOUNT=12&JSON=1")
              st, body = get(url)
              has = bool(isinstance(body, str) and ('adp' in body.lower()) and ('player' in body.lower()))
              mfl[yr] = {"status": st, "has_players": has,
                         "sample": body[:200] if isinstance(body, str) else str(body)}
          report["sources"]["myfantasyleague"] = mfl

          # 3. WAYBACK CDX — is Sleeper's preseason ADP page archived each August?
          wb = {}
          for host in ("sleeper.com/football/nfl/adp", "fantasyfootballcalculator.com/adp"):
              url = (f"http://web.archive.org/cdx/search/cdx?url={host}*"
                     f"&from=20230801&to=20251001&output=json&limit=20&collapse=digest")
              st, body = get(url)
              try:
                  rows = json.loads(body) if isinstance(body, str) and body.strip().startswith('[') else []
              except Exception:
                  rows = []
              wb[host] = {"status": st, "snapshots": max(0, len(rows) - 1)}
          report["sources"]["wayback"] = wb

          # 4. FANTASYDATA + NFFC (high-stakes) — do the historical pages return data?
          for name, url in (("fantasydata", "https://fantasydata.com/nfl/adp"),
                            ("nffc", "https://nfc.shgn.com/adp/football")):
              st, body = get(url)
              report["sources"][name] = {"status": st,
                  "looks_like_adp": bool(isinstance(body, str) and 'adp' in body.lower())}

          json.dump(report, open('draft/data/adp_sources_probe.json', 'w'), indent=2)
          # human-readable verdict table
          print("SOURCE            | 2023 | 2024 | 2025 | note")
          fpv = report["sources"]["fantasypros"]
          for yr in (2023, 2024, 2025):
              ov = fpv[yr]["overall"]
              print(f"fantasypros {yr}   | ok={ov['ok']} rows~{ov['approx_rows']} status={ov['status']}")
          for yr in (2023, 2024, 2025):
              print(f"mfl {yr}           | {report['sources']['myfantasyleague'][yr]}")
          print("wayback:", report["sources"]["wayback"])
          print("fantasydata:", report["sources"]["fantasydata"], "nffc:", report["sources"]["nffc"])
          print("FP structure captured:", bool(report["fantasypros_structure"]))
          PY

      - name: Commit the probe table + captured structure
        run: |
          stamp=$(date -u +%Y-%m-%dT%H:%MZ)
          git config user.name "lab-bot"; git config user.email "actions@github.com"
          [ -f draft/data/adp_sources_probe.json ] && git add draft/data/adp_sources_probe.json
          git commit -m "ADP sources probe $stamp" || { echo "no change"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push || echo "push skipped"

      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: adp-sources-probe
          path: draft/data/adp_sources_probe.json
          retention-days: 30
