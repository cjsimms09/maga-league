name: Projection error refit v2 — register 4q, SIDE artifact only

# TERRITORY: C — dispatches draft/backtest/projection_error.py's
# main_refit_v2(), C's module (declared in-file), same as its sibling
# projection-error-calibration.yml.

# DEFECT-REGISTER.md row 4q, relay/PM -> C (ROUTES.md TO:C, commit fe67c424):
# the SHIPPED projection_error.BAND_EDGES = (3, 8, 16, 32) puts 935 of 1,304
# graded players -- 72%, every player Cory drafts from round 4 on -- into ONE
# band per position, "33+". Inside that one cell proj_ceiling is a constant
# multiple of proj_mean by construction, which is the mechanism behind
# registers 4j and 4p: the board tells Cory a round-12 flier has LESS
# proportional upside than a first-rounder, backwards from every fantasy
# theory, and he caught it by instinct.
#
# THIS WORKFLOW DOES NOT FIX THAT. It runs the relay's specified refit --
# BAND_EDGES_REFIT_V2 = (3, 8, 16, 32, 48, 72, 100, 150), splitting 33+ into
# 33-48/49-72/73-100/101-150/151+ -- and writes it to TWO SIDE FILES:
#   draft/backtest/projection_error_calibration_refit_v2.json  (the refit itself)
#   draft/backtest/projection_error_refit_v2_comparison.json   (old band vs.
#     new bands, side by side, so the question -- is the ratio actually flat
#     inside 33+, or does the one cell hide a real slope -- has numbers)
#
# IT NEVER WRITES draft/backtest/projection_error_calibration.json. That file
# is what draft/projections.py actually reads for the live board's
# proj_ceiling/proj_floor/proj_sd (confirmed by grep, not assumed -- see
# ROUTES.md TO:A, 2026-08-17). Shipping the refit is Cory's call, made FROM
# this comparison, via the separate projection-error-calibration.yml
# workflow re-dispatched with the new bands if and when he rules -- not an
# automatic consequence of this one running.
#
# The population question the relay flagged as the harder half -- should the
# p90 be conditioned on players who actually held a role, rather than an
# unconditional average that zero-inflated deep positions toward "no upside"
# -- is UNCHANGED here. This workflow answers "does the ratio have a slope
# inside 33+", not "is the ratio itself computed on the right population".
# Both calibrations this produces carry the same SURVIVOR_CAVEAT.
#
# DISPATCH THIS FROM `main`, NOT A WORKTREE BRANCH -- same push-guard reason
# named in every other fetch workflow built this week: the 08-16 Sleeper
# history probe was dispatched from a feature branch, the guard correctly
# refused to write to main, and the answer was lost for a day.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: projection-error-calibration-refit-v2
  cancel-in-progress: false

jobs:
  refit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install
        run: pip install pandas nfl_data_py pytest

      - name: The refit logic is tested before any real fetch runs
        run: python3 -m pytest draft/tests/test_projection_error.py -q

      - name: Run the split-band refit and write the SIDE artifacts
        run: python3 draft/backtest/projection_error.py --refit-v2

      - name: Confirm the production calibration was not touched
        run: |
          if ! git diff --quiet -- draft/backtest/projection_error_calibration.json; then
            echo "::error::main_refit_v2 modified the PRODUCTION calibration file. This must never happen -- aborting without committing anything."
            git diff --stat -- draft/backtest/projection_error_calibration.json
            exit 1
          fi
          echo "confirmed: projection_error_calibration.json is untouched"

      - name: Commit the two side artifacts
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::warning::Dispatched from '$GITHUB_REF_NAME', not main. The"
            echo "::warning::refit is in this run's log and is deliberately NOT"
            echo "::warning::committed. Re-dispatch from main."
            echo "_Dispatched from \`$GITHUB_REF_NAME\` — refit NOT committed._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name lab-bot
          git config user.email lab-bot@users.noreply.github.com
          git add draft/backtest/projection_error_calibration_refit_v2.json \
                  draft/backtest/projection_error_refit_v2_comparison.json
          if ! git diff --cached --quiet; then
            git commit -m "projection_error: register 4q refit (split 33+ band) — SIDE artifact, board unaffected [skip deploy]"
            for i in 1 2 3; do
              git fetch origin main || true
              git rebase origin/main || { git rebase --abort 2>/dev/null || true; }
              if git push origin HEAD:main; then exit 0; fi
              sleep $((i * 5))
            done
            echo "::error::REFIT NOT PUSHED — the fetch is spent and the answer is lost."
            exit 1
          fi
          echo "no change — the refit already matches what was on disk"
