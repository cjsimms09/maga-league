# FREE WEEKLY PROPS WRITER — the props arm's input, from free doors, no key.
# Cory's standing ruling (CLAUDE.md, 09-01): no paid props, no Odds API. This
# replaces the paid Thursday fetch's OUTPUT (same file, same contract) with
# Sleeper Picks + Underdog lines, measured free and full-coverage on 09-02
# (free_props_census_2026.json). Thursday 12:20 UTC, after the census (12:15)
# and before the Thursday emissions; the writer REFUSES on its own known-
# positive self-checks (a QB with a pass-yds line from Sleeper, an Underdog
# fill, >=30 priced) and writes nothing on a null.
name: free-props-writer
on:
  workflow_dispatch:
    inputs:
      week:
        description: 'NFL week (blank = ask Sleeper /state/nfl)'
        required: false
        default: ''
  schedule:
    # Wednesday 19:30 UTC — before a Wednesday/short-week opener (week 1: SEA-NE)
    # AND before own-weekly-proj.yml's 20:00Z snapshot, whose props second
    # opinion READS this file: at 20:00 both fired together and the snapshot
    # raced a write that had not been pushed yet (relay, 09-02).
    # ⚠️ WEDNESDAY 09:30 UTC — THE SAFETY NET, added 2026-09-09 (relay) on A's
    # register 495 measurement, which was applied to own-weekly-proj.yml and
    # weekly-projection-archive.yml but not to this third emitter.
    #
    # A measured GitHub's scheduler across 93 scheduled runs in THIS repo:
    # median delay 3h45, 97% more than an hour late, 39% more than FOUR hours,
    # one firing 9h25 late. The 19:30Z slot below carries 4h50 against week 1's
    # 00:20Z opener — it beats the median and loses to that 39% tail, so it is
    # roughly a one-in-three chance of writing the week's props AFTER kickoff.
    #
    # EARLIER IS NOT STRICTLY BETTER FOR PROPS, and that is why this is added
    # rather than the 19:30Z slot being moved: props are LINES, and a line
    # captured in the morning is staler than one captured at teatime. So the
    # late slot stays as the preferred capture and this one exists only so a
    # delayed scheduler cannot leave the week with nothing. Safe because the
    # writer MERGES and never clobbers (see the Thursday slot's note): an early
    # capture followed by a late refresh keeps the freshest line per market,
    # and if the late run is eaten by the delay the early one still stands.
    - cron: '30 9 * * 3'      # Wednesdays 09:30 UTC — the one that must not miss
    - cron: '30 19 * * 3'     # Wednesdays 19:30 UTC — preferred: fresher lines
    - cron: '20 12 * * 4'  # Thursday 12:20 UTC — the main pre-TNF snapshot; merges, never clobbers
    # Sunday 15:30 UTC — the CLOSING-LINE snapshot for P289, written to a SEPARATE
    # `_sun` file (PROPS_SNAPSHOT_SUFFIX below). The arm and the Tuesday grader
    # read the unsuffixed Wed/Thu file — the lines the emission actually saw —
    # so a Sunday run can never overwrite them (ROUTES relay → C, 09-02).
    - cron: '30 15 * * 0'
permissions:
  contents: write
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Write this week's free props (self-checked, refuses on a null)
        run: |
          set -uo pipefail
          # Sunday (UTC day 7) writes the closing-line sibling, never the arm's file.
          if [ "$(date -u +%u)" = "7" ]; then export PROPS_SNAPSHOT_SUFFIX=_sun; echo "Sunday run: writing the _sun closing-line snapshot"; fi
          W="${{ github.event.inputs.week }}"
          if [ -n "$W" ]; then
            if python3 draft/tools/fetch_free_props.py --week "$W"; then code=0; else code=$?; fi
          else
            if python3 draft/tools/fetch_free_props.py; then code=0; else code=$?; fi
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::free props writer REFUSED (self-check or fetch failure) — nothing written; the arm has no file for this week until this is green"
            exit "$code"
          fi
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name lab-bot
          git config user.email lab-bot@users.noreply.github.com
          git add draft/data/props/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change — nothing to commit"; exit 0; fi
          git commit -m "Free weekly props snapshot (Sleeper Picks + Underdog) [skip deploy]"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; echo "::error::rebase failed"; exit 1; }
            if git push -q origin HEAD:main; then echo "pushed on try $i"; exit 0; fi
            sleep $((2**i))
          done
          echo "::error::could not push after 5 tries"; exit 1
