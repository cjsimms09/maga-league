name: INBOX HEALTH — is anyone answering, and is any work invisible?

# Cory, 2026-08-18: "So have you solved communication problem going forward?"
#
# WHEN HE FIRST ASKED, THE ANSWER WAS NO, AND THE REASON WAS CIRCULAR. Two checks
# existed — lane_status.js (work on a branch `main` cannot see) and
# routes_response_check.js (asks nobody has answered) — and BOTH sat unwired on a
# branch, waiting for A to add them to ci.yml. A check that only runs when a human
# remembers to run it is exactly the failure class it was built to catch, and the
# request to wire it was travelling down the very channel that was broken.
#
# SO THIS ARMS THEM WITHOUT DEPENDING ON A. It is a NEW workflow, not an edit to
# ci.yml — A's gate is untouched and stays A's. Nothing here can fail A's build or
# block a merge; the worst it does is write a file.
#
# AND IT WRITES THAT FILE WHERE CORY CAN READ IT. Everything else built tonight
# reports into CI logs and terminals, which is to say: to the lanes, not to the
# person who raised the complaint. INBOX-HEALTH.md is a mailbox under Rule 1b —
# it pushes straight to main, it is the one artifact in this repo whose audience
# is Cory, and it answers his question in three numbers.
on:
  schedule:
    - cron: '17 13 * * *'      # 13:17 UTC daily — off the hour, so it never queues
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['ROUTES.md']       # the inbox changed; re-measure it

permissions:
  contents: write

concurrency:
  group: inbox-health
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # lane_status needs every branch, not just main

      - name: Measure the inbox and the lanes
        run: |
          set -uo pipefail
          {
            echo "# INBOX HEALTH"
            echo
            echo "**For Cory.** Written by \`.github/workflows/inbox-health.yml\`, which"
            echo "runs daily and on every change to \`ROUTES.md\`. Nothing here is written"
            echo "by hand, so it cannot quietly stop being true."
            echo
            echo "Two questions, measured:"
            echo "**is anyone answering**, and **is any finished work invisible from \`main\`**."
            echo
            echo "_Last measured: $(date -u '+%Y-%m-%d %H:%M UTC')_"
            echo
            echo '```'
            node draft/tools/routes_response_check.js 2>&1 || true
            echo '```'
            echo
            echo '```'
            node draft/tools/lane_status.js 2>&1 || true
            echo '```'
            echo
            echo "## How to read this"
            echo
            echo "**BLOCKED** counts asks that are open, carry no \`DEFAULT\`, and are 3+ days"
            echo "old. An ask WITH a default is fine at any age — silence resolves it, which is"
            echo "what \`OPERATING-MODEL.md\` intends. An ask WITHOUT one blocks whoever sent it,"
            echo "indefinitely, and until 08-18 nothing in this repo measured that."
            echo
            echo "**The number only has to go DOWN.** It is a ratchet, not a target: the check"
            echo "fails when the backlog grows, never merely because it is large. Failing on all"
            echo "131 four days before a draft would go red for weeks and get switched off, which"
            echo "is how the previous guard died."
            echo
            echo "**Stranded** lanes have commits \`main\` has never seen. \`ROUTES.md\` cannot show"
            echo "you these — it lists what a lane wrote down, so a branch with nineteen commits"
            echo "and no routed entry looks identical to an idle lane. That is the exact shape of"
            echo "D's work on 08-18."
          } > INBOX-HEALTH.md
          cat INBOX-HEALTH.md

      # The check is advisory here ON PURPOSE. It reports to Cory; it does not gate
      # anyone's merge. Gating is A's call and lives in A's file.
      - name: Report whether the backlog grew
        continue-on-error: true
        run: node draft/tools/routes_response_check.js

      # COMMIT ONLY WHEN THE MEASUREMENT MOVED, NOT WHEN THE CLOCK DID.
      #
      # The first version of this step committed on any file difference, and the
      # "Last measured" line guarantees a difference on every run — so it wrote
      # NINE commits to `main` in under an hour, three of them inside eight
      # minutes, none carrying new information. A daily health report that
      # doubles the commit rate of the repository is a worse problem than the
      # one it was built to solve, and it would also start losing races against
      # real pushes.
      #
      # So the comparison ignores the timestamp: only the measured numbers decide
      # whether anything is published. When they do move, the fresh timestamp
      # rides along with them.
      - name: Publish only if the numbers moved
        run: |
          set -uo pipefail
          git config user.name lab-bot
          git config user.email lab-bot@users.noreply.github.com

          strip() { grep -v '^_Last measured:' "$1" 2>/dev/null || true; }
          git show HEAD:INBOX-HEALTH.md > /tmp/prev.md 2>/dev/null || : > /tmp/prev.md

          if diff -q <(strip /tmp/prev.md) <(strip INBOX-HEALTH.md) >/dev/null 2>&1; then
            echo "Numbers unchanged — not committing a timestamp-only diff."
            git checkout -- INBOX-HEALTH.md 2>/dev/null || true
            exit 0
          fi

          echo "Measurement moved — publishing."
          git add INBOX-HEALTH.md
          git commit -m "Inbox health: the numbers moved [skip deploy]"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((2**i))
          done
