name: THE LAB — experiment runner

# Standing infrastructure per docs/queued/the-lab.md + LAB-REGISTRY.md.
#
# Runs the registered, harness-wired experiments (money_grade + roster_sim +
# lab_stats), grading in E[$] under era-correct per-season payouts, and commits
# the append-only results + the one-table Lab report. Weekly cadence feeds the
# Sunday self-audit; also runs on any change to the harness or the historical
# data it grades against, so a harness edit re-grades immediately.

on:
  schedule:
    # 03:30 UTC Monday — ahead of the 04:00 self-audit, so its report is fresh.
    - cron: '30 3 * * 1'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'draft/backtest/money_grade.py'
      - 'draft/backtest/roster_sim.py'
      - 'draft/backtest/lab_stats.py'
      - 'draft/backtest/lab.py'
      - 'draft/backtest/bridge.py'
      - 'draft/backtest/dump-replay.js'
      - 'draft/backtest/cli.py'
      - 'draft/backtest/grade.py'
      - 'draft/tests/test_bridge.py'
      - 'draft/backtest/tournament.py'
      - 'draft/backtest/cory_conditional.py'
      - 'draft/backtest/frontier.py'
      - 'draft/backtest/policy_tournament.py'
      - 'draft/backtest/stack_sweep.py'
      - 'draft/backtest/sim_validation.py'
      - 'draft/backtest/opponent_model.py'
      - 'draft/backtest/exp34.py'
      - 'draft/backtest/exp34_metrics.py'
      - 'draft/backtest/exp34_dollars.py'
      - 'draft/tests/test_exp34_dollars.py'
      - 'draft/backtest/exp36.py'
      - 'draft/tests/test_exp36.py'
      - 'draft/backtest/exp43_fullboard.py'
      - 'draft/tests/test_exp43.py'
      - 'draft/backtest/exp_source_grade.py'
      - 'draft/tests/test_source_grade.py'
      - 'draft/backtest/mfl_adp.py'
      - 'draft/backtest/fantasypros_adp.py'
      - 'draft/tests/test_fantasypros_adp.py'
      - 'draft/backtest/exp33.py'
      - 'draft/tests/test_exp33.py'
      - 'draft/backtest/exp35_regression_sweep.py'
      - 'draft/backtest/exp33b_naive_source.py'
      - 'draft/tests/test_exp33b.py'
      - 'draft/tests/test_exp35.py'
      - 'draft/backtest/lab_projections.py'
      - 'draft/data/league_history.json'
      - 'draft/config/payouts.json'
      - '.github/workflows/lab.yml'

permissions:
  contents: write        # commits LAB-REPORT.md + lab-results.json

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: CERTIFICATION GATE — reproduce history to the dollar before grading
        # Cory's certification order: no experiment consumes the grader until it
        # reproduces all three seasons' actual money tables to the dollar (Cory
        # 2023=$400, mhagen 2025=$1,325, every owner every season). The efficiency
        # -leak finding is the same machinery, so a green gate certifies it too.
        run: |
          pip install pytest -q
          python -m pytest draft/tests/test_money_grade_certification.py -q

      - name: Guard — the rest of the harness tests must be green too
        run: |
          python -m pytest draft/tests/test_money_grade.py draft/tests/test_roster_sim.py \
                           draft/tests/test_lab_stats.py draft/tests/test_lab.py \
                           draft/tests/test_data_spine.py \
                           draft/tests/test_doctrine_parity.py \
                           draft/tests/test_doctrine_stamp.py \
                           draft/tests/test_attribution_wording.py \
                           draft/tests/test_claim_integrity.py \
                           draft/tests/test_shared_state_audit.py -q

      - name: Run the Lab
        run: python draft/backtest/lab.py --out draft/backtest

      - name: AUTO-FIRE — every local-input experiment, every run (the standing rule)
        # the-lab.md §3b: no experiment waits for a session to decide it's time.
        # These need only in-repo inputs (board artifact + predicted slates +
        # payouts), so they re-run on every Lab invocation and a dependency
        # turning green fires them without anyone noticing it turned green.
        run: |
          set -e
          python draft/backtest/cory_conditional.py --rooms 200   # exp 19b
          python draft/backtest/frontier.py --rooms 150           # exp 21 (+ exp 2 §5 slice)
          python draft/backtest/policy_tournament.py --rooms 120  # exp 2 §5/§6
          python draft/backtest/stack_sweep.py --rooms 120        # exp 6
          python draft/backtest/exp_keeper_nabers.py --rooms 200  # keeper decision w/ Nabers (Aug-20 lock)
          python draft/backtest/exp_need_phase.py --rooms 300     # need-weight ramp vs the mask
          python draft/backtest/exp_participation.py --rooms 400  # all-terms participation (draft-day Auto)
          python draft/backtest/sim_validation.py --rooms 24      # simulator fidelity + limits
          python draft/opening_script.py                          # inherits any new verdict
          # The doctrine banner reads the enrolled plan off the BOARD artifact,
          # which is rebuilt on the egress schedule, not the Lab's. Re-stamp it
          # here so a fresh 19b verdict reaches the War Room on this run rather
          # than waiting for an unrelated projection rebuild.
          python draft/stamp_doctrine.py

      - name: Commit the report
        run: |
          stamp=$(date -u +%Y-%m-%dT%H:%MZ)
          git config user.name "lab-bot"; git config user.email "actions@github.com"
          git add draft/backtest/LAB-REPORT.md draft/backtest/lab-results.json \
                  draft/backtest/CORY-CONDITIONAL.md draft/backtest/cory-conditional.json \
                  draft/backtest/FRONTIER.md draft/backtest/frontier.json \
                  draft/backtest/POLICY-TOURNAMENT.md draft/backtest/policy-tournament.json \
                  draft/backtest/STACK-SWEEP.md draft/backtest/stack-sweep.json \
                  draft/backtest/EXP-KEEPER-NABERS.md draft/backtest/exp_keeper_nabers.json \
                  draft/backtest/EXP-NEED-PHASE.md draft/backtest/exp_need_phase.json \
                  draft/backtest/EXP-PARTICIPATION.md draft/backtest/exp_participation.json \
                  draft/backtest/SIM-FIDELITY.md draft/backtest/sim-fidelity.json \
                  draft/backtest/HETEROGENEOUS-VALIDATION.md \
                  draft/backtest/PLAYOFF-MONEY-VALIDATION.md \
                  draft/data/opening_script.md draft/data/opening_script.json \
                  public/draft_data.json
          git commit -m "Lab report $stamp" || { echo "no change"; exit 0; }
          git pull --rebase origin main && git push || echo "push skipped"

  # THE REPLAY->MONEY BRIDGE GATE (the harness's final increment).
  #
  # Runs HERE because building its inputs needs nflverse + FFC egress the
  # sandbox does not have. Bundles + per-week points are built fresh, the replay
  # dumps every policy's per-pick choices, and test_bridge.py's CI layer asserts
  # the real invariants: the 'actual' policy reproduces each seat's true drafted
  # roster, every policy money-grades bounded, and coverage clears the honesty
  # floor. Experiments that consume the FULL REPLAY PATH (1/2/19 and the
  # money-graded parts of 20/21/24/25/26) run only behind this gate — a red
  # bridge means their inputs cannot be trusted, so they must not run at all.
  #
  # Deliberately a separate job: a nflverse outage must not take down the
  # certification + L0 report above, which need no egress.
  replay-bridge:
    runs-on: ubuntu-latest
    needs: lab            # certification first — the bridge grades with the same grader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Build bundles + per-week points (nflverse/FFC egress)
        run: |
          pip install -r draft/requirements.txt -q
          pip install pytest -q
          python draft/backtest/cli.py --out draft/backtest/bundles.json \
                                       --weekly-out draft/backtest/weekly_points.json

      - name: Dump the replay's per-pick policy choices
        run: node draft/backtest/dump-replay.js

      - name: BRIDGE GATE — the replay path money-grades correctly
        run: python -m pytest draft/tests/test_bridge.py -q

      - name: Run the bridge (money-graded policy results)
        run: python draft/backtest/bridge.py --out draft/backtest/bridge-results.json

      - name: THE GATED BATCH — experiments 1, 2, 19 (tournament), behind the gate
        # Runs ONLY after the bridge gate above passed — the experiments consume
        # the same roster-aware replay path the gate just certified. Null-search
        # + held-out gates are inside tournament.py; nothing installs itself.
        run: |
          python -m pytest draft/tests/test_tournament.py -q
          python draft/backtest/tournament.py

      - name: Commit the tournament report
        run: |
          stamp=$(date -u +%Y-%m-%dT%H:%MZ)
          git config user.name "lab-bot"; git config user.email "actions@github.com"
          git add draft/backtest/LAB-TOURNAMENT.md
          git commit -m "Lab tournament report $stamp" || { echo "no change"; exit 0; }
          git pull --rebase origin main && git push || echo "push skipped"

      - name: Upload bridge + tournament results (artifacts — inputs are egress-built)
        uses: actions/upload-artifact@v4
        with:
          name: bridge-results
          path: |
            draft/backtest/bridge-results.json
            draft/backtest/tournament-results.json
          retention-days: 30

  # EXPERIMENT 34 — recommendation-vs-market, policy-level (forgone-value unit).
  #
  # Egress: FFC historical ADP per season + nflverse realized/prior points. The
  # ANALYSIS (rank correlation, top-N, forgone-value + distance bands, sensitivity
  # curves, cliff split) is the verified pure core — test_exp34*.py run FIRST as a
  # gate, without egress, so a broken statistic is a red build before any fetch.
  # Separate job: a nflverse/FFC outage must not take down certification + L0.
  exp34:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: GATE — the pure measuring-stick tests (no egress)
        # The dollar arm's grading is pure over the harvest, so its pipeline is
        # gated here in the sandbox too — a broken statistic or roster build is a
        # red build BEFORE any fetch, same discipline as the correlation arm.
        run: |
          pip install pytest -q
          python -m pytest draft/tests/test_exp34.py draft/tests/test_exp34_metrics.py \
                           draft/tests/test_exp34_dollars.py -q
      - name: CERTIFICATION GATE — the dollar arm grades through the certified layer
        # The dollar arm consumes money_grade.grade_substituted + roster_sim; it may
        # not grade until they reproduce history to the dollar (the same gate the
        # rest of the Lab honours). A red cert here means the money layer is untrusted,
        # so the dollar arm must not fire on it.
        run: |
          python -m pytest draft/tests/test_money_grade_certification.py \
                           draft/tests/test_money_grade.py draft/tests/test_roster_sim.py -q
      - name: Fire exp 34 — correlation arm (FFC + nflverse egress)
        run: |
          pip install -r draft/requirements.txt -q
          python draft/backtest/exp34.py --out draft/backtest
      - name: Fire exp 34 — DOLLAR arm (reads the correlation result for agreement)
        # Runs AFTER the correlation arm so it can cross-read exp34.json and state
        # whether the two arms agree. Grades all 3 seasons from the harvest (incl.
        # 2025, which the correlation arm skips) using FFC ADP + nflverse priors as
        # the ranker only.
        run: python draft/backtest/exp34_dollars.py --out draft/backtest
      - name: Commit the exp 34 reports
        run: |
          stamp=$(date -u +%Y-%m-%dT%H:%MZ)
          git config user.name "lab-bot"; git config user.email "actions@github.com"
          git add draft/backtest/EXP34.md draft/backtest/exp34.json \
                  draft/backtest/EXP34-DOLLARS.md draft/backtest/exp34_dollars.json
          git commit -m "Exp 34 report (correlation + dollar arms) $stamp" || { echo "no change"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push || echo "push skipped"
      - name: Upload exp 34 results (artifact — inputs are egress-built)
        uses: actions/upload-artifact@v4
        with:
          name: exp34-results
          path: |
            draft/backtest/exp34.json
            draft/backtest/EXP34.md
            draft/backtest/exp34_dollars.json
            draft/backtest/EXP34-DOLLARS.md
          retention-days: 30

  # EXPERIMENT 36 — ADP-efficiency audit (reliability surface by round × position).
  #
  # The Anchor Doctrine's per-region shrinkage dependency: where is consensus ADP
  # actually right? Grades ADP as a predictor of realized value over the FULL board
  # (every owner's pick, all seasons) sliced by round × position — far more data per
  # cell than exp 34's 19 decisions. The ANALYSIS (cell stats, floor/thin rule,
  # efficiency->shrink mapping, tier-cliff detector) is the verified pure core —
  # test_exp36.py runs FIRST as a gate, no egress, so a broken shrinkage weight is a
  # red build before any fetch. Separate job: a nflverse/FFC outage must not take
  # down certification + L0.
  exp36:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: GATE — the pure surface tests (no egress)
        run: |
          pip install pytest -q
          python -m pytest draft/tests/test_exp36.py -q
      - name: GATE — exp 43 pure core tests (no egress)
        run: python -m pytest draft/tests/test_exp43.py -q
      - name: Fire exp 36 (FFC + nflverse egress) — also emits exp36_picks.json for exp 43
        run: |
          pip install -r draft/requirements.txt -q
          python draft/backtest/exp36.py --out draft/backtest
      - name: Fire exp 43 — full-board pick audit (consumes exp36_picks.json, no extra egress)
        run: python draft/backtest/exp43_fullboard.py
      - name: GATE — source-grade pure core (no egress)
        run: python -m pytest draft/tests/test_source_grade.py -q
      - name: Fire source grade — FFC vs MFL per region (consumes exp36_picks.json + MFL egress)
        continue-on-error: true
        run: python draft/backtest/exp_source_grade.py
      - name: Commit the exp 36 + exp 43 + source-grade reports
        run: |
          stamp=$(date -u +%Y-%m-%dT%H:%MZ)
          git config user.name "lab-bot"; git config user.email "actions@github.com"
          for f in draft/backtest/EXP36.md draft/backtest/exp36.json draft/backtest/exp43.json \
                   draft/backtest/exp_source_grade.json; do
            [ -f "$f" ] && git add "$f"
          done
          git commit -m "Exp 36 + full-board pick audit + source grade $stamp" || { echo "no change"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push || echo "push skipped"
      - name: Upload exp 36 + exp 43 + source-grade results (artifacts — inputs are egress-built)
        uses: actions/upload-artifact@v4
        with:
          name: exp36-results
          path: |
            draft/backtest/exp36.json
            draft/backtest/EXP36.md
            draft/backtest/exp36_picks.json
            draft/backtest/exp43.json
            draft/backtest/exp_source_grade.json
          retention-days: 30

  # EXPERIMENT 33 — projection-source bake-off (the foundational weak link).
  #
  # Races our blend vs a naive prior-year model vs FFC ADP (ranking) [vs Sleeper if
  # retrievable] on realized points by position — MAE, rank correlation, top-decile
  # hit, priced in $ through the certified grader. A LOSS IS THE HEADLINE. The
  # metrics + naive model + head-to-head are the verified pure core (test_exp33.py
  # gates first, no egress). Separate job so a nflverse/FFC outage can't take down L0.
  exp33:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: GATE — the pure bake-off tests (no egress)
        run: |
          pip install pytest -q
          python -m pytest draft/tests/test_exp33.py -q
      - name: CERTIFICATION GATE — the $ pricing grades through the certified layer
        run: |
          python -m pytest draft/tests/test_money_grade_certification.py \
                           draft/tests/test_roster_sim.py draft/tests/test_exp34_dollars.py -q
      - name: Fire exp 33 (nflverse + FFC egress)
        run: |
          pip install -r draft/requirements.txt -q
          python draft/backtest/exp33.py --out draft/backtest
      - name: Commit the exp 33 report
        run: |
          stamp=$(date -u +%Y-%m-%dT%H:%MZ)
          git config user.name "lab-bot"; git config user.email "actions@github.com"
          git add draft/backtest/EXP33.md draft/backtest/exp33.json
          git commit -m "Exp 33 report $stamp" || { echo "no change"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push || echo "push skipped"
      - name: Upload exp 33 results (artifact — inputs are egress-built)
        uses: actions/upload-artifact@v4
        with:
          name: exp33-results
          path: |
            draft/backtest/exp33.json
            draft/backtest/EXP33.md
          retention-days: 30

  # EXPERIMENT 35 — REGRESSION_WEIGHT sweep. Pre-registered: top-decile improves as
  # the weight falls below the shipped 0.35 (exp 33 said we over-regress). Measures
  # the full curve in top-decile + rank-corr + MAE; installs nothing. Pure core
  # (curve + verdict) gates first without egress; the shipped walk_forward path is
  # asserted byte-identical to the override at the shipped value.
  exp35:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: GATE — the pure sweep tests (no egress)
        run: |
          pip install pytest -q
          python -m pytest draft/tests/test_exp35.py -q
      - name: Fire exp 35 (nflverse + FFC egress)
        run: |
          pip install -r draft/requirements.txt -q
          python draft/backtest/exp35_regression_sweep.py --out draft/backtest
      - name: Commit the exp 35 report
        run: |
          stamp=$(date -u +%Y-%m-%dT%H:%MZ)
          git config user.name "lab-bot"; git config user.email "actions@github.com"
          git add draft/backtest/EXP35.md draft/backtest/exp35.json
          git commit -m "Exp 35 report $stamp" || { echo "no change"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push || echo "push skipped"
      - name: Upload exp 35 results (artifact — inputs are egress-built)
        uses: actions/upload-artifact@v4
        with:
          name: exp35-results
          path: |
            draft/backtest/exp35.json
            draft/backtest/EXP35.md
          retention-days: 30

  # EXPERIMENT 33b — naive as the projection source (tune-vs-replace). Races the
  # shipped blend vs the naive prior-year model vs the market on ranking AND dollars,
  # to decide whether exp 33/35's over-regression finding means LOWER the weight or
  # REPLACE the source. Pure comparison core gates first; installs nothing.
  exp33b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: GATE — the pure comparison tests (no egress)
        run: |
          pip install pytest -q
          python -m pytest draft/tests/test_exp33b.py -q
      - name: CERTIFICATION GATE — the $ side grades through the certified layer
        run: |
          python -m pytest draft/tests/test_money_grade_certification.py \
                           draft/tests/test_roster_sim.py draft/tests/test_exp34_dollars.py -q
      - name: Fire exp 33b (nflverse + FFC egress)
        run: |
          pip install -r draft/requirements.txt -q
          python draft/backtest/exp33b_naive_source.py --out draft/backtest
      - name: Commit the exp 33b report
        run: |
          stamp=$(date -u +%Y-%m-%dT%H:%MZ)
          git config user.name "lab-bot"; git config user.email "actions@github.com"
          git add draft/backtest/EXP33B.md draft/backtest/exp33b.json
          git commit -m "Exp 33b report $stamp" || { echo "no change"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push || echo "push skipped"
      - name: Upload exp 33b results (artifact — inputs are egress-built)
        uses: actions/upload-artifact@v4
        with:
          name: exp33b-results
          path: |
            draft/backtest/exp33b.json
            draft/backtest/EXP33B.md
          retention-days: 30
