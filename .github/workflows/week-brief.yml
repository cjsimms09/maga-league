name: THIS-WEEK brief — the roster fact sheet every session cites

# Cory, 2026-08-31: "every session seems to be mistating the players on my
# roster... each week, each session should be aware of my roster, who i am
# playing, their speicfic games, weather, home/away." This regenerates
# THIS-WEEK.md + this_week.json from LIVE Sleeper three times a week —
# Tuesday (post-waivers), Friday (injury reports), Sunday morning (final) —
# so THE ROSTER RULE (CLAUDE.md era banner) always has a fresh target.
# The generator REFUSES to write on any control failure: a brief that lies
# is worse than one that says its own age.

on:
  schedule:
    # ⚠️ WEDNESDAY WAS MISSING AND WEEK 1 KICKS OFF ON A WEDNESDAY.
    # Registers 475/477 moved the SNAPSHOT cadence for that (own-weekly-proj
    # now fires 10:00Z Wed) and left THIS cadence behind — the same defect,
    # one surface over. Measured 2026-09-09, 11h before kickoff: the brief was
    # last built 09-08 17:18Z and was quoting a second opinion generated
    # 09-03 17:24Z, while a fresh one had been on disk since 09-09 11:22Z.
    # On a Tue/Fri/Sun cadence the next rebuild was Friday — AFTER the first
    # game. Cory's one page would have carried six-day-old numbers through the
    # only week whose opener is a Wednesday.
    #
    # WHY 12:00Z SPECIFICALLY, and it is derived rather than picked:
    #   · AFTER the Wednesday snapshot, so the brief reads that week's fresh
    #     second opinion rather than the previous one (10:00Z fired -> the
    #     second opinion landed 11:22Z today).
    #   · BEFORE kickoff by more than this scheduler's worst OBSERVED delay.
    #     GitHub has been measured 9h25 late on this repo
    #     (test_weekly_snapshot_beats_kickoff.py, OBSERVED_MAX_DELAY_H = 9.41).
    #     Week 1 kicks off 2026-09-10T00:20Z; 12:00Z leaves 12h20 of margin
    #     against 9.41 + 2.0 safety = 11.41 needed. The Tue 13:30Z firing has
    #     no margin at all on a Wednesday-opener week — it is the day before.
    - cron: '30 13 * * 2'   # Tue 13:30 UTC — waivers have cleared
    - cron: '0 12 * * 3'    # Wed 12:00 UTC — after the Wed snapshot, before a Wed opener
    - cron: '30 13 * * 5'   # Fri 13:30 UTC — injury designations landing
    - cron: '30 11 * * 0'   # Sun 11:30 UTC — before the Sunday alert reads the world
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the brief from live Sleeper
        run: |
          set -uo pipefail
          if python3 draft/tools/build_week_brief.py; then code=0; else code=$?; fi
          # bash -e is injected; the if-form is exempt (draft-night-sync's lesson)
          if [ "$code" -ne 0 ]; then
            echo "::error::week brief REFUSED to write (control failure or fetch error) — the last committed brief stands, with its own generated_at as the warning"
            exit "$code"
          fi
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name lab-bot
          git config user.email lab-bot@users.noreply.github.com
          git add THIS-WEEK.md draft/data/this_week.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change (or preseason skip wrote nothing) — nothing to commit"
            exit 0
          fi
          git commit -m "THIS-WEEK brief refresh [skip deploy]" \
            -m "Live-Sleeper roster fact sheet, per THE ROSTER RULE. Automated via week-brief.yml."
          git pull --rebase -q origin main || true
          git push || { git pull --rebase -q origin main && git push; }
