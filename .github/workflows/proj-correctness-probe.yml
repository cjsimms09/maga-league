name: Projection correctness — raw rows for DECISIONS #0 and #000

# WHY A WORKFLOW — same reason as rule12-statlines.yml, verbatim class: Sleeper
# and FantasyPros egress are denied at the gateway from the dev sandbox (403 at
# the proxy — a policy denial, not a TLS problem and not something to route
# around). Cory's 2026-08-16 ruling ("Don't agree with timelines we fix now")
# moved DECISIONS-NEEDED #0 (def_fum_td) and #000 (WR/TE FP scale) from
# post-draft to NOW, and both fixes are gated on raw provider rows the sandbox
# cannot fetch: all 32 DEF projection rows (the committed record has one) and
# FP's 2026 stat lines as served (field names + FP's own fpts).
#
# The probe deliberately does NOT score anything. The stat-line-to-points
# conversion and the alias/component mapping are the things under audit, so the
# file that fetches the inputs must not also produce the answer.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Fetch the raw provider rows (all-32 DEF + FP-vs-Sleeper components)
        run: python draft/proj_correctness_probe.py
      - name: Commit the evidence
        run: |
          git config user.name lab-bot
          git config user.email lab-bot@users.noreply.github.com
          git add draft/audit/proj_correctness_evidence_2026-08-16.json
          # `git commit` exits 1 with nothing staged; that is a no-op, not a
          # failure, and must not turn a clean run red.
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "projection correctness: raw provider rows for #0 + #000 [skip deploy]"
          # PUSH WITH A REBASE-RETRY (relay, 09-02): a plain `git push` loses the race
          # whenever another job or a session lands on main first — weekly-grade lost
          # its 09-01 artifacts that way ("! [rejected] main -> main (fetch first)"),
          # the props census lost run 3 the same way. The artifacts are already
          # committed locally, so rebase onto main and try again; a real conflict
          # still fails loudly.
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; echo "::error::rebase failed"; exit 1; }
            if git push -q origin HEAD:main; then echo "pushed on try $i"; exit 0; fi
            sleep $((2**i))
          done
          echo "::error::could not push after 5 tries"; exit 1
