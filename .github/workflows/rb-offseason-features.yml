name: RB offseason features — C4 (backfield competition + team change)

# TERRITORY: C — dispatches draft/backtest/rb_offseason_features.py.
#
# Routed 2026-08-18 (ROUTES.md, A -> C, "P38 granted and C dispatched"),
# V7-CANDIDATE-PREREG.md §1 (C4) / §4 (P-v7c). Builds the RB offseason
# feature store (player_id x season, 2021-2026) that A's v7 candidate
# grading harness will join against POST-DRAFT — nothing here touches the
# board or any number Cory drafts from on 08-22 (the prereg says so
# explicitly, §5).
#
# nfl_data_py's import_depth_charts/import_rosters are proxy-blocked from
# the sandbox (403/000, same as every other nfl_data_py egress this week) —
# this runs in CI only, dispatched from `main` for the same push-guard
# reason as every other fetch workflow this week.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rb-offseason-features
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install
        run: pip install -r draft/requirements.txt pytest

      - name: The pure feature logic is tested before any real fetch runs
        run: python3 -m pytest draft/tests/test_rb_offseason_features.py -q

      - name: Build the RB offseason feature store
        run: python3 draft/backtest/rb_offseason_features.py

      - name: Commit the feature store
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::warning::Dispatched from '$GITHUB_REF_NAME', not main. The"
            echo "::warning::result is in this run's log and is deliberately"
            echo "::warning::NOT committed. Re-dispatch from main."
            echo "_Dispatched from \`$GITHUB_REF_NAME\` — result NOT committed._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name lab-bot
          git config user.email lab-bot@users.noreply.github.com
          git add draft/backtest/rb_offseason_features.json
          if ! git diff --cached --quiet; then
            git commit -m "rb_offseason_features: C4 feature store built — backfield competition + team change, 2021-2026 [skip deploy]"
            for i in 1 2 3; do
              git fetch origin main || true
              git rebase origin/main || { git rebase --abort 2>/dev/null || true; }
              if git push origin HEAD:main; then exit 0; fi
              sleep $((i * 5))
            done
            echo "::error::RESULT NOT PUSHED — the fetch is spent and the answer is lost."
            exit 1
          fi
          echo "no change — the feature store already matches what was on disk"
