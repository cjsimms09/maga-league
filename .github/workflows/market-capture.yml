name: Market capture (preseason)

# THE UNRECOVERABLE WINDOW. usa-nfl-preseason is reachable today; a snapshot not
# taken cannot be reconstructed, and Signal C has no baseline without an earliest
# observation carrying a stated timestamp.
#
# READ-ONLY with respect to the model: writes only its own snapshot files. Nothing
# it captures is visible during a live draft, waiver or lineup decision.
#
# Scheduled twice weekly so Signal C has two valid observations per week — the
# floor below which movement is not measurable at all. Manual dispatch for tonight.

on:
  workflow_dispatch:
    inputs:
      league:
        # EMPTY MEANS EVERY REGISTERED LEAGUE. It defaulted to preseason, which
        # is how the scheduled capture came to ask for preseason and nothing else
        # for the whole of August.
        description: 'usa-nfl-preseason, usa-nfl, or empty for every registered league'
        required: false
        default: ''
      max_events:
        description: 'cap events (0 = all)'
        required: false
        default: '0'
      horizon_days:
        description: 'only capture odds for games within N days'
        required: false
        default: '14'
  schedule:
    # DAILY. The argument is asymmetry, not need: a daily series resamples to
    # weekly for any analysis, and a weekly series can never be refined to daily
    # afterwards. Signal C's resolution is bounded by sampling frequency, and the
    # cost is ~10% of a day's allowance, so the finer default is the cheap side of
    # an irreversible choice.
    #
    # FIXED TIME, not event-driven. A fixed clock gives clean, comparable
    # timestamps for measuring movement; event-driven capture only ever sees the
    # moves you went looking for, which is a sampling bias dressed as efficiency.
    # 13:00 UTC is pre-US-morning, before most line moves and after overnight ones
    # settle.
    - cron: '0 13 * * *' 

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Python deps
        run: pip install pytest -q

      # The guards before the spend: if these are red the capture must not run,
      # because a bad request costs budget and may bill even when it fails.
      - name: Test the capture guards before spending anything
        run: |
          python -m pytest draft/tests/test_market_capture.py \
                           draft/tests/test_market_budget.py \
                           draft/tests/test_market_retry.py \
                           draft/tests/test_market_read.py -q

      - name: Capture
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY || vars.ODDS_API_KEY }}
        run: |
          # ── THE LEAGUE DEFAULT WAS PRESEASON, AND ONLY PRESEASON ───────────
          #
          # This read `'usa-nfl-preseason'`. `market_filters.LEAGUES` registers
          # BOTH leagues, but the cron passed one — so the scheduled capture has
          # never once asked for a regular-season game. Preseason ends around
          # 08-29, after which the job would have kept running daily, GREEN,
          # capturing an empty slate, while the entire regular season went by
          # uncaptured. A job that succeeds at doing nothing is the failure this
          # repository keeps finding, and those weeks are unrecoverable.
          #
          # Empty default = every registered league. Manual dispatch can still
          # name one. Costs nothing extra today: C's census puts the nearest
          # regular-season kickoff 27 days out, so the horizon keeps the slate at
          # zero until 08-27 and the budget does not bind (500/day against ~32).
          python draft/backtest/market_capture.py \
            --league "${{ github.event.inputs.league || '' }}" \
            --max-events "${{ github.event.inputs.max_events || '0' }}" \
            --horizon-days "${{ github.event.inputs.horizon_days || '14' }}"

      # ── PRESERVE BEFORE YOU ALARM ────────────────────────────────────────
      #
      # THIS STEP USED TO SIT AT THE BOTTOM, AFTER THE HEALTH GATE, WITH NO
      # `always()`. A failed step aborts the job, so on the exact run that
      # RECOVERS from a bad patch — capture succeeds, writes today's real
      # snapshot, but `consecutive_incomplete` has reached its bar of 3 — the
      # gate exits 1 and today's snapshot is never committed. And because the
      # counter lives in the same uncommitted file, the next run recomputes
      # the same 3, fails the same way, and discards that day too. FOREVER.
      # An alarm that destroys the thing it is watching, on precisely the days
      # it is watching for. (The step below even warns that "the next run can
      # still take the deferred events while the window is open" — while the
      # ordering guaranteed the next run's result would be thrown away.)
      #
      # `always()` is correct here and is not a way of ignoring failure: the
      # pre-capture pytest guard already refuses a BROKEN WRITER, so anything
      # on disk at this point is real captured data plus the health counters
      # that make the next run's arithmetic right. The alarm still fires — it
      # just fires after the day is safe, and the gate's exit code is still
      # the job's verdict because it is now the last thing that runs.
      - name: Commit the snapshot (BEFORE the gate — see above)
        if: always()
        run: |
          git config user.name "lab-bot"; git config user.email "actions@github.com"
          git add draft/market_snapshots || true
          git commit -m "Market snapshot: ${{ github.event.inputs.league || 'all registered leagues' }}" \
            || { echo "no change"; exit 0; }
          git pull --rebase origin main && git push || echo "push skipped"

      # HEALTH IS LOUD. A capture that dies quietly is the failure this project
      # keeps hitting; a stale baseline discovered in December cannot be backfilled.
      - name: Fail if the capture is stale or empty
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          from datetime import datetime, timezone
          h = pathlib.Path('draft/market_snapshots/capture_health.json')
          if not h.exists():
              print('::error::no health file — the capture did not run'); sys.exit(1)
          d = json.loads(h.read_text())
          print('health:', json.dumps(d, indent=2, sort_keys=True))
          if d.get('consecutive_failures', 0) > 0:
              print(f"::error::{d['consecutive_failures']} consecutive failed captures")
              sys.exit(1)
          last = d.get('last_success_at')
          if not last:
              print('::error::no successful capture has ever completed'); sys.exit(1)

          # COVERAGE IS READ. It was written by write_health one line above the
          # verdict and consulted by nothing here, so a 13-of-48 run (coverage
          # 0.271, complete false) passed this gate as a clean success. The gate
          # would have reported healthy while the capture was effectively broken,
          # and the hole would have surfaced in December when Signal C's baseline
          # turned out to be full of gaps — far past the point of backfilling.
          cov = d.get('last_coverage')
          if cov is None:
              print('::error::health carries no coverage — cannot tell a full capture'
                    ' from a 2% one, which is the exact state this gate exists to end')
              sys.exit(1)
          print(f"coverage {cov:.1%} of {d.get('last_events_listed')} listed"
                f" ({d.get('last_deferred')} deferred), complete={d.get('last_complete')}")

          # A PERSISTENT HOLE FAILS; A SINGLE PARTIAL WARNS. One incomplete run is
          # recoverable — tomorrow's capture can still take the deferred events
          # while the window is open. A RUN of them is a hole being written into an
          # unrecoverable window, and the bar is declared in the health file so the
          # gate cannot quietly apply a looser one than the producer intended.
          ci = int(d.get('consecutive_incomplete', 0))
          bar = int(d.get('max_consecutive_incomplete', 3))
          if ci >= bar:
              print(f'::error::{ci} consecutive incomplete captures (bar {bar}) —'
                    ' Signal C is accumulating holes that cannot be backfilled')
              sys.exit(1)
          if ci > 0:
              print(f'::warning::capture incomplete {ci} run(s) in a row'
                    f' (coverage {cov:.1%}); fails at {bar}')

          age = (datetime.now(timezone.utc)
                 - datetime.strptime(last, '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=timezone.utc)).days
          print(f'last success {age}d ago (stale after {d.get("stale_after_days")}d)')
          if age > int(d.get('stale_after_days', 7)):
              print('::error::capture is stale — Signal C baseline is developing a hole')
              sys.exit(1)

          # STALENESS OF COMPLETENESS, separately. "We captured something recently"
          # is not "we have a whole slate recently", and only the second one means
          # Signal C has an intact baseline set.
          lc = d.get('last_complete_at')
          if not lc:
              print('::warning::no COMPLETE capture has ever run — every baseline set'
                    ' so far has known gaps')
          PY

      # THE READER RUNS EVERY TIME, so the completeness label has a consumer that
      # actually consults it rather than a correct flag nobody reads. Reported
      # across ALL snapshots on disk, not just tonight's: Signal C's baseline set
      # is cumulative, so the question is "which events still have no baseline",
      # not "how did this one run do".
      - name: What the baseline set actually covers
        if: always()
        run: |
          python draft/backtest/market_read.py | tee /tmp/mr.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/mr.json'))
          miss = d['events_without_baseline']
          if miss:
              print(f"::warning::{len(miss)} of {d['events_listed']} events have NO"
                    f" baseline yet — the next run can still take them while the"
                    f" window is open: {miss[:8]}{' ...' if len(miss) > 8 else ''}")
          if d['events_with_movement'] == 0 and d['snapshots'] > 1:
              print('::warning::more than one snapshot exists but no event has two'
                    ' observations — Signal C has points, not series')
          PY

