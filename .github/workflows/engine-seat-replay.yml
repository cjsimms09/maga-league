name: Engine seat replay
# THE LIVE-EDGE MEASUREMENT's choice side (ROUTES.md 2026-08-17). Assembles
# the same era-appropriate bundles backtest.yml does — here and not in the
# agent sandbox because FFC's historical `year` endpoint and Sleeper are
# refused at CONNECT there — then drives the REAL engine.js/survival.js
# through every seat's fixed-opponents counterfactual and commits the CHOICE
# file (no outcomes) back to the dispatching branch. Grading joins the
# committed weekly stores afterwards, offline, via replay_seats_grade.py.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Comma-separated seasons (blank = all replayable)"
        required: false
        default: ""
jobs:
  replay:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install
        run: pip install -r draft/requirements.txt
      - name: Assemble era-appropriate bundles
        run: python draft/backtest/cli.py --seasons "${{ inputs.seasons }}" --out draft/backtest/bundles.json
      # `engine_seat_choices.json` is BY DEFINITION the SHIPPED configuration —
      # every reader of it, including test_engine_seat_replay.py, assumes that.
      # Since Cory shipped the VONA fix on 2026-08-19 the shipped arm is a1, so
      # the default file is built with `--arm a1` and the pre-fix engine keeps
      # its own file. Naming the arm explicitly rather than relying on the
      # engine default is the same rule the ARMS table itself follows.
      - name: Seat-level engine replay (choices only, SHIPPED arm)
        run: node draft/backtest/replay_seats.js --arm a1 --in draft/backtest/bundles.json --out draft/backtest/engine_seat_choices.json
      # REGISTER 56 / P107 — the VONA self-exclusion arms, driven through THE
      # SAME bundles.json as the step above. The bundle is reassembled on every
      # run (Sleeper/FFC are refused at CONNECT in the agent sandbox, so it
      # cannot be committed), so arms compared across two runs would carry that
      # drift inside the delta. One job, one bundle, three arms.
      # ⚠️ THE SHIPPED VALUE OF `need` MOVED, AND EVERY ARM BELOW THAT DOES NOT
      # PIN IT CHANGED MEANING SILENTLY (A, 2026-08-20, register 160).
      #
      # This is the `a0: {}` lesson from replay_seats.js's own header, one
      # parameter over. That header says: "an arm that sets nothing INHERITS the
      # shipped default, so a0 would have quietly become a second copy of a1 and
      # the next A1-minus-A0 delta would have read as a clean zero." `--need` is
      # resolved the same way — `WEIGHTS = Object.assign({}, E.MEASURED_WEIGHTS)`
      # unless overridden — so when Cory ruled `need` 0.0 -> 1.0 today, arm N1
      # (`--need 1.0`) became byte-identical to a1 and the P110 binary collapsed
      # to nothing. The workflow's own "every weight arm must differ from its
      # control" guard catches it as a hard failure rather than a false null,
      # which is the only reason this is a note and not a wrong number.
      #
      # THE BINARY IS THE SAME QUESTION WITH ITS ARMS SWAPPED. The shipped
      # configuration is now need=1.0, so the counterfactual worth measuring is
      # need=0.0 — the pre-ruling engine — against it. Same comparison, same
      # bundle, same prereg (`NEED-WEIGHT-PREREG.md`); only which side is the
      # control has moved, because the world moved.
      - name: assert the shipped need weight is what these arm names claim
        run: |
          node -e "
            global.window = global;
            const E = require('./public/js/draft/engine.js');
            const w = E.MEASURED_WEIGHTS.need;
            if (w !== 1.0) {
              console.error('MEASURED_WEIGHTS.need is ' + w + ', not 1.0.');
              console.error('Every arm below that does not pass --need inherits it, so the');
              console.error('arm names and the configurations they run have come apart.');
              console.error('Re-point the arms deliberately; do not let them drift.');
              process.exit(1);
            }
            console.log('shipped need = 1.0 — the arm names below mean what they say');
          "
      # REGISTER 59 / P110 — the `need` weight binary. BOTH arms are now written
      # out and NEITHER is left implicit. N1 keeps its filename because four
      # labs read it (`conversion_by_arm_lab.py`, `auto_phase_cost_lab.py`,
      # `build_phase_tradeoff_lab.py`, and the compare step below); N0 is new
      # and is the pre-ruling engine. The pair is compared against each other
      # rather than N1 against a1, which is what stopped meaning anything the
      # moment need=1.0 shipped.
      - name: need-weight arm N1 (need=1.0 — the SHIPPED engine, shipped VONA)
        run: |
          node draft/backtest/replay_seats.js --arm a1 --need 1.0 \
            --in draft/backtest/bundles.json \
            --out draft/backtest/engine_seat_choices_need1.json
      - name: need-weight arm N0 (need=0.0 — the pre-ruling engine, shipped VONA)
        run: |
          node draft/backtest/replay_seats.js --arm a1 --need 0.0 \
            --in draft/backtest/bundles.json \
            --out draft/backtest/engine_seat_choices_need0.json
      - name: refuse identical need arms
        run: |
          if cmp -s draft/backtest/engine_seat_choices_need0.json \
                    draft/backtest/engine_seat_choices_need1.json; then
            echo "N0 and N1 are byte-identical — the need weight never reached the score."
            echo "This is NOT a null result. Refusing to commit a gradeable artifact."
            exit 1
          fi
          echo "need arms differ — the weight is live in the score"
      # REGISTER 59 / P114 — the `bye` weight arm. `bye` also ships at 0, and it
      # is the term aimed at the ACTUAL failure register 59 found: an empty
      # starting slot once byes are applied. Graded POST-DRAFT by design
      # (`BYE-WEIGHT-PREREG-2026-08-19.md` §5) — the run happens now so the
      # answer exists, the DECISION waits.
      - name: bye-weight arm B1 (bye=1.0, shipped VONA)
        run: |
          node draft/backtest/replay_seats.js --arm a1 --bye 1.0 \
            --in draft/backtest/bundles.json \
            --out draft/backtest/engine_seat_choices_bye1.json
      # P115 — the AUTO ADJUSTER as a graded arm. Measured on the live board,
      # Auto produces the same roster shape as need=1.0, so P110's +68.6 may be
      # reachable as a UI checkbox rather than a weight edit on draft week.
      - name: auto-adjuster arm (phase weights per pick, shipped VONA)
        run: |
          node draft/backtest/replay_seats.js --arm a1 --auto \
            --in draft/backtest/bundles.json \
            --out draft/backtest/engine_seat_choices_auto.json
      # REGISTER 60 (2) / P119 — THE SLOT-AWARE RE-TAKE. `VONA_SLOT_AWARE` is
      # off because flooring the flex marginal at 0 tied 1331 of 1686 players at
      # exactly 0 — measured on a VONA computing the wrong quantity, before
      # register 56 / P107. `SLOT-AWARE-VONA-REPREG-2026-08-19.md`. The collapse
      # half already PASSED (modal share 0.9%, 458 distinct of 562, control
      # clean); this is condition (2) of four, and the prereg states in advance
      # that a NULL here leaves the flag OFF.
      #
      # s0 IS RUN EVEN THOUGH IT IS IDENTICAL TO a1 ABOVE. Not redundant:
      # reading the delta against a1's file would compare two runs against two
      # separately-reassembled bundles, and that drift would sit inside the
      # delta. Same bundle, same job, both arms.
      # ⚠️ THESE TWO ARMS NOW RUN AT need=1.0 AND THAT IS THE POINT, NOT AN
      # ACCIDENT (A, 2026-08-20). Cory, today: "have we tried turning on slot
      # aware with new VONA? does it help?"
      #
      # The answer was no. `--need` is unset here, so both arms inherit
      # MEASURED_WEIGHTS.need — which was 0 when the prereg was written and is
      # 1.0 since Cory's register-160 ruling. Left alone they would have started
      # measuring a different question than their names describe, which is the
      # `a0: {}` failure this workflow already carries a warning about. So the
      # weight is PINNED EXPLICITLY on both, at the shipped value, and the pair
      # now answers Cory's question directly: does slot-aware VONA add anything
      # ON TOP of the roster-awareness `need` already supplies?
      #
      # THAT IS P111, ALREADY FILED AND STILL OPEN — "does `need` still pay once
      # the flex/onesie rules it multiplies are no longer the only roster-aware
      # terms (register 60's (2) and (3))?" — asked from the other side. Same
      # binary either way, and the prereg's decision rule is untouched: a NULL
      # here leaves the flag OFF.
      #
      # THE COLLAPSE HALF WAS TAKEN AT need=0 and is NOT re-used as though it
      # transferred. It is condition (1) of four and it passed on a different
      # configuration; whether it still holds at need=1.0 is re-run below rather
      # than assumed, because assuming is what put this comment here.
      - name: slot-aware control arm s0 (slot-aware OFF, need pinned to shipped 1.0)
        run: |
          node draft/backtest/replay_seats.js --arm s0 --need 1.0 \
            --in draft/backtest/bundles.json \
            --out draft/backtest/engine_seat_choices_slot_s0.json
      - name: slot-aware arm s1 (slot-aware ON, need pinned to shipped 1.0)
        run: |
          node draft/backtest/replay_seats.js --arm s1 --need 1.0 \
            --in draft/backtest/bundles.json \
            --out draft/backtest/engine_seat_choices_slot_s1.json
      # THE ARMS MUST DIFFER, OR THE ARM NEVER RAN. `vona()` returns `straight`
      # at its first line when the flag is off, so a wiring failure produces a
      # valid artifact identical to the control — the exact shape that made the
      # `--need` run gradeable as a clean null. Fail the job rather than commit
      # two identical files and grade the difference between them.
      - name: refuse identical slot arms
        run: |
          if cmp -s draft/backtest/engine_seat_choices_slot_s0.json \
                    draft/backtest/engine_seat_choices_slot_s1.json; then
            echo "s0 and s1 are byte-identical — the slot-aware branch never ran."
            echo "This is NOT a null result. Refusing to commit a gradeable artifact."
            exit 1
          fi
          echo "arms differ — the slot-aware branch executed"
      # EVERY WEIGHT ARM MUST DIFFER FROM ITS CONTROL, not just the slot pair.
      # Found 2026-08-19: `--bye 1.0` produced a `seasons` block BIT-IDENTICAL to
      # the shipped arm across all 30 seats, while the weights stamp correctly
      # read "MEASURED_WEIGHTS with bye=1" and it graded at +0.0 in 30 of 30.
      # The stamp built after the `--need` incident CANNOT catch this: there the
      # weight was never applied, here the weight was applied and the quantity it
      # multiplies was zero. Only comparing the OUTPUT tells "does not help"
      # apart from "has nothing to multiply". Register 69.
      - name: refuse a weight arm that changed nothing
        run: python3 draft/tools/arm_participation_check.py
      - name: VONA comparison arms A0 (pre-fix) and A2 (rescale diagnostic)
        run: |
          node draft/backtest/replay_seats.js --arm a0 \
            --in draft/backtest/bundles.json \
            --out draft/backtest/engine_seat_choices_a0.json
          node draft/backtest/replay_seats.js --arm a2 \
            --in draft/backtest/bundles.json \
            --out draft/backtest/engine_seat_choices_a2.json
      - name: Commit the choice file to the dispatching branch
        run: |
          git config user.name Claude
          git config user.email noreply@anthropic.com
          # The bundles are large and carry the whole player universe; the
          # choice file is the deliverable and carries no outcome data.
          git add draft/backtest/engine_seat_choices.json \
                  draft/backtest/engine_seat_choices_a0.json \
                  draft/backtest/engine_seat_choices_a2.json \
                  draft/backtest/engine_seat_choices_need1.json \
                  draft/backtest/engine_seat_choices_bye1.json \
                  draft/backtest/engine_seat_choices_auto.json \
                  draft/backtest/engine_seat_choices_slot_s0.json \
                  draft/backtest/engine_seat_choices_slot_s1.json
          git diff --cached --quiet && { echo "no changes to commit"; exit 0; }
          git commit -m "Engine seat replay: choice file from CI bundle assembly [skip deploy]"
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { echo "REBASE CONFLICT — reporting, not forcing"; exit 1; }
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "pushed"; exit 0; fi
            echo "push race, retry $i"; sleep 3
          done
          echo "CHOICE FILE COULD NOT BE PUSHED after retries"; exit 1
