name: ROUTE 1 — does ANYONE publish a DATED preseason board?

# THE QUESTION, RESTATED. It is not whether an API accepts a date parameter — both
# as-of probes asked that and both said no. It is whether ANYONE PUBLISHES A DATED
# PRESEASON BOARD. F5 does not require a date parameter; it requires a board whose
# observation date is knowable and strictly earlier than the drafts being graded.
#
# TWO THINGS LOOK LIKE ONE, AND THE PROBE MUST NOT MERGE THEM:
#
#   ARCHIVE-DATED   a capture of a live board, stamped by a third party at the
#                   moment it saw the content. The date is EVIDENCE. Strictly before
#                   the drafts, this satisfies F5.
#   CONTENT-DATED   a page that SAYS a year — "2024 ADP", MFL's /2024/export. The
#                   date is a LABEL the publisher applies, retrievable today, and
#                   nothing in it establishes what the board showed before the
#                   drafts. MFL's year aggregate ACCUMULATES over that season's whole
#                   draft calendar, which this program has already measured. A
#                   year-labelled board is as contaminated as a live one and wears a
#                   date on its face, which makes it worse: it invites the mistake.
#
# Content-dated targets are probed anyway — they are the best URLs to look for in the
# archive — but a content-dated result is reported as a LEAD, never as a satisfied
# F5, and the two counts are never summed.
#
# WHY THIS RUNS IN CI AND NOT LOCALLY. Attempted from the sandbox 2026-08-11: every
# archive.org request returned `Tunnel connection failed: 403 Forbidden` — the same
# proxy block that stops MFL while nflverse passes. That is a fact about the sandbox,
# NOT about the Archive, and reporting it as "no archived board exists" would be the
# premature negative that closed the FFC arm once already on a User-Agent failure
# that turned out to be about our own request.
#
# THE SEARCH IS AN ENUMERATION, NOT A LOOKUP. The Wayback AVAILABILITY API returns
# the capture CLOSEST to a timestamp — in either direction — so a closest-capture of
# 2024-08-15 would be marked after-cutoff while a good 2024-07-20 capture sat in the
# index unqueried. The CDX index takes a `to` bound and lists what it holds. All of
# that logic lives in draft/backtest/archived_adp.py and is tested offline; this file
# only fetches.
#
# EVERY TARGET IS ASKED TWICE. LIVE says whether the URL is real — a 404 on a path
# this probe constructed is evidence about the path, not about whether the publisher
# offers historical boards. ARCHIVED says whether a capture predating the drafts
# serves a board. Conflating them is how a probe reports "nobody publishes this" when
# it means "I guessed wrong".

on:
  workflow_dispatch:
    inputs:
      before:
        description: 'Captures must be STRICTLY earlier than this YYYYMMDD to be usable'
        required: false
        default: '20240801'
      year:
        description: 'Season the year-labelled targets should ask for'
        required: false
        default: '2024'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Probe for a dated preseason board
        env:
          BEFORE: ${{ github.event.inputs.before || '20240801' }}
          YEAR: ${{ github.event.inputs.year || '2024' }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request
          sys.path.insert(0, "draft/backtest")
          from adp_asof_probe import USER_AGENT
          import archived_adp as AA

          BEFORE = os.environ["BEFORE"]
          # archive.org rate-limits the CDX index hard, which is the most likely
          # reason 10 of 15 queries went unanswered on the first run. Spacing them is
          # cheaper than another inconclusive run.
          CDX_SPACING = float(os.environ.get("CDX_SPACING", "3"))
          YEAR = os.environ["YEAR"]

          def get(url, timeout=45, tries=1, pause=0.0):
              # HTTPError is a RESPONSE; transport failure is not. Conflating them
              # cost three iterations on the FFC arm.
              #
              # RETRY IS FOR THE CDX INDEX. First run: 10 of 15 index queries came
              # back unreached inside one 90s attempt each. archive.org rate-limits
              # CDX hard, and a single timed-out attempt is not the index saying no.
              req = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
              last = None
              for attempt in range(max(1, tries)):
                  if attempt:
                      # BETWEEN retries only. Sleeping before the FIRST attempt buys
                      # nothing and multiplies the run by the target count — caught
                      # in the dry run, which hung instead of finishing.
                      time.sleep(pause * attempt)
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          return {"status": r.status, "body": r.read(3000000)}
                  except urllib.error.HTTPError as e:
                      # A 4xx/5xx is an ANSWER from the server; retrying 429/5xx is
                      # worth it, retrying a 404 is not.
                      last = {"status": e.code, "http_error": str(e.reason), "body": b""}
                      if e.code < 429:
                          return last
                  except Exception as e:
                      last = {"transport_error": "%s: %s" % (type(e).__name__, e)}
              return last

          reach = get("https://archive.org/wayback/available?url=example.com")
          print("archive.org reachable:", {k: v for k, v in reach.items() if k != "body"})
          print()

          def live_state(url):
              r = get(url)
              if r.get("transport_error"):
                  return {"state": "unreached", "detail": r["transport_error"][:90]}, True
              if r.get("http_error"):
                  return {"state": "absent", "detail": "HTTP %s" % r.get("status")}, False
              v = AA.looks_like_a_board(r.get("body") or b"")
              return ({"state": "board" if v["is_board"] else "not-a-board",
                       "rows": v["rows_seen"], "detail": "%d bytes" % v["bytes"]}, False)

          def archived_state(url):
              # Paced and retried: this is the query that decides F5, and letting it
              # fail quietly is how the first run printed CLOSED on 10 unanswered
              # targets.
              time.sleep(CDX_SPACING)     # politeness between index queries
              r = get(AA.cdx_query(url, BEFORE), timeout=60, tries=3, pause=5.0)
              if r.get("transport_error"):
                  return {"state": "unreached", "detail": r["transport_error"][:90]}, True
              try:
                  rows = AA.parse_cdx(r.get("body") or b"")
              except Exception as e:                                   # noqa: BLE001
                  # UNREADABLE is not EMPTY. An index we could not parse has not told
                  # us there are no captures.
                  return {"state": "unreached",
                          "detail": "index unreadable: %s" % type(e).__name__}, True
              usable = AA.usable_captures(rows, BEFORE)
              if not usable:
                  return {"state": "none", "captures": 0,
                          "detail": "%d capture(s) in index, newest %s"
                                    % (len(rows), rows[0]["timestamp"] if rows else "-")}, False
              # WALK the pre-cutoff captures newest-first until one actually serves a
              # board. The newest is the best DATE, but the archive holds empty
              # captures, redirects and error pages under a 200 — measured: a 0-byte
              # capture 32 seconds after a sibling that served 422KB. Stopping at the
              # first would report "no capture serves a board" when only the newest
              # was a dud.
              got = AA.first_serving_capture(usable, lambda u: get(u).get("body") or b"")
              out = {"state": got["state"], "timestamp": got.get("timestamp"),
                     "rows": got.get("rows"), "captures": len(usable),
                     "examined": got.get("examined"),
                     "detail": "%d capture(s) tried, newest %s"
                               % (len(got.get("examined") or []), got.get("timestamp"))}
              if got["state"] == "board":
                  # THE KNOWN-ANSWER SAMPLE. A page that parses is not a page that is
                  # right, and nothing but reading the top of the board can tell.
                  out["names"] = AA.extract_names(got.get("body") or b"", 15)
              return out, False

          results, unreachable = [], 0
          for name, url, basis in AA.candidates(YEAR):
              live, _ = live_state(url)
              arch, a_bad = archived_state(url)
              # UNANSWERED IS ABOUT THE ARCHIVE QUERY ALONE. A target whose live page
              # loaded fine while its index query timed out has told us nothing about
              # whether a pre-draft capture exists, and counting it as answered is
              # what made the first run print CLOSED across 10 unanswered targets.
              unreachable += 1 if a_bad else 0
              row = AA.classify(name, basis, live, arch)
              row["url"] = url
              row["live_detail"] = live.get("detail")
              row["archived_detail"] = arch.get("detail")
              row["names"] = arch.get("names")
              row["captures_examined"] = arch.get("examined")
              results.append(row)
              # THE DETAIL IS PRINTED, not just stored. `not-a-board` on a page that
              # certainly exists is either a bot-block or our own detector, and the
              # byte count and status are what tell those apart.
              print("  %-22s %-8s live=%-12s %-22s archived=%-10s %-28s %s"
                    % (name, basis, live.get("state"), (live.get("detail") or "")[:22],
                       arch.get("state"), (arch.get("detail") or "")[:28],
                       arch.get("timestamp") or ""))

          rep = AA.route1_report(results, unreachable)

          print()
          print("===== ROUTE 1 =====")
          print(rep["verdict"])
          print()
          print()
          print("THE HAND-CHECK — are these the players who actually went early?")
          for r in results:
              if r.get("verdict") == "SATISFIES F5":
                  names = (r.get("names") or [])
                  print("  %-18s %s" % (r["target"], r.get("archived_timestamp")))
                  print("      %s" % (", ".join(names) if names
                                      else "NO NAMES EXTRACTED — the row count called it a "
                                           "board and nothing readable came out. Treat the "
                                           "hit as UNVERIFIED."))
          print()
          for label, key in (("SATISFIES F5", "satisfies_f5"),
                             ("CONTENT-DATED LEAD (not evidence)", "content_dated_leads"),
                             ("LIVE, NO PRE-CUTOFF CAPTURE", "live_but_uncaptured"),
                             ("NO BOARD AT THIS URL", "urls_that_returned_nothing")):
              rows = rep.get(key) or []
              print("%-34s %d" % (label, len(rows)))
              for r in rows:
                  print("    %-22s %s %s" % (r["target"], r.get("archived_timestamp") or "",
                                             r["url"][:80]))

          json.dump({"before": BEFORE, "year": YEAR, "rows": results, "report": rep},
                    open("archived-adp-probe.json", "w"), indent=1, default=str)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archived-adp-probe
          path: archived-adp-probe.json
