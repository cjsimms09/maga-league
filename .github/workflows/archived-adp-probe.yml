# TERRITORY: C
name: ROUTE 1 — does ANYONE publish a DATED preseason board?

# THE QUESTION, RESTATED. It is not whether an API accepts a date parameter — both
# as-of probes asked that and both said no. It is whether ANYONE PUBLISHES A DATED
# PRESEASON BOARD. F5 does not require a date parameter; it requires a board whose
# observation date is knowable and strictly earlier than the drafts being graded.
#
# TWO THINGS LOOK LIKE ONE, AND THE PROBE MUST NOT MERGE THEM:
#
#   ARCHIVE-DATED   a capture of a live board, stamped by a third party at the
#                   moment it saw the content. The date is EVIDENCE. Strictly before
#                   the drafts, this satisfies F5.
#   CONTENT-DATED   a page that SAYS a year — "2024 ADP", MFL's /2024/export. The
#                   date is a LABEL the publisher applies, retrievable today, and
#                   nothing in it establishes what the board showed before the
#                   drafts. MFL's year aggregate ACCUMULATES over that season's whole
#                   draft calendar, which this program has already measured. A
#                   year-labelled board is as contaminated as a live one and wears a
#                   date on its face, which makes it worse: it invites the mistake.
#
# Content-dated targets are probed anyway — they are the best URLs to look for in the
# archive — but a content-dated result is reported as a LEAD, never as a satisfied
# F5, and the two counts are never summed.
#
# WHY THIS RUNS IN CI AND NOT LOCALLY. Attempted from the sandbox 2026-08-11: every
# archive.org request returned `Tunnel connection failed: 403 Forbidden` — the same
# proxy block that stops MFL while nflverse passes. That is a fact about the sandbox,
# NOT about the Archive, and reporting it as "no archived board exists" would be the
# premature negative that closed the FFC arm once already on a User-Agent failure
# that turned out to be about our own request.
#
# THE SEARCH IS AN ENUMERATION, NOT A LOOKUP. The Wayback AVAILABILITY API returns
# the capture CLOSEST to a timestamp — in either direction — so a closest-capture of
# 2024-08-15 would be marked after-cutoff while a good 2024-07-20 capture sat in the
# index unqueried. The CDX index takes a `to` bound and lists what it holds. All of
# that logic lives in draft/backtest/archived_adp.py and is tested offline; this file
# only fetches.
#
# EVERY TARGET IS ASKED TWICE. LIVE says whether the URL is real — a 404 on a path
# this probe constructed is evidence about the path, not about whether the publisher
# offers historical boards. ARCHIVED says whether a capture predating the drafts
# serves a board. Conflating them is how a probe reports "nobody publishes this" when
# it means "I guessed wrong".

on:
  workflow_dispatch:
    inputs:
      before:
        description: 'Captures must be STRICTLY earlier than this YYYYMMDD to be usable'
        required: false
        default: '20240801'
      year:
        description: 'Season the year-labelled targets should ask for'
        required: false
        default: '2024'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Probe for a dated preseason board
        env:
          BEFORE: ${{ github.event.inputs.before || '20240801' }}
          YEAR: ${{ github.event.inputs.year || '2024' }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request
          sys.path.insert(0, "draft/backtest")
          from adp_asof_probe import USER_AGENT
          import archived_adp as AA

          BEFORE = os.environ["BEFORE"]
          # THE KNOWN ANSWER, read from our own board rather than hand-written. A
          # page is a board only if its names are ACTUAL PLAYERS: shape-counting
          # scored FantasyPros' navigation menu as a 422KB board and Route 1 was
          # reported OPEN on site chrome.
          KNOWN = AA.board_names(json.load(open("public/draft_data.json")))
          print("known-answer player names loaded: %d" % len(KNOWN))
          # archive.org rate-limits the CDX index hard, which is the most likely
          # reason 10 of 15 queries went unanswered on the first run. Spacing them is
          # cheaper than another inconclusive run.
          CDX_SPACING = float(os.environ.get("CDX_SPACING", "3"))
          YEAR = os.environ["YEAR"]
          # THE WALK BUDGET, AND WHY IT IS NOT 4.
          #
          # Run 31547459102 reported SATISFIES F5 = 0 and a coverage section with
          # NOTHING UNDER ITS HEADER. Both came from this pair of numbers.
          #
          # The CDX query is day-collapsed, so its rows are DAYS. The hand-check asked
          # for DEFAULT_LIMIT=8 of them and walked `tries=4` — the newest four days
          # before the cutoff. FantasyPros' overall page was walked across 28-31 July,
          # none served, and the target was booked "NO BOARD AT THIS URL" while the
          # capture at 20240712092948 — same URL, nineteen days earlier, 15 of 15 real
          # 2024 players IN ORDER against the known-answer gate — sat unexamined.
          #
          # Then the coverage pass, which only runs on targets that satisfied F5, had
          # no targets. So the run that existed to ask "how many distinct preseason
          # days serve a board" asked it of nothing.
          #
          # The window is the one already registered: preseason_window(), June 1 to
          # August 31, day-collapsed, so INDEX_DAYS is a count of days and the walk
          # budget is a number of days actually fetched. Both are env-tunable so a
          # follow-up can widen without a code change, and both are REPORTED — a
          # truncated walk now says so instead of reading as a negative.
          INDEX_DAYS = int(os.environ.get("INDEX_DAYS", "60"))
          WALK_BUDGET = int(os.environ.get("WALK_BUDGET", "12"))
          SINCE = AA.preseason_window(int(YEAR))[0]

          def get(url, timeout=45, tries=1, pause=0.0):
              # HTTPError is a RESPONSE; transport failure is not. Conflating them
              # cost three iterations on the FFC arm.
              #
              # RETRY IS FOR THE CDX INDEX. First run: 10 of 15 index queries came
              # back unreached inside one 90s attempt each. archive.org rate-limits
              # CDX hard, and a single timed-out attempt is not the index saying no.
              req = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
              last = None
              for attempt in range(max(1, tries)):
                  if attempt:
                      # BETWEEN retries only. Sleeping before the FIRST attempt buys
                      # nothing and multiplies the run by the target count — caught
                      # in the dry run, which hung instead of finishing.
                      time.sleep(pause * attempt)
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          return {"status": r.status, "body": r.read(3000000)}
                  except urllib.error.HTTPError as e:
                      # A 4xx/5xx is an ANSWER from the server; retrying 429/5xx is
                      # worth it, retrying a 404 is not.
                      last = {"status": e.code, "http_error": str(e.reason), "body": b""}
                      if e.code < 429:
                          return last
                  except Exception as e:
                      last = {"transport_error": "%s: %s" % (type(e).__name__, e)}
              return last

          reach = get("https://archive.org/wayback/available?url=example.com")
          print("archive.org reachable:", {k: v for k, v in reach.items() if k != "body"})
          print()

          def live_state(url):
              r = get(url)
              if r.get("transport_error"):
                  return {"state": "unreached", "detail": r["transport_error"][:90]}, True
              if r.get("http_error"):
                  return {"state": "absent", "detail": "HTTP %s" % r.get("status")}, False
              body = r.get("body") or b""
              shape = AA.looks_like_a_board(body)
              v = AA.board_confidence(body, KNOWN)
              return ({"state": "board" if v["is_board"] else "not-a-board",
                       "rows": v["player_hits"],
                       "detail": "%d bytes, %d/%d player names"
                                 % (shape["bytes"], v["player_hits"], v["names_seen"])}, False)

          def archived_state(url):
              # Paced and retried: this is the query that decides F5, and letting it
              # fail quietly is how the first run printed CLOSED on 10 unanswered
              # targets.
              time.sleep(CDX_SPACING)     # politeness between index queries
              r = get(AA.cdx_query(url, BEFORE, limit=INDEX_DAYS, since=SINCE),
                      timeout=60, tries=3, pause=5.0)
              if r.get("transport_error"):
                  return {"state": "unreached", "detail": r["transport_error"][:90]}, True
              try:
                  rows = AA.parse_cdx(r.get("body") or b"")
              except Exception as e:                                   # noqa: BLE001
                  # UNREADABLE is not EMPTY. An index we could not parse has not told
                  # us there are no captures.
                  return {"state": "unreached",
                          "detail": "index unreadable: %s" % type(e).__name__}, True
              usable = AA.usable_captures(rows, BEFORE)
              statuses = {}
              if not usable:
                  # FILTERING TO 200 IS A FILTER ON OUR OWN QUERY. A site that starts
                  # 301-redirecting a URL keeps being captured, under 301, and the
                  # filtered query then reports a heavily-archived page as one nobody
                  # saved. Ask again without the filter before concluding anything
                  # about the publisher, and REPORT the statuses either way.
                  time.sleep(CDX_SPACING)
                  r2 = get(AA.cdx_query(url, BEFORE, limit=INDEX_DAYS, since=SINCE,
                                        only_200=False),
                           timeout=60, tries=3, pause=5.0)
                  if not (r2 or {}).get("transport_error"):
                      try:
                          all_rows = AA.parse_cdx(r2.get("body") or b"")
                      except Exception:                            # noqa: BLE001
                          all_rows = []
                      statuses = AA.status_census(all_rows)
                      # A redirect is not a board, but it says the page LIVES. The
                      # captures still usable are the 200s among them.
                      usable = [c for c in AA.usable_captures(all_rows, BEFORE)
                                if str(c.get("statuscode")) == "200"]
              if not usable:
                  return {"state": "none", "captures": 0, "statuses": statuses,
                          "detail": "%d in filtered index; unfiltered statuses %s"
                                    % (len(rows), statuses or "{}")}, False
              # WALK the pre-cutoff captures newest-first until one actually serves a
              # board. The newest is the best DATE, but the archive holds empty
              # captures, redirects and error pages under a 200 — measured: a 0-byte
              # capture 32 seconds after a sibling that served 422KB. Stopping at the
              # first would report "no capture serves a board" when only the newest
              # was a dud.
              got = AA.first_serving_capture(
                  usable, lambda u: get(u).get("body") or b"",
                  # THE GATE IS THE KNOWN-ANSWER TEST. Passing the shape count here
                  # is what let a menu through, and the capture walk would then stop
                  # on the first piece of furniture it found.
                  judge=lambda b: AA.board_confidence(b, KNOWN),
                  # DAYS, not captures: the index is day-collapsed. Four was the old
                  # value and it walked one week of late July across an entire
                  # preseason.
                  tries=WALK_BUDGET)
              out = {"state": got["state"], "timestamp": got.get("timestamp"),
                     "rows": got.get("rows"), "captures": len(usable),
                     "examined": got.get("examined"), "statuses": statuses,
                     "detail": "%d capture(s) tried, newest %s"
                               % (len(got.get("examined") or []), got.get("timestamp"))}
              if got["state"] == "board":
                  # THE KNOWN-ANSWER SAMPLE. A page that parses is not a page that is
                  # right, and nothing but reading the top of the board can tell.
                  v = AA.board_confidence(got.get("body") or b"", KNOWN)
                  out["names"] = v["matched"]
                  out["sample_seen"] = v["sample"]
                  out["player_hits"] = v["player_hits"]
              return out, False

          results, unreachable = [], 0
          for name, url, basis in AA.candidates(YEAR):
              live, _ = live_state(url)
              arch, a_bad = archived_state(url)
              # UNANSWERED IS ABOUT THE ARCHIVE QUERY ALONE. A target whose live page
              # loaded fine while its index query timed out has told us nothing about
              # whether a pre-draft capture exists, and counting it as answered is
              # what made the first run print CLOSED across 10 unanswered targets.
              unreachable += 1 if a_bad else 0
              row = AA.classify(name, basis, live, arch)
              row["url"] = url
              row["live_detail"] = live.get("detail")
              row["archived_detail"] = arch.get("detail")
              row["names"] = arch.get("names")
              # CARRIED THROUGH, and they were not. `classify` builds the row from a
              # fixed key list, so the hand-check block printed "MATCHED PLAYERS
              # (None)" and an empty RAW SAMPLE beside fifteen correct player names —
              # the evidence was right and its own header said it was missing.
              row["player_hits"] = arch.get("player_hits")
              row["sample_seen"] = arch.get("sample_seen")
              row["captures_examined"] = arch.get("examined")
              results.append(row)
              # THE DETAIL IS PRINTED, not just stored. `not-a-board` on a page that
              # certainly exists is either a bot-block or our own detector, and the
              # byte count and status are what tell those apart.
              print("  %-22s %-8s live=%-12s %-22s archived=%-10s %-28s %s"
                    % (name, basis, live.get("state"), (live.get("detail") or "")[:22],
                       arch.get("state"), (arch.get("detail") or "")[:28],
                       arch.get("timestamp") or ""))

          # ── MIRRORS: enumerate the repository, then open what it names ────────
          print()
          print("MIRRORS — enumerated, not guessed")
          mirrors = []
          for owner, repo, branch in AA.MIRROR_REPOS:
              r = get(AA.github_tree_query(owner, repo, branch), timeout=45, tries=2, pause=3.0)
              if (r or {}).get("transport_error"):
                  print("  %-28s UNREACHED %s" % ("%s/%s" % (owner, repo),
                                                  r["transport_error"][:60]))
                  mirrors.append({"repo": "%s/%s" % (owner, repo), "state": "unreached"})
                  continue
              try:
                  listing = AA.adp_files(r.get("body") or b"")
              except Exception as e:                                 # noqa: BLE001
                  # A rate-limit or 404 body is an object too. "We were throttled"
                  # is not "this mirror holds no board".
                  print("  %-28s NOT LISTED %s: %s" % ("%s/%s" % (owner, repo),
                                                       type(e).__name__, str(e)[:60]))
                  mirrors.append({"repo": "%s/%s" % (owner, repo), "state": "not-listed",
                                  "why": "%s: %s" % (type(e).__name__, e)})
                  continue
              print("  %-28s %d blobs listed%s; %d look like a board"
                    % ("%s/%s" % (owner, repo), listing["listed"],
                       " (TRUNCATED — not a full search)" if listing["truncated"] else "",
                       len(listing["files"])))
              found = []
              for f in listing["files"][:8]:
                  body = get(AA.raw_url(owner, repo, branch, f["path"]), timeout=60).get("body") or b""
                  v = AA.board_confidence(body, KNOWN)
                  quantity = AA.quantity_of(f["path"])
                  frozen = {"frozen": None, "why": "not asked — not a board"}
                  # HOISTED BESIDE `frozen`, and not for tidiness. Python does not
                  # scope to blocks, so a `series` assigned inside the is_board branch
                  # would still be bound on the NEXT iteration — a file that is not a
                  # board would silently inherit the PREVIOUS file's commit series and
                  # be reported with coverage belonging to something else. The first
                  # iteration would raise NameError; every one after that would be
                  # quietly wrong, which is the worse half.
                  series = None
                  if v["is_board"]:
                      # ONLY ASKED FOR ACTUAL BOARDS: the commit history costs a
                      # request each and says nothing about a file that holds no
                      # players.
                      cr = get(AA.commits_query(owner, repo, f["path"]), timeout=45, tries=2, pause=3.0)
                      if (cr or {}).get("transport_error"):
                          frozen = {"frozen": False, "why": "commit history UNREACHED — "
                                    "not evidence that the file is live, and not evidence "
                                    "that it is frozen"}
                      else:
                          try:
                              frozen = AA.frozen_before(AA.commit_dates(cr.get("body") or b""), BEFORE)
                          except Exception as e:                     # noqa: BLE001
                              frozen = {"frozen": False,
                                        "why": "history unreadable (%s) — throttled is not "
                                               "empty" % type(e).__name__}
                  print("      %-46s %-7s %2d/%-2d players  %s"
                        % (f["path"][:46], quantity, v["player_hits"], v["names_seen"],
                           ("FROZEN" if frozen.get("frozen") else
                            ("NOT FROZEN" if v["is_board"] else ""))))
                  if v["is_board"]:
                      print("          %s" % frozen["why"])
                      print("          sample: %s" % ", ".join(v["matched"][:8]))
                      # THE MIRROR'S COVERAGE QUESTION, from the SAME response the
                      # frozen check already paid for. `frozen_before` reads the LAST
                      # commit; the history says how many distinct DAYS this path was
                      # written across the preseason, and each commit is retrievable at
                      # its sha. One dated board proves a board existed; a replay needs
                      # the latest snapshot before EACH draft.
                      #
                      # COMMIT-DATED, NEVER SUMMED WITH THE ARCHIVE COUNT — printed on
                      # the line so the basis cannot be lost by reading the number.
                      if not (cr or {}).get("transport_error"):
                          try:
                              ser = AA.commit_series(cr.get("body") or b"",
                                                     since=SINCE, until=BEFORE)
                              print("          series: %d commit day(s), %d in the "
                                    "preseason window [COMMIT-DATED, not archive-dated]"
                                    % (ser["n_days"], ser["n_in_window"]))
                              if ser["in_window"]:
                                  print("          dates:  %s"
                                        % ", ".join(ser["in_window"][:10]))
                              series = ser
                          except Exception as e:                     # noqa: BLE001
                              series = {"error": type(e).__name__}
                              print("          series: UNREADABLE (%s) — throttled is "
                                    "not an empty history" % type(e).__name__)
                  found.append({"path": f["path"], "quantity": quantity,
                                "player_hits": v["player_hits"], "is_board": v["is_board"],
                                "matched": v["matched"], "frozen": frozen,
                                "commit_series": series})
              mirrors.append({"repo": "%s/%s" % (owner, repo), "state": "listed",
                              "truncated": listing["truncated"],
                              "candidates": listing["files"], "opened": found})

          # ── COVERAGE: one capture is not a series ─────────────────────────────
          # A dated board proves F5 CAN be satisfied. Replaying a draft needs the
          # latest snapshot before THAT draft, so the number that decides whether
          # Route 1 is usable is how many distinct preseason DAYS serve a board.
          # Asked only for targets that already passed the known-answer gate — a
          # window query on a URL with no board would measure nothing.
          since, until = AA.preseason_window(YEAR)
          coverage = []
          for r in results:
              if r.get("verdict") != "SATISFIES F5":
                  continue
              time.sleep(CDX_SPACING)
              q = AA.cdx_query(r["url"], until, limit=200, since=since)
              cr = get(q, timeout=60, tries=3, pause=5.0)
              if (cr or {}).get("transport_error"):
                  coverage.append({"target": r["target"], "state": "unreached"}); continue
              try:
                  days = AA.capture_days(AA.parse_cdx(cr.get("body") or b""))
              except Exception as e:                                 # noqa: BLE001
                  coverage.append({"target": r["target"], "state": "unreadable",
                                   "why": type(e).__name__}); continue
              # Sample a few across the window and check each SERVES a board — a
              # capture in the index is not a capture with players in it, which is
              # the whole lesson of this probe.
              probe_days = days[:3] + days[len(days)//2:len(days)//2 + 2] + days[-2:]
              served = []
              for d in sorted(set(probe_days), reverse=True)[:6]:
                  row = {"timestamp": d + "000000", "original": r["url"]}
                  v = AA.board_confidence(get(AA.replay_url(row)).get("body") or b"", KNOWN)
                  served.append({"day": d, "player_hits": v["player_hits"],
                                 "is_board": v["is_board"]})
              coverage.append({"target": r["target"], "state": "listed",
                               "window": "%s..%s" % (since, until),
                               "capture_days": len(days),
                               "first": days[-1] if days else None,
                               "last": days[0] if days else None,
                               "sampled": served,
                               "sampled_serving": sum(1 for x in served if x["is_board"])})
          print()
          print("COVERAGE — one capture proves a board existed; a replay needs a series")
          for c in coverage:
              print("  %-22s %s" % (c["target"], {k: v for k, v in c.items()
                                                   if k not in ("target", "sampled")}))
              for x in (c.get("sampled") or []):
                  print("      %s  %s players  %s" % (x["day"], x["player_hits"],
                                                      "BOARD" if x["is_board"] else "-"))

          rep = AA.route1_report(results, unreachable)
          rep["coverage"] = coverage
          rep["mirrors"] = mirrors

          # THE MIRROR VERDICT, with the two kinds kept apart. A frozen ADP board is
          # what Route 1 needs; a frozen RANKING is a different quantity and is
          # reported beside it, never inside it.
          opened = [f for m in mirrors for f in (m.get("opened") or [])]
          usable = [f for f in opened if f["is_board"] and f["quantity"] == AA.QUANTITY_ADP
                    and (f.get("frozen") or {}).get("frozen")]
          rankings = [f for f in opened if f["is_board"] and f["quantity"] == AA.QUANTITY_ECR
                      and (f.get("frozen") or {}).get("frozen")]
          live_named = [f for f in opened if f["is_board"] and not (f.get("frozen") or {}).get("frozen")]
          print()
          print("MIRROR VERDICT")
          print("  FROZEN ADP BOARDS (what Route 1 needs):  %d" % len(usable))
          for f in usable:
              print("      %s  %s" % (f["path"], (f.get("frozen") or {}).get("last_commit")))
          print("  frozen RANKINGS (a different quantity):  %d" % len(rankings))
          for f in rankings:
              print("      %s" % f["path"])
          print("  boards still being rewritten (LIVE):     %d" % len(live_named))
          for f in live_named:
              print("      %s" % f["path"])
          rep["mirror_verdict"] = {"frozen_adp": usable, "frozen_rankings": rankings,
                                   "live": live_named}

          print()
          print("===== ROUTE 1 =====")
          print(rep["verdict"])
          print()
          print()
          print("THE HAND-CHECK — are these the players who actually went early?")
          for r in results:
              if r.get("verdict") == "SATISFIES F5":
                  names = (r.get("names") or [])
                  print("  %-18s %s" % (r["target"], r.get("archived_timestamp")))
                  print("      MATCHED PLAYERS (%s): %s"
                        % (r.get("player_hits"), ", ".join(names) if names else "NONE"))
                  print("      RAW SAMPLE: %s" % ", ".join(r.get("sample_seen") or []))
          print()
          for label, key in (("SATISFIES F5", "satisfies_f5"),
                             ("CONTENT-DATED LEAD (not evidence)", "content_dated_leads"),
                             ("LIVE, NO PRE-CUTOFF CAPTURE", "live_but_uncaptured"),
                             ("INCONCLUSIVE — WALK TRUNCATED", "inconclusive_truncated_walk"),
                             ("NO BOARD AT THIS URL", "urls_that_returned_nothing"),
                             ("UNBINNED — REPORT IS INCOMPLETE", "unbinned")):
              rows = rep.get(key) or []
              print("%-34s %d" % (label, len(rows)))
              for r in rows:
                  # THE CAPTURE COUNTS TRAVEL WITH EVERY ROW, and this is the whole
                  # reason the previous run's zero could not be read. "0 satisfy F5"
                  # after walking 4 of 30 available days and "0" after walking all 30
                  # are opposite findings printed as the same character. `x/y days`
                  # makes them different on the page.
                  ex, av = r.get("captures_examined"), r.get("pre_cutoff_captures")
                  walk = ("%s/%s days" % (ex, av)) if av not in (None, "") else "no index"
                  print("    %-22s %-15s %-13s %s"
                        % (r["target"], r.get("archived_timestamp") or "-", walk,
                           r["url"][:70]))

          json.dump({"before": BEFORE, "year": YEAR, "rows": results, "report": rep,
                     "mirrors": mirrors, "coverage": coverage},
                    open("archived-adp-probe.json", "w"), indent=1, default=str)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archived-adp-probe
          path: archived-adp-probe.json
