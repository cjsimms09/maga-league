name: ROUTE 1 — does a DATED pre-draft ADP artifact exist for a completed season?

# THE QUESTION, AND WHY IT IS NOT THE ONE ALREADY ANSWERED. The as-of probes asked
# whether a provider lets you REQUEST ADP as of a past date. Both said no. F5 does
# not require a date parameter — it requires a board OBSERVABLY FROZEN BEFORE the
# drafts being graded. A dated archived capture is exactly that.
#
# WHY THIS RUNS IN CI AND NOT LOCALLY. Attempted from the sandbox 2026-08-11: every
# archive.org request returned `Tunnel connection failed: 403 Forbidden` — the same
# proxy block that stops MFL while nflverse passes. That is a fact about the
# sandbox, NOT about the Archive, and reporting it as "no archived board exists"
# would be the identical premature negative that closed the FFC arm once already on
# a User-Agent failure that turned out to be about our own request.
#
# WHAT COUNTS AS A HIT, decided before running: a capture whose Wayback timestamp is
# STRICTLY BEFORE the cutoff, whose RAW body (not the Archive's page wrapper)
# contains a recognisable player board. A 200 with an empty or error body is NOT a
# hit, and neither is a capture dated on or after the cutoff.
#
# THE SEARCH IS AN ENUMERATION, NOT A LOOKUP. The first cut of this probe asked the
# Wayback AVAILABILITY API for the capture CLOSEST to the cutoff — which returns
# captures on either side of it. A closest-capture of 2024-08-15 would have been
# marked after-cutoff and reported as "no board", while a good 2024-07-20 capture sat
# in the index unqueried. That negative would have been a fact about the query. The
# CDX index takes a `to` bound and lists what it holds, so the answer is bounded by
# the cutoff instead of centred on it. All of that logic lives in
# draft/backtest/archived_adp.py and is tested offline; this file only fetches.

on:
  workflow_dispatch:
    inputs:
      before:
        description: 'Captures must be STRICTLY earlier than this YYYYMMDD to be usable'
        required: false
        default: '20240801'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Probe the archive
        env:
          BEFORE: ${{ github.event.inputs.before || '20240801' }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          sys.path.insert(0, "draft/backtest")
          from adp_asof_probe import USER_AGENT
          import archived_adp as AA

          BEFORE = os.environ["BEFORE"]

          def get(url, timeout=90):
              # HTTPError is a RESPONSE; transport failure is not. Conflating them
              # cost three iterations on the FFC arm.
              req = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return {"status": r.status, "body": r.read(2000000)}
              except urllib.error.HTTPError as e:
                  return {"status": e.code, "http_error": str(e.reason), "body": b""}
              except Exception as e:
                  return {"transport_error": "%s: %s" % (type(e).__name__, e)}

          reach = get("https://archive.org/wayback/available?url=example.com")
          print("archive.org reachable:", {k: v for k, v in reach.items() if k != "body"})

          TARGETS = [
            ("FFC api half-ppr 12", "https://fantasyfootballcalculator.com/api/v1/adp/half-ppr?teams=12&year=2024"),
            ("FFC api ppr 12",      "https://fantasyfootballcalculator.com/api/v1/adp/ppr?teams=12&year=2024"),
            ("FFC page half-ppr",   "https://fantasyfootballcalculator.com/adp/half-ppr/12-team/all"),
            ("FFC page ppr",        "https://fantasyfootballcalculator.com/adp/ppr"),
            ("FantasyPros half",    "https://www.fantasypros.com/nfl/adp/half-point-ppr-overall.php"),
            ("FantasyPros ppr",     "https://www.fantasypros.com/nfl/adp/ppr-overall.php"),
            ("MFL adp 2024",        "https://api.myfantasyleague.com/2024/export?TYPE=adp&JSON=1"),
          ]

          hits, out, unreachable = [], [], 0
          for name, url in TARGETS:
              r = get(AA.cdx_query(url, BEFORE))
              if r.get("transport_error"):
                  unreachable += 1
                  out.append((name, "TRANSPORT", r["transport_error"][:90])); continue
              try:
                  rows = AA.parse_cdx(r.get("body") or b"")
              except Exception as e:
                  # UNREADABLE is not EMPTY. An index we could not parse has not
                  # told us there are no captures.
                  unreachable += 1
                  out.append((name, "INDEX UNREADABLE", ("%s: %s" % (type(e).__name__, e))[:90])); continue
              usable = AA.usable_captures(rows, BEFORE)
              if not usable:
                  out.append((name, "NO PRE-CUTOFF CAPTURE",
                              "%d capture(s) in index, newest %s"
                              % (len(rows), rows[0]["timestamp"] if rows else "-"))); continue
              # The LATEST capture still preceding the cutoff: closest to the draft
              # while genuinely predating it.
              cap = usable[0]
              body = get(AA.replay_url(cap)).get("body") or b""
              v = AA.looks_like_a_board(body)
              out.append((name, "%s %s" % (cap["timestamp"], "BOARD" if v["is_board"] else "NOT A BOARD"),
                          "%d bytes, %d json-rows, %d html-rows"
                          % (v["bytes"], v["json_rows"], v["html_rows"])))
              if v["is_board"]:
                  hits.append({"target": name, "timestamp": cap["timestamp"],
                               "url": AA.replay_url(cap), "rows_seen": v["rows_seen"],
                               "pre_cutoff_captures": len(usable)})

          print("\n===== ROUTE 1 =====")
          for r in out:
              print("  %-22s %-26s %s" % (r[0], r[1], r[2]))
          print()
          print(AA.route1_verdict(hits, len(TARGETS), unreachable))
          for h in hits:
              print("   %(target)s @ %(timestamp)s (%(rows_seen)d rows, %(pre_cutoff_captures)d "
                    "pre-cutoff captures available) %(url)s" % h)

          json.dump({"before": BEFORE, "rows": out, "hits": hits,
                     "unreachable": unreachable,
                     "verdict": AA.route1_verdict(hits, len(TARGETS), unreachable)},
                    open("archived-adp-probe.json", "w"), indent=1, default=str)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archived-adp-probe
          path: archived-adp-probe.json
