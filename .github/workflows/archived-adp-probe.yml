name: ROUTE 1 — does a DATED pre-draft ADP artifact exist for a completed season?

# THE QUESTION, AND WHY IT IS NOT THE ONE ALREADY ANSWERED. The as-of probes asked
# whether a provider lets you REQUEST ADP as of a past date. Both said no. F5 does
# not require a date parameter — it requires a board OBSERVABLY FROZEN BEFORE the
# drafts being graded. A dated archived snapshot is exactly that.
#
# WHY THIS RUNS IN CI AND NOT LOCALLY. Attempted from the sandbox 2026-08-11: every
# archive.org request returned `Tunnel connection failed: 403 Forbidden` — the same
# proxy block that stops MFL while nflverse passes. That is a fact about the
# sandbox, NOT about the Archive, and reporting it as "no archived board exists"
# would be the identical premature negative that closed the FFC arm once already on
# a User-Agent failure that turned out to be about our own request.
#
# WHAT COUNTS AS A HIT, decided before running: a snapshot whose Wayback timestamp
# is STRICTLY BEFORE the drafts we would grade, which returns a body containing a
# recognisable player board. A 200 with an empty or error body is NOT a hit, and
# neither is a snapshot dated after the drafts.

on:
  workflow_dispatch:
    inputs:
      before:
        description: 'Snapshots must predate this YYYYMMDD to be usable'
        required: false
        default: '20240801'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Probe the archive
        env:
          BEFORE: ${{ github.event.inputs.before || '20240801' }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.error, urllib.parse, urllib.request
          sys.path.insert(0, "draft/backtest")
          from adp_asof_probe import USER_AGENT

          BEFORE = os.environ["BEFORE"]

          def get(url, timeout=60):
              # HTTPError is a RESPONSE; transport failure is not. Conflating them
              # cost three iterations on the FFC arm.
              req = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return {"status": r.status, "body": r.read(600000)}
              except urllib.error.HTTPError as e:
                  return {"status": e.code, "http_error": str(e.reason), "body": b""}
              except Exception as e:
                  return {"transport_error": "%s: %s" % (type(e).__name__, e)}

          reach = get("https://archive.org/wayback/available?url=example.com")
          print("archive.org reachable:", {k: v for k, v in reach.items() if k != "body"})
          if reach.get("transport_error"):
              print("!! THE ARCHIVE COULD NOT BE REACHED FROM CI EITHER. That is a "
                    "statement about egress, not about whether archived boards exist, "
                    "and Route 1 is UNANSWERED rather than closed.")

          TARGETS = [
            ("FFC api half-ppr 12", "https://fantasyfootballcalculator.com/api/v1/adp/half-ppr?teams=12&year=2024"),
            ("FFC api ppr 12",      "https://fantasyfootballcalculator.com/api/v1/adp/ppr?teams=12&year=2024"),
            ("FFC page half-ppr",   "https://fantasyfootballcalculator.com/adp/half-ppr/12-team/all"),
            ("FFC page ppr",        "https://fantasyfootballcalculator.com/adp/ppr"),
            ("FantasyPros half",    "https://www.fantasypros.com/nfl/adp/half-point-ppr-overall.php"),
            ("FantasyPros ppr",     "https://www.fantasypros.com/nfl/adp/ppr-overall.php"),
            ("MFL adp 2024",        "https://api.myfantasyleague.com/2024/export?TYPE=adp&JSON=1"),
          ]
          hits, out = [], []
          for name, url in TARGETS:
              q = "https://archive.org/wayback/available?" + urllib.parse.urlencode(
                  {"url": url, "timestamp": BEFORE})
              r = get(q)
              if r.get("transport_error"):
                  out.append((name, "TRANSPORT", r["transport_error"][:80])); continue
              try:
                  d = json.loads(r["body"].decode("utf-8", "replace"))
              except Exception as e:
                  out.append((name, "UNPARSEABLE", str(e)[:80])); continue
              snap = (d.get("archived_snapshots") or {}).get("closest") or {}
              if not snap.get("url"):
                  out.append((name, "NO SNAPSHOT", "")); continue
              stamp = str(snap.get("timestamp") or "")
              # A snapshot dated AFTER the drafts we would grade is not a pre-draft
              # board, however real it is.
              usable = stamp[:8] < BEFORE
              body = get(snap["url"]).get("body") or b""
              text = body.decode("utf-8", "replace")[:600000]
              # Is it a BOARD, or a 200 with nothing in it? Judged on content.
              names = len(re.findall(r'"name"\s*:\s*"', text)) or len(re.findall(
                  r"<td[^>]*>[A-Z][a-z]+ [A-Z][a-z]+", text))
              out.append((name, "%s %s" % (stamp, "USABLE" if usable else "AFTER-CUTOFF"),
                          "%d bytes, ~%d player-ish rows" % (len(body), names)))
              if usable and names >= 50:
                  hits.append({"target": name, "timestamp": stamp, "url": snap["url"],
                               "rows_seen": names})

          print("\n===== ROUTE 1 =====")
          for row in out:
              print("  %-22s %-22s %s" % row)
          print()
          if hits:
              print("ROUTE 1 IS OPEN: %d dated pre-cutoff board(s) found." % len(hits))
              for h in hits:
                  print("   %(target)s @ %(timestamp)s (~%(rows_seen)d rows) %(url)s" % h)
              print("An archived board with a knowable observation date satisfies F5 without "
                    "any provider supporting a date parameter. NEXT: verify the board's "
                    "CONTENT against a known answer before trusting it — a page that parses "
                    "is not a page that is right.")
          else:
              print("ROUTE 1 IS CLOSED ON THIS EVIDENCE: no snapshot dated before %s returned "
                    "a recognisable board from any probed source." % BEFORE)
              print("Stated precisely: this rules out THE SOURCES AND DATES PROBED ABOVE. It "
                    "does not rule out a paid archive, a source not listed, or a snapshot the "
                    "availability API did not surface.")
          json.dump({"before": BEFORE, "rows": out, "hits": hits},
                    open("archived-adp-probe.json", "w"), indent=1, default=str)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archived-adp-probe
          path: archived-adp-probe.json
