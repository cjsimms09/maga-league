[build]
  publish = "public"
  command = "echo 'no build step'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."backup"]
  # Tuesday 9am UTC — a weekly snapshot of every league document into Blobs.
  # Keeps the last 12; nothing to configure and nothing to remember.
  schedule = "0 9 * * 2"

[functions."app"]
  # EJS templates are read from disk at render time, so they must ship
  # alongside the bundled function code. STATUS.md + DECISIONS-NEEDED.md ship too
  # so the status dashboard can parse them live (they stay the source of truth).
  included_files = ["views/**", "STATUS.md", "DECISIONS-NEEDED.md", "TASK-AUDIT.md"]

# The web-app manifest needs its own content type — Netlify serves unknown
# extensions as application/octet-stream, and Chrome silently ignores a
# manifest that arrives with the wrong type, so "Install app" never appears.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Static assets in public/ win automatically (no force); everything else
# is handled by the express app running inside the function.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app/:splat"
  status = 200
