[build]
  publish = "public"
  # No build step — the site is static + one bundled function, and the 1.25MB
  # draft board is COMMITTED, not generated here. (Worth stating: there is no
  # data pipeline inside the Netlify build to move to Actions. The minutes were
  # never per-build cost; they were build COUNT.) The one thing the build does
  # produce is a stamp naming the deployed commit, so site-check can tell a
  # deliberately-undeployed site from a silently-stale one.
  command = "printf '{\"commit\":\"%s\",\"branch\":\"%s\",\"built_at\":\"%s\"}\\n' \"${COMMIT_REF:-unknown}\" \"${BRANCH:-unknown}\" \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\" > public/build-stamp.json"
  # DEPLOY GATE. Every push to main used to become a build — 349 of them between
  # Aug 1 and Aug 8, accelerating 31 -> 124 -> 194 a day, which consumed 75% of
  # August's build minutes. Exhausting them suspends the site until Sept 1 and
  # would take the war room down ON DRAFT DAY. Commits stay frequent; deploys
  # become deliberate: a build happens only on [deploy] in the tip commit, a
  # tag, or a manual/hook trigger. exit 0 = skip, exit 1 = build — see
  # netlify-ignore.sh and netlify-ignore.test.sh, which asserts both directions.
  ignore = "bash netlify-ignore.sh"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."backup"]
  # Tuesday 9am UTC — a weekly snapshot of every league document into Blobs.
  # Keeps the last 12; nothing to configure and nothing to remember.
  schedule = "0 9 * * 2"

[functions."grade-cron"]
  # Tuesday 12pm UTC — after the week resolves (post-MNF/waivers) and after the 9am
  # backup. THE LEARNING LOOP: grade resolved forecasts + decisions, append the
  # calibration ledger, consume it into evidence weights, stamped with the rules era.
  # This is the reader the retention audit found missing — live before the first
  # predictions resolve (September). Also manually invocable (?key=GRADE_CRON_KEY) to
  # smoke-test the path before its day.
  schedule = "0 12 * * 2"

[functions."app"]
  # EJS templates are read from disk at render time, so they must ship
  # alongside the bundled function code. STATUS.md + DECISIONS-NEEDED.md ship too
  # so the status dashboard can parse them live (they stay the source of truth).
  #
  # The League History engine (src/routes/history-data.js) reads its committed
  # harvest from disk at request time — the money/records/chronicle numbers are
  # NOT in the Blob world, they are read straight from these JSON files. esbuild
  # bundles the JS but NOT arbitrary data reads, so without these lines the files
  # are absent in the function and every /history route 500s with ENOENT while
  # the rest of the site (Blob-backed) stays up. It renders fine on the dev
  # server because that has the full repo on disk — the gap is production-only.
  # Proven by simulating a bundle of included_files alone: build() throws ENOENT
  # on league_history.json. draft_data.json is the 2026 board (player id->name).
  included_files = ["views/**", "STATUS.md", "DECISIONS-NEEDED.md", "TASK-AUDIT.md",
    "draft/data/**", "draft/config/**", "public/draft_data.json",
    "docs/MOCK-DRAFT-REHEARSAL.md"]

# The web-app manifest needs its own content type — Netlify serves unknown
# extensions as application/octet-stream, and Chrome silently ignores a
# manifest that arrives with the wrong type, so "Install app" never appears.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Static assets in public/ win automatically (no force); everything else
# is handled by the express app running inside the function.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app/:splat"
  status = 200
