[build]
  publish = "public"
  # No build step — the site is static + one bundled function, and the 1.25MB
  # draft board is COMMITTED, not generated here. (Worth stating: there is no
  # data pipeline inside the Netlify build to move to Actions. The minutes were
  # never per-build cost; they were build COUNT.) The one thing the build does
  # produce is a stamp naming the deployed commit, so site-check can tell a
  # deliberately-undeployed site from a silently-stale one.
  command = "printf '{\"commit\":\"%s\",\"branch\":\"%s\",\"built_at\":\"%s\"}\\n' \"${COMMIT_REF:-unknown}\" \"${BRANCH:-unknown}\" \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\" > public/build-stamp.json"
  # DEPLOY GATE. Every push to main used to become a build — 349 of them between
  # Aug 1 and Aug 8, accelerating 31 -> 124 -> 194 a day, which consumed 75% of
  # August's build minutes. Exhausting them suspends the site until Sept 1 and
  # would take the war room down ON DRAFT DAY. Commits stay frequent; deploys
  # become deliberate: a build happens only on [deploy] in the tip commit, a
  # tag, or a manual/hook trigger. exit 0 = skip, exit 1 = build — see
  # netlify-ignore.sh and netlify-ignore.test.sh, which asserts both directions.
  ignore = "bash netlify-ignore.sh"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."backup"]
  # Tuesday 9am UTC — a weekly snapshot of every league document into Blobs.
  # Keeps the last 12; nothing to configure and nothing to remember.
  schedule = "0 9 * * 2"

[functions."grade-cron"]
  # Tuesday 12pm UTC — after the week resolves (post-MNF/waivers) and after the 9am
  # backup. THE LEARNING LOOP: grade resolved forecasts + decisions, append the
  # calibration ledger, consume it into evidence weights, stamped with the rules era.
  # This is the reader the retention audit found missing — live before the first
  # predictions resolve (September). Also manually invocable (?key=GRADE_CRON_KEY) to
  # smoke-test the path before its day.
  schedule = "0 12 * * 2"

[functions."claims-cron"]
  # The measured wire baseline the waiver_claim resolver prices hold-priority
  # claims against (see buildDecisionResolutions). Data read from disk at run
  # time, so it must ship with the bundle — same reason app carries draft/data.
  # Absent file degrades honestly: drop-based resolutions still run, wire-based
  # ones stay pending.
  included_files = ["draft/data/wire_level.json"]
  # Sunday 13:00 UTC (~9am ET, before the 1pm slate) — EMIT this week's forecasts
  # and RESOLVE last week's, in that order and in one run. They cannot collide: by
  # Sunday morning the prior week is final (MNF included) and this week has not
  # started.
  #
  # SEPARATE FROM grade-cron ON PURPOSE. Producing a claim and grading it belong
  # in different jobs — a run that emitted and graded in one pass could grade a
  # forecast it had just written, which is the shape of every self-confirming
  # finding this project has caught. grade-cron stays on Tuesday, after the week
  # resolves.
  #
  # A claim committed after the games is not a prediction, which is why this is
  # the one job whose SCHEDULE is part of its correctness.
  schedule = "0 13 * * 0"

[functions."waiver-reco-cron"]
  # The waiver tool's recommendation, computed at run time by the SAME
  # src/waiver_reco.js the /waivers page renders from: the shared LO/W modules
  # read the committed history, config and board from disk (findFile), so the
  # bundle must carry them — same production-only ENOENT class as the app
  # function's own list above.
  included_files = ["draft/data/**", "draft/config/**", "public/draft_data.json"]
  # Wednesday 00:10 UTC = Tuesday evening ET — after MNF ends the week, before
  # waivers clear Wednesday ~3am ET. Cory, 2026-08-24: "you should be logging
  # and grading ALL recommendations everywhere even if I don't do them" — this
  # emits the tool's top claim as a waiver_claim ledger row automatically; the
  # manual page buttons remain only for recording HIS decision and reason.
  # A recommendation captured after claims process is hindsight, so like
  # claims-cron this is a job whose SCHEDULE is part of its correctness.
  # EMIT ONLY: resolution stays in claims-cron, grading in grade-cron.
  schedule = "10 0 * * 3"

[functions."lineup-reco-cron"]
  # register 287's lineup twin: the optimizer's start/sit advice, emitted by
  # the SAME liveOptimizeFor() the /lineup page renders from. The shared
  # LO modules read the committed history/config from disk — same
  # production-only ENOENT class as the app function's list below.
  included_files = ["draft/data/**", "draft/config/**", "public/draft_data.json"]
  # Sunday 12:50 UTC (~8:50am ET) — before the 1pm slate and ten minutes
  # ahead of claims-cron, on weekly-proj-snapshot's decision-time reasoning:
  # the lineup a person would have set is the pre-slate one, not Tuesday's
  # hindsight. EMIT ONLY: resolution stays in claims-cron, grading in
  # grade-cron.
  schedule = "50 12 * * 0"

[functions."player-projection-cron"]
  # Thursday 10:00 UTC — BEFORE Thursday Night Football (earliest kickoff of an
  # NFL week is ~00:20 UTC Friday). Emits per-player point forecasts for the
  # coming week, league-wide, both arms (our blend + Sleeper's line). claims-cron
  # cannot host this: it runs Sunday, AFTER TNF, and a TNF player's "projection"
  # emitted Sunday is post-hoc. Like claims-cron, this is a job whose SCHEDULE is
  # part of its correctness — the handler additionally stamps emitted_late on any
  # run at/after the week's first possible kickoff, and late rows are excluded
  # from grading (counted, never silently graded).
  #
  # EMIT ONLY. Resolution stays in claims-cron (Sunday), grading in grade-cron
  # (Tuesday): three jobs, so no run settles or grades a row it just wrote.
  # ⚠️ included_files ADDED 2026-08-24 (A) — THIS FUNCTION HAD NONE AND
  # READS REPO DATA AT RUN TIME. esbuild bundles the JS, not the data, so
  # without these globs it ENOENTs in production while running perfectly
  # on a dev server that has the whole repo on disk. Caught by
  # draft/tests/cron_bundles_cover_their_reads.test.js on its first run:
  # bundling_guard.test.js only ever read the APP function's own list, so every
  # scheduled function was outside the one guard for this class. Same globs the
  # reco crons use.
  #
  # ⚠️ AND DO NOT WRITE THE APP FUNCTION'S TOML HEADER LITERALLY IN A COMMENT
  # HERE. Two guards locate that block by SPLITTING THIS FILE on that exact
  # token, so a comment quoting it is matched instead of the real block and
  # they silently read the wrong function's globs. The first draft of this
  # comment did precisely that and turned 6/6 and 7/7 into 3/6 and 6/7.
  included_files = ["draft/data/**", "draft/config/**", "public/draft_data.json"]
  schedule = "0 10 * * 4"

[functions."analyzer-cron"]
  # Sunday 13:05 UTC — five minutes behind claims-cron, on the same reasoning:
  # a belief committed after the games is not a prediction.
  #
  # WHAT IT RECORDS AND WHY IT CANNOT WAIT. The analyzer computes a playoff
  # probability and an expected win total for every team on every render and
  # writes none of it — routes/standings.js requires `lineup` and `playoffs` and
  # nothing else, so its beliefs live for one HTTP response. Its only grading is
  # validateStandings(), which re-derives 2023-25 predictions today: a backtest,
  # not a forward record. A WEEK-4 CHECKPOINT CANNOT BE RECORDED IN WEEK 12.
  #
  # It projects through liveWeek-1, not liveWeek: teamStrength reads weeks
  # 1..throughWeek, so the week in progress would feed it a week of zeros.
  #
  # It emits, and it RESOLVES — as a separate pass over forecasts written on
  # EARLIER runs only, gated on the regular season being final in the harvested
  # history (loop closure 2026-08-15: the resolvers existed since the emitter
  # landed and nothing ever scheduled them). Until season-final each run
  # reports the pending count by name; at season-final it resolves the two
  # kinds once, deduped on forecast_key, this run's own emissions excluded —
  # a job must never settle a forecast it just made.
  # ⚠️ included_files ADDED 2026-08-24 (A) — THIS FUNCTION HAD NONE AND
  # READS REPO DATA AT RUN TIME. esbuild bundles the JS, not the data, so
  # without these globs it ENOENTs in production while running perfectly
  # on a dev server that has the whole repo on disk. Caught by
  # draft/tests/cron_bundles_cover_their_reads.test.js on its first run:
  # bundling_guard.test.js only ever read the APP function's own list, so every
  # scheduled function was outside the one guard for this class. Same globs the
  # reco crons use.
  #
  # ⚠️ AND DO NOT WRITE THE APP FUNCTION'S TOML HEADER LITERALLY IN A COMMENT
  # HERE. Two guards locate that block by SPLITTING THIS FILE on that exact
  # token, so a comment quoting it is matched instead of the real block and
  # they silently read the wrong function's globs. The first draft of this
  # comment did precisely that and turned 6/6 and 7/7 into 3/6 and 6/7.
  included_files = ["draft/data/**", "draft/config/**", "public/draft_data.json"]
  schedule = "5 13 * * 0"

[functions."app"]
  # EJS templates are read from disk at render time, so they must ship
  # alongside the bundled function code. STATUS.md + DECISIONS-NEEDED.md ship too
  # so the status dashboard can parse them live (they stay the source of truth).
  #
  # The League History engine (src/routes/history-data.js) reads its committed
  # harvest from disk at request time — the money/records/chronicle numbers are
  # NOT in the Blob world, they are read straight from these JSON files. esbuild
  # bundles the JS but NOT arbitrary data reads, so without these lines the files
  # are absent in the function and every /history route 500s with ENOENT while
  # the rest of the site (Blob-backed) stays up. It renders fine on the dev
  # server because that has the full repo on disk — the gap is production-only.
  # Proven by simulating a bundle of included_files alone: build() throws ENOENT
  # on league_history.json. draft_data.json is the 2026 board (player id->name).
  # public/js/draft/** — found LIVE on 2026-08-23, first real in-season page
  # load (Cory: "waiver tool isn't working"): src/routes/waivers.js,
  # src/slotpicker.js and the survival reader all require these shared browser
  # modules via path.join at runtime. esbuild cannot trace a dynamic require,
  # so in production the files were simply absent — /waivers 500'd naming
  # valuation.js, and /admin/slot-picker's catch turned the same absence into
  # a message blaming keepers.js. Dev servers never see it: the full repo is
  # on disk. Same production-only class as the /history ENOENT above.
  included_files = ["views/**", "STATUS.md", "DECISIONS-NEEDED.md", "TASK-AUDIT.md",
    "draft/data/**", "draft/config/**", "public/draft_data.json",
    "public/js/draft/**",
    "docs/MOCK-DRAFT-REHEARSAL.md"]

# The web-app manifest needs its own content type — Netlify serves unknown
# extensions as application/octet-stream, and Chrome silently ignores a
# manifest that arrives with the wrong type, so "Install app" never appears.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Static assets in public/ win automatically (no force); everything else
# is handled by the express app running inside the function.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app/:splat"
  status = 200
